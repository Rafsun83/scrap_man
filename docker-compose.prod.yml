# Production-like stack: API, admin panel and landing page (nginx), PostgreSQL with PostGIS, Redis, S3-compatible storage.
# Settings come from .env.prod (copy the production section of .env.example). Locally:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# In real hosting, managed Postgres/Redis/S3 usually replace the three data services (M7).
services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-bhangariwala}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bw} -d ${POSTGRES_DB:-bhangariwala}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  s3:
    image: chrislusf/seaweedfs:4.51
    command: server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - s3data:/data
      - ./docker/s3/s3.json:/etc/seaweedfs/s3.json:ro
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-bw}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bhangariwala}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (48 random characters)}
      ADMIN_PHONE: ${ADMIN_PHONE:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://s3:8333}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-bhangariwala-photos}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_CREATE_BUCKET: ${S3_CREATE_BUCKET:-false}
      SMS_PROVIDER: ${SMS_PROVIDER:-http}
      SMS_HTTP_URL: ${SMS_HTTP_URL:-}
      SMS_HTTP_API_KEY: ${SMS_HTTP_API_KEY:-}
      SMS_SENDER_ID: ${SMS_SENDER_ID:-}
      LOG_FORMAT: json
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      s3: { condition: service_started }
    ports:
      - "${API_PORT:-3000}:3000"
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: docker/admin/Dockerfile
    depends_on:
      - api
    ports:
      - "${ADMIN_PORT:-8080}:8080"
    restart: unless-stopped

  landing:
    build:
      context: .
      dockerfile: docker/landing/Dockerfile
    depends_on:
      - api
    ports:
      - "${LANDING_PORT:-8081}:8080"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  s3data:
