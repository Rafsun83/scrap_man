# Local services for development: PostgreSQL with PostGIS, Redis, and S3-compatible photo storage.
services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: bw
      POSTGRES_PASSWORD: bw_dev_password
      POSTGRES_DB: bhangariwala
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bw -d bhangariwala"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Photo storage. Any S3-compatible service works; SeaweedFS is used locally because MinIO no longer
  # publishes container images. The API creates the bucket on start in development.
  s3:
    image: chrislusf/seaweedfs:4.51
    command: server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"
    volumes:
      - s3data:/data
      - ./docker/s3/s3.json:/etc/seaweedfs/s3.json:ro

volumes:
  pgdata:
  s3data:
