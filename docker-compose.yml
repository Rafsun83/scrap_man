# Local services for development: PostgreSQL with PostGIS, and Redis.
services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: bw
      POSTGRES_PASSWORD: bw_dev_password
      POSTGRES_DB: bhangariwala
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bw -d bhangariwala"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
