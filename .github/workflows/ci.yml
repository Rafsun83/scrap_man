name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck test build

  api-e2e:
    name: API end-to-end
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: bw
          POSTGRES_PASSWORD: bw_dev_password
          POSTGRES_DB: bhangariwala_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bw -d bhangariwala_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://bw:bw_dev_password@localhost:5432/bhangariwala_test
      TEST_DATABASE_URL: postgres://bw:bw_dev_password@localhost:5432/bhangariwala_test
      REDIS_URL: redis://localhost:6379
      TEST_REDIS_URL: redis://localhost:6379/15
      JWT_SECRET: ci-only-secret-that-is-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bw/shared build
      - run: pnpm test:e2e

  docker-smoke:
    name: Production images smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and start docker-compose.prod.yml
        run: docker compose -p bw-smoke -f docker-compose.prod.yml --env-file docker/smoke.env up -d --build
      - name: Smoke test through nginx
        run: node scripts/smoke.mjs
      - name: Logs on failure
        if: failure()
        run: docker compose -p bw-smoke -f docker-compose.prod.yml --env-file docker/smoke.env logs
      - name: Stop
        if: always()
        run: docker compose -p bw-smoke -f docker-compose.prod.yml --env-file docker/smoke.env down -v
