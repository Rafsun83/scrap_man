# The public landing page. Only the public catalog endpoints are forwarded to the API container.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  location = /healthz {
    access_log off;
    return 200 'ok';
  }

  location ~ ^/api/v1/(categories|rates/today)$ {
    limit_except GET { deny all; }
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Every other API path is the admin panel's or the app's business, not this site's.
  location /api/ {
    return 404;
  }

  # Hashed assets can be cached for a long time; index.html must not be.
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
