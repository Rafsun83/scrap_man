<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>Weigh the items</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400..800&amp;family=Hind+Siliguri:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#13304A}a:hover{color:#0B7A5C}
:focus-visible{outline:3px solid #0B7A5C;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #EEF0EC; color: #13304A; font-family: 'Hind Siliguri', 'Noto Sans Bengali', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="background: #13304A; color: #FFFFFF; padding: 10px 20px 16px; display: flex; flex-direction: column; gap: 4px">
    <a href="ActivePickup.dc.html" aria-label="পেছনে যান" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; color: #FFFFFF">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Anek Bangla', 'Noto Sans Bengali', sans-serif; font-size: 26px; font-weight: 700; line-height: 1.2">ওজন লিখুন</h1>
    <span style="font-size: 15px; color: #D3DCE5">গ্রাহকের সামনে পাল্লায় ওজন করুন</span>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 12px">
    <sc-for list="{{items}}" as="it" hint-placeholder-count="3">
      <div style="background: #FFFFFF; border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
          <span style="font-size: 17px; font-weight: 700">{{it.name}}</span>
          <span style="font-size: 14px; color: #4F5B66">{{it.rateLabel}}</span>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
          <div style="display: flex; align-items: center; gap: 6px">
            <button type="button" aria-label="{{it.decLabel}}" onClick="{{it.dec}}" style="width: 48px; height: 48px; border-radius: 12px; border: 2px solid #13304A; background: #FFFFFF; color: #13304A; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
            <span aria-live="polite" style="min-width: 96px; text-align: center; font-family: 'Anek Bangla', sans-serif; font-size: 24px; font-weight: 700">{{it.kgLabel}}</span>
            <button type="button" aria-label="{{it.incLabel}}" onClick="{{it.inc}}" style="width: 48px; height: 48px; border-radius: 12px; border: 2px solid #13304A; background: #13304A; color: #FFC72C; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
          </div>
          <span style="font-family: 'Anek Bangla', sans-serif; font-size: 20px; font-weight: 700; color: #0B7A5C">{{it.lineTotal}}</span>
        </div>
      </div>
    </sc-for>

    <button type="button" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border-radius: 14px; border: 2px dashed #8A949E; background: transparent; color: #13304A; font-family: 'Hind Siliguri', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      অন্য জিনিস যোগ করুন
    </button>

    <button type="button" style="display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 10px 16px; border-radius: 14px; border: 2px solid #D5D9D3; background: #FFFFFF; color: #13304A; text-align: left; font-family: 'Hind Siliguri', sans-serif; cursor: pointer">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
      <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 700">পাল্লার ছবি তুলুন</span><span style="font-size: 13px; color: #4F5B66">গ্রাহক ছবিটি অ্যাপে দেখতে পাবেন</span></span>
    </button>

    <section aria-label="মোট" style="background: #13304A; color: #FFFFFF; border-radius: 16px; padding: 14px 18px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 14px; color: #D3DCE5">মোট ওজন</span>
        <span style="font-family: 'Anek Bangla', sans-serif; font-size: 28px; font-weight: 800; color: #FFC72C; line-height: 1.1">{{totalKg}}</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px; text-align: right">
        <span style="font-size: 14px; color: #D3DCE5">গ্রাহক পাবেন</span>
        <span style="font-family: 'Anek Bangla', sans-serif; font-size: 28px; font-weight: 800; color: #FFC72C; line-height: 1.1">{{totalTk}}</span>
      </div>
    </section>
  </main>

  <footer style="padding: 12px 20px 18px; background: #FFFFFF; border-top: 1px solid #D5D9D3">
    <a href="CollectorPay.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 14px; background: #FFC72C; color: #13304A; border: 2px solid #13304A; font-family: 'Anek Bangla', sans-serif; font-size: 19px; font-weight: 700; text-decoration: none">গ্রাহককে নিশ্চিত করতে পাঠান</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const base = [
      { id: 'iron', name: 'লোহা', rate: 50 },
      { id: 'paper', name: 'পুরোনো পত্রিকা', rate: 30 },
      { id: 'plastic', name: 'প্লাস্টিক', rate: 35 }
    ];
    const kg = (this.state && this.state.kg) || { iron: 8.5, paper: 6, plastic: 3 };
    const bn = (s) => String(s).replace(/\d/g, (d) => '০১২৩৪৫৬৭৮৯'[d]);
    const fmtKg = (x) => bn(x % 1 === 0 ? String(x) : x.toFixed(1)) + ' কেজি';
    const fmtTk = (x) => '৳' + bn(Math.round(x).toLocaleString('en-IN'));
    const setKg = (id, val) => this.setState({ kg: Object.assign({}, kg, { [id]: Math.max(0, Math.round(val * 2) / 2) }) });
    let totalKg = 0;
    let totalTk = 0;
    const items = base.map((b) => {
      const k = kg[b.id] || 0;
      totalKg += k;
      totalTk += k * b.rate;
      return {
        name: b.name,
        rateLabel: '৳' + bn(b.rate) + '/কেজি',
        kgLabel: fmtKg(k),
        lineTotal: fmtTk(k * b.rate),
        dec: () => setKg(b.id, k - 0.5),
        inc: () => setKg(b.id, k + 0.5),
        decLabel: b.name + ' আধা কেজি কমান',
        incLabel: b.name + ' আধা কেজি বাড়ান'
      };
    });
    return { items, totalKg: fmtKg(totalKg), totalTk: fmtTk(totalTk) };
  }
}
</script>
</body>
</html>
