<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>Collector sign-up</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400..800&amp;family=Hind+Siliguri:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#13304A}a:hover{color:#0B7A5C}
:focus-visible{outline:3px solid #0B7A5C;outline-offset:2px}
input::placeholder{color:#6B7580}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #EEF0EC; color: #13304A; font-family: 'Hind Siliguri', 'Noto Sans Bengali', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="background: #13304A; color: #FFFFFF; padding: 10px 20px 16px; display: flex; flex-direction: column; gap: 4px">
    <a href="Main.dc.html" aria-label="পেছনে যান" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; color: #FFFFFF">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Anek Bangla', 'Noto Sans Bengali', sans-serif; font-size: 26px; font-weight: 700; line-height: 1.2">সংগ্রাহক হিসেবে যোগ দিন</h1>
    <span style="font-size: 15px; color: #D3DCE5">যাচাই শেষে অনুরোধ পেতে শুরু করবেন</span>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="cname" style="font-size: 15px; font-weight: 600">নাম</label>
      <input id="cname" type="text" placeholder="আপনার পুরো নাম" style="min-height: 52px; border: 2px solid #D5D9D3; border-radius: 12px; padding: 0 14px; font-family: 'Hind Siliguri', sans-serif; font-size: 17px; color: #13304A; background: #FFFFFF">
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border-radius: 12px; background: #FFFFFF">
      <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; color: #4F5B66">মোবাইল নম্বর</span><span style="font-size: 17px; font-weight: 600">+৮৮০ ১৮XX-XXX২১০</span></span>
      <span style="display: flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 700; color: #0B7A5C"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>যাচাই হয়েছে</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="nid" style="font-size: 15px; font-weight: 600">জাতীয় পরিচয়পত্র (এনআইডি) নম্বর</label>
      <input id="nid" type="text" inputmode="numeric" placeholder="এনআইডি কার্ডের নম্বর" style="min-height: 52px; border: 2px solid #D5D9D3; border-radius: 12px; padding: 0 14px; font-family: 'Hind Siliguri', sans-serif; font-size: 17px; color: #13304A; background: #FFFFFF">
      <span style="font-size: 13px; color: #4F5B66">এখন শুধু নম্বর লাগবে। কার্ডের ছবি পরে চাওয়া হতে পারে।</span>
    </div>

    <div role="group" aria-labelledby="photos-label" style="display: flex; flex-direction: column; gap: 8px">
      <span id="photos-label" style="font-size: 15px; font-weight: 600">আপনার ছবি (সেলফি)</span>
      <div style="display: grid; grid-template-columns: repeat(1, minmax(0, 1fr)); gap: 8px">
        <button type="button" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 120px; padding: 12px; border-radius: 12px; border: 2px dashed #8A949E; background: #FFFFFF; color: #13304A; font-family: 'Hind Siliguri', sans-serif; font-size: 15px; font-weight: 600; line-height: 1.3; cursor: pointer"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="9" r="4"></circle><path d="M5 21a7 7 0 0 1 14 0"></path></svg>সেলফি তুলুন<span style="font-size: 13px; font-weight: 400; color: #4F5B66">মুখ পরিষ্কার দেখা যাবে, চশমা বা টুপি ছাড়া</span></button>
      </div>
    </div>

    <div role="group" aria-labelledby="area-label" style="display: flex; flex-direction: column; gap: 8px">
      <span id="area-label" style="font-size: 15px; font-weight: 600">কোন এলাকায় কাজ করবেন?</span>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <button type="button" aria-pressed="{{a0Pressed}}" onClick="{{toggleA0}}" style="min-height: 44px; padding: 0 14px; border-radius: 999px; border: 2px solid {{a0Bd}}; background: {{a0Bg}}; color: {{a0Fg}}; font-family: 'Hind Siliguri', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer">মিরপুর</button>
        <button type="button" aria-pressed="{{a1Pressed}}" onClick="{{toggleA1}}" style="min-height: 44px; padding: 0 14px; border-radius: 999px; border: 2px solid {{a1Bd}}; background: {{a1Bg}}; color: {{a1Fg}}; font-family: 'Hind Siliguri', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer">পল্লবী</button>
        <button type="button" aria-pressed="{{a2Pressed}}" onClick="{{toggleA2}}" style="min-height: 44px; padding: 0 14px; border-radius: 999px; border: 2px solid {{a2Bd}}; background: {{a2Bg}}; color: {{a2Fg}}; font-family: 'Hind Siliguri', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer">কাফরুল</button>
        <button type="button" aria-pressed="{{a3Pressed}}" onClick="{{toggleA3}}" style="min-height: 44px; padding: 0 14px; border-radius: 999px; border: 2px solid {{a3Bd}}; background: {{a3Bg}}; color: {{a3Fg}}; font-family: 'Hind Siliguri', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer">শ্যামলী</button>
        <button type="button" aria-pressed="{{a4Pressed}}" onClick="{{toggleA4}}" style="min-height: 44px; padding: 0 14px; border-radius: 999px; border: 2px solid {{a4Bd}}; background: {{a4Bg}}; color: {{a4Fg}}; font-family: 'Hind Siliguri', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer">মোহাম্মদপুর</button>
      </div>
    </div>

    <div role="radiogroup" aria-labelledby="vehicle-label" style="display: flex; flex-direction: column; gap: 8px">
      <span id="vehicle-label" style="font-size: 15px; font-weight: 600">কীভাবে মাল নেবেন?</span>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <button type="button" role="radio" aria-checked="{{v0Checked}}" onClick="{{pickV0}}" style="min-height: 48px; border-radius: 12px; border: 2px solid {{v0Bd}}; background: {{v0Bg}}; color: {{v0Fg}}; font-family: 'Hind Siliguri', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer">ভ্যান</button>
        <button type="button" role="radio" aria-checked="{{v1Checked}}" onClick="{{pickV1}}" style="min-height: 48px; border-radius: 12px; border: 2px solid {{v1Bd}}; background: {{v1Bg}}; color: {{v1Fg}}; font-family: 'Hind Siliguri', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer">ঠেলাগাড়ি</button>
        <button type="button" role="radio" aria-checked="{{v2Checked}}" onClick="{{pickV2}}" style="min-height: 48px; border-radius: 12px; border: 2px solid {{v2Bd}}; background: {{v2Bg}}; color: {{v2Fg}}; font-family: 'Hind Siliguri', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer">হেঁটে</button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <label style="display: flex; align-items: center; gap: 12px; min-height: 44px; font-size: 15px; cursor: pointer"><input type="checkbox" style="width: 22px; height: 22px; accent-color: #13304A; flex: none">আমার নিজের ওজনের পাল্লা আছে</label>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 44px; font-size: 15px; line-height: 1.4; cursor: pointer"><input type="checkbox" style="width: 22px; height: 22px; accent-color: #13304A; flex: none">সংগ্রাহক চুক্তি ও নিয়ম পড়েছি এবং মেনে নিচ্ছি</label>
    </div>
  </main>

  <footer style="padding: 12px 20px 18px; background: #FFFFFF; border-top: 1px solid #D5D9D3">
    <a href="CollectorPending.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 14px; background: #FFC72C; color: #13304A; border: 2px solid #13304A; font-family: 'Anek Bangla', sans-serif; font-size: 20px; font-weight: 700; text-decoration: none">আবেদন জমা দিন</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const areas = s.areas || [true, true, false, false, false];
    const vehicle = s.vehicle == null ? 0 : s.vehicle;
    const v = {};
    [0, 1, 2, 3, 4].forEach((i) => {
      const on = !!areas[i];
      v['a' + i + 'Pressed'] = on ? 'true' : 'false';
      v['a' + i + 'Bg'] = on ? '#13304A' : '#FFFFFF';
      v['a' + i + 'Fg'] = on ? '#FFFFFF' : '#13304A';
      v['a' + i + 'Bd'] = on ? '#13304A' : '#D5D9D3';
      v['toggleA' + i] = () => this.setState({ areas: areas.map((x, j) => (j === i ? !x : x)), vehicle });
    });
    [0, 1, 2].forEach((i) => {
      const on = vehicle === i;
      v['v' + i + 'Checked'] = on ? 'true' : 'false';
      v['v' + i + 'Bg'] = on ? '#FFF4CC' : '#FFFFFF';
      v['v' + i + 'Fg'] = '#13304A';
      v['v' + i + 'Bd'] = on ? '#13304A' : '#D5D9D3';
      v['pickV' + i] = () => this.setState({ areas, vehicle: i });
    });
    return v;
  }
}
</script>
</body>
</html>
