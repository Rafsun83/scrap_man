<x-dc>
<helmet>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #EEF0EC; color: #13304A; font-family: 'Hind Siliguri', 'Noto Sans Bengali', sans-serif; display: flex; flex-direction: column; overflow: hidden">

      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
    <a href="Tracking.dc.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 2px dashed #8A949E; color: #4F5B66; font-size: 13px; font-weight: 600; text-decoration: none">ডেমো: সংগ্রাহক গ্রহণ করেছেন</a>

      <span style="position: absolute; inset: 90px; border-radius: 50%; border: 2px solid #C9CFC8"></span>
      <span class="bw-ping" style="position: absolute; inset: 0; border-radius: 50%; background: #FFC72C"></span>
      <span style="position: absolute; left: 105px; top: 105px; width: 50px; height: 50px; border-radius: 50%; background: #13304A; color: #FFC72C; display: flex; align-items: center; justify-content: center">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5V21H3z"></path></svg>
      </span>
      <span style="position: absolute; left: 34px; top: 70px; width: 30px; height: 30px; border-radius: 50%; background: #FFFFFF; border: 2px solid #13304A; display: flex; align-items: center; justify-content: center; color: #13304A"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h11v10H3zM14 9h4l3 3v4h-7"></path></svg></span>
      <span style="position: absolute; left: 200px; top: 44px; width: 30px; height: 30px; border-radius: 50%; background: #FFFFFF; border: 2px solid #13304A; display: flex; align-items: center; justify-content: center; color: #13304A"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h11v10H3zM14 9h4l3 3v4h-7"></path></svg></span>
      <span style="position: absolute; left: 186px; top: 196px; width: 30px; height: 30px; border-radius: 50%; background: #FFFFFF; border: 2px solid #13304A; display: flex; align-items: center; justify-content: center; color: #13304A"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h11v10H3zM14 9h4l3 3v4h-7"></path></svg></span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px; text-align: center">
      <h1 style="margin: 0; font-family: 'Anek Bangla', 'Noto Sans Bengali', sans-serif; font-size: 27px; font-weight: 700; line-height: 1.25">কাছের সংগ্রাহক খোঁজা হচ্ছে</h1>
      <p style="margin: 0; font-size: 16px; line-height: 1.5; color: #4F5B66">আপনার এলাকার সংগ্রাহকেরা অনুরোধটি দেখছেন। যিনি প্রথমে গ্রহণ করবেন, তিনিই আসবেন।</p>

      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #D5D9D3">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"></path><circle cx="7.5" cy="7.5" r="1.5"></circle></svg>
        <span style="font-size: 15px; font-weight: 600">লোহা, পুরোনো পত্রিকা, প্লাস্টিক</span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #D5D9D3">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>

      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 0">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
        <span style="font-size: 15px">বাড়ি ১২, রোড ৪, ব্লক সি, মিরপুর ১০</span>
      </div>
    </section>
  </main>

  <footer style="padding: 12px 20px 18px">
    <button type="button" style="width: 100%; min-height: 52px; border-radius: 14px; border: 2px solid #D5D9D3; background: #FFFFFF; color: #A63D16; font-family: 'Hind Siliguri', sans-serif; font-size: 17px; font-weight: 700; cursor: pointer">অনুরোধ বাতিল করুন</button>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
