<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>Schedule a pickup</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400..800&amp;family=Hind+Siliguri:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#13304A}a:hover{color:#0B7A5C}
:focus-visible{outline:3px solid #0B7A5C;outline-offset:2px}
textarea::placeholder{color:#6B7580}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #EEF0EC; color: #13304A; font-family: 'Hind Siliguri', 'Noto Sans Bengali', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 12px 20px 8px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="SelectItems.dc.html" aria-label="পেছনে যান" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; color: #13304A">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      </a>
      <span style="font-size: 14px; font-weight: 600; color: #4F5B66">ধাপ ২/২</span>
    </div>
    <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
      <span style="height: 6px; border-radius: 3px; background: #13304A"></span>
      <span style="height: 6px; border-radius: 3px; background: #13304A"></span>
    </div>
    <h1 style="margin: 6px 0 0; font-family: 'Anek Bangla', 'Noto Sans Bengali', sans-serif; font-size: 28px; font-weight: 700; line-height: 1.2">কখন নিতে আসবে?</h1>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 8px 20px 20px; display: flex; flex-direction: column; gap: 20px">
    <section aria-labelledby="addr-label" style="background: #FFFFFF; border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: flex-start; gap: 12px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 2px"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
          <span id="addr-label" style="font-size: 14px; color: #4F5B66">ঠিকানা</span>
          <span style="font-size: 16px; font-weight: 600; line-height: 1.4">বাড়ি ১২, রোড ৪, ব্লক সি, মিরপুর ১০, ঢাকা</span>
        </div>
        <button type="button" style="flex: none; min-height: 44px; padding: 0 4px; border: 0; background: transparent; color: #0B7A5C; font-family: 'Hind Siliguri', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer">বদলান</button>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="note" style="font-size: 14px; font-weight: 600">সংগ্রাহকের জন্য নোট (ঐচ্ছিক)</label>
        <textarea id="note" rows="2" placeholder="যেমন: বাড়ির নিচে কেয়ারটেকারকে বলবেন" style="resize: none; border: 2px solid #D5D9D3; border-radius: 12px; padding: 10px 12px; font-family: 'Hind Siliguri', sans-serif; font-size: 15px; color: #13304A; background: #FFFFFF"></textarea>
      </div>
    </section>

    <div role="group" aria-labelledby="day-label" style="display: flex; flex-direction: column; gap: 10px">
      <span id="day-label" style="font-family: 'Anek Bangla', 'Noto Sans Bengali', sans-serif; font-size: 19px; font-weight: 700">দিন</span>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <button type="button" aria-pressed="{{d0Pressed}}" onClick="{{pickD0}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 64px; border-radius: 12px; border: 2px solid {{d0Bd}}; background: {{d0Bg}}; color: {{d0Fg}}; font-family: 'Hind Siliguri', sans-serif; cursor: pointer"><span style="font-size: 16px; font-weight: 700">আজ</span><span style="font-size: 13px">বুধ, ১১ নভে.</span></button>
        <button type="button" aria-pressed="{{d1Pressed}}" onClick="{{pickD1}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 64px; border-radius: 12px; border: 2px solid {{d1Bd}}; background: {{d1Bg}}; color: {{d1Fg}}; font-family: 'Hind Siliguri', sans-serif; cursor: pointer"><span style="font-size: 16px; font-weight: 700">আগামীকাল</span><span style="font-size: 13px">বৃহঃ, ১২ নভে.</span></button>
        <button type="button" aria-pressed="{{d2Pressed}}" onClick="{{pickD2}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 64px; border-radius: 12px; border: 2px solid {{d2Bd}}; background: {{d2Bg}}; color: {{d2Fg}}; font-family: 'Hind Siliguri', sans-serif; cursor: pointer"><span style="font-size: 16px; font-weight: 700">শুক্রবার</span><span style="font-size: 13px">১৩ নভে.</span></button>
      </div>
    </div>

    <div role="group" aria-labelledby="slot-label" style="display: flex; flex-direction: column; gap: 10px">
      <span id="slot-label" style="font-family: 'Anek Bangla', 'Noto Sans Bengali', sans-serif; font-size: 19px; font-weight: 700">সময়</span>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <button type="button" aria-pressed="{{s0Pressed}}" onClick="{{pickS0}}" style="display: flex; align-items: center; justify-content: space-between; min-height: 52px; padding: 0 16px; border-radius: 12px; border: 2px solid {{s0Bd}}; background: {{s0Bg}}; color: #13304A; font-family: 'Hind Siliguri', sans-serif; font-size: 16px; font-weight: 600; cursor: pointer"><span>সকাল ৯টা–১২টা</span><span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 50%; box-sizing: border-box; border: {{s0Dot}}"></span></button>
        <button type="button" aria-pressed="{{s1Pressed}}" onClick="{{pickS1}}" style="display: flex; align-items: center; justify-content: space-between; min-height: 52px; padding: 0 16px; border-radius: 12px; border: 2px solid {{s1Bd}}; background: {{s1Bg}}; color: #13304A; font-family: 'Hind Siliguri', sans-serif; font-size: 16px; font-weight: 600; cursor: pointer"><span>দুপুর ১২টা–৩টা</span><span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 50%; box-sizing: border-box; border: {{s1Dot}}"></span></button>
        <button type="button" aria-pressed="{{s2Pressed}}" onClick="{{pickS2}}" style="display: flex; align-items: center; justify-content: space-between; min-height: 52px; padding: 0 16px; border-radius: 12px; border: 2px solid {{s2Bd}}; background: {{s2Bg}}; color: #13304A; font-family: 'Hind Siliguri', sans-serif; font-size: 16px; font-weight: 600; cursor: pointer"><span>বিকেল ৩টা–৬টা</span><span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 50%; box-sizing: border-box; border: {{s2Dot}}"></span></button>
      </div>
    </div>

    <section aria-labelledby="sum-label" style="border: 2px solid #13304A; border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
      <span id="sum-label" style="font-family: 'Anek Bangla', 'Noto Sans Bengali', sans-serif; font-size: 18px; font-weight: 700">আপনার বিক্রি</span>
      <div style="display: flex; flex-wrap: wrap; gap: 6px">
        <span style="padding: 4px 12px; border-radius: 999px; background: #FFFFFF; font-size: 14px; font-weight: 600">লোহা</span>
        <span style="padding: 4px 12px; border-radius: 999px; background: #FFFFFF; font-size: 14px; font-weight: 600">পুরোনো পত্রিকা</span>
        <span style="padding: 4px 12px; border-radius: 999px; background: #FFFFFF; font-size: 14px; font-weight: 600">প্লাস্টিক</span>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px">
        <span style="font-size: 15px">আনুমানিক পাবেন</span>
        <span style="font-family: 'Anek Bangla', 'Noto Sans Bengali', sans-serif; font-size: 22px; font-weight: 700; color: #0B7A5C">৳২০০–৬০০</span>
      </div>
      <span style="font-size: 14px; color: #4F5B66">চূড়ান্ত টাকা আপনার সামনে ওজনের পর ঠিক হবে।</span>
    </section>
  </main>

  <footer style="padding: 14px 20px 18px; background: #FFFFFF; border-top: 1px solid #D5D9D3">
    <a href="Searching.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 14px; background: #FFC72C; color: #13304A; border: 2px solid #13304A; font-family: 'Anek Bangla', sans-serif; font-size: 20px; font-weight: 700; text-decoration: none">অনুরোধ পাঠান</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const day = s.day == null ? 0 : s.day;
    const slot = s.slot == null ? 0 : s.slot;
    const v = {};
    [0, 1, 2].forEach((i) => {
      const on = day === i;
      v['d' + i + 'Pressed'] = on ? 'true' : 'false';
      v['d' + i + 'Bg'] = on ? '#13304A' : '#FFFFFF';
      v['d' + i + 'Fg'] = on ? '#FFFFFF' : '#13304A';
      v['d' + i + 'Bd'] = on ? '#13304A' : '#D5D9D3';
      v['pickD' + i] = () => this.setState({ day: i, slot });
      const son = slot === i;
      v['s' + i + 'Pressed'] = son ? 'true' : 'false';
      v['s' + i + 'Bg'] = son ? '#FFF4CC' : '#FFFFFF';
      v['s' + i + 'Bd'] = son ? '#13304A' : '#D5D9D3';
      v['s' + i + 'Dot'] = son ? '6px solid #13304A' : '2px solid #8A949E';
      v['pickS' + i] = () => this.setState({ day, slot: i });
    });
    return v;
  }
}
</script>
</body>
</html>
