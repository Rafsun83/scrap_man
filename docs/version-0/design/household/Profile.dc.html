<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>Profile and addresses</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400..800&amp;family=Hind+Siliguri:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#13304A}a:hover{color:#0B7A5C}
:focus-visible{outline:3px solid #0B7A5C;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #EEF0EC; color: #13304A; font-family: 'Hind Siliguri', 'Noto Sans Bengali', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <main style="flex: 1; overflow-y: auto; padding: 20px 20px 20px; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; align-items: center; gap: 14px">
      <span aria-hidden="true" style="flex: none; width: 64px; height: 64px; border-radius: 50%; background: #FFC72C; border: 2px solid #13304A; display: flex; align-items: center; justify-content: center; font-family: 'Anek Bangla', sans-serif; font-size: 28px; font-weight: 800">রা</span>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
        <h1 style="margin: 0; font-family: 'Anek Bangla', 'Noto Sans Bengali', sans-serif; font-size: 24px; font-weight: 700; line-height: 1.2">রাশেদা বেগম</h1>
        <span style="font-size: 15px; color: #4F5B66">+৮৮০ ১৭XX-XXX৪৫৬</span>
      </div>
      <button type="button" aria-label="প্রোফাইল সম্পাদনা" style="flex: none; width: 48px; height: 48px; border-radius: 14px; border: 0; background: #FFFFFF; color: #13304A; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg></button>
    </div>

    <section aria-labelledby="addr-title" style="display: flex; flex-direction: column; gap: 8px">
      <h2 id="addr-title" style="margin: 0; font-family: 'Anek Bangla', 'Noto Sans Bengali', sans-serif; font-size: 20px; font-weight: 700">সংরক্ষিত ঠিকানা</h2>
      <div style="background: #FFFFFF; border-radius: 14px; padding: 0 16px">
        <div style="display: flex; align-items: flex-start; gap: 12px; padding: 14px 0; border-bottom: 1px solid #D5D9D3">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="#FFC72C" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 2px"><path d="M3 10.5L12 3l9 7.5V21H3z"></path></svg>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
            <span style="display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700">বাসা <span style="padding: 1px 8px; border-radius: 999px; background: #13304A; color: #FFFFFF; font-size: 12px; font-weight: 600">মূল ঠিকানা</span></span>
            <span style="font-size: 14px; color: #4F5B66; line-height: 1.45">বাড়ি ১২, রোড ৪, ব্লক সি, মিরপুর ১০, ঢাকা</span>
          </div>
          <button type="button" aria-label="বাসার ঠিকানা সম্পাদনা" style="flex: none; width: 44px; height: 44px; border: 0; background: transparent; color: #13304A; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg></button>
        </div>
        <div style="display: flex; align-items: flex-start; gap: 12px; padding: 14px 0; border-bottom: 1px solid #D5D9D3">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 2px"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 16px; font-weight: 700">মায়ের বাসা</span>
            <span style="font-size: 14px; color: #4F5B66; line-height: 1.45">ফ্ল্যাট ৩বি, রোড ২, শ্যামলী, ঢাকা</span>
          </div>
          <button type="button" aria-label="মায়ের বাসার ঠিকানা সম্পাদনা" style="flex: none; width: 44px; height: 44px; border: 0; background: transparent; color: #13304A; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg></button>
        </div>
        <button type="button" style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 52px; padding: 0; border: 0; background: transparent; color: #0B7A5C; font-family: 'Hind Siliguri', sans-serif; font-size: 16px; font-weight: 700; cursor: pointer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
          নতুন ঠিকানা যোগ করুন
        </button>
      </div>
    </section>

    <section aria-labelledby="settings-title" style="display: flex; flex-direction: column; gap: 8px">
      <h2 id="settings-title" style="margin: 0; font-family: 'Anek Bangla', 'Noto Sans Bengali', sans-serif; font-size: 20px; font-weight: 700">সেটিংস</h2>
      <div style="background: #FFFFFF; border-radius: 14px; padding: 0 16px">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; border-bottom: 1px solid #D5D9D3">
          <span id="lang-label" style="font-size: 16px; font-weight: 600">ভাষা</span>
          <div role="group" aria-labelledby="lang-label" style="display: flex; gap: 4px; padding: 3px; border-radius: 10px; background: #EEF0EC">
            <button type="button" aria-pressed="{{bnPressed}}" onClick="{{pickBn}}" style="min-height: 40px; padding: 0 14px; border-radius: 8px; border: 0; background: {{bnBg}}; color: {{bnFg}}; font-family: 'Hind Siliguri', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer">বাংলা</button>
            <button type="button" aria-pressed="{{enPressed}}" onClick="{{pickEn}}" style="min-height: 40px; padding: 0 14px; border-radius: 8px; border: 0; background: {{enBg}}; color: {{enFg}}; font-family: 'Hind Siliguri', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer">English</button>
          </div>
        </div>
        <a href="Notifications.dc.html" style="display: flex; align-items: center; justify-content: space-between; min-height: 56px; border-bottom: 1px solid #D5D9D3; font-size: 16px; font-weight: 600; color: #13304A; text-decoration: none">নোটিফিকেশন<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
        <a href="#help" style="display: flex; align-items: center; justify-content: space-between; min-height: 56px; border-bottom: 1px solid #D5D9D3; font-size: 16px; font-weight: 600; color: #13304A; text-decoration: none">সাহায্য ও যোগাযোগ<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
        <a href="#terms" style="display: flex; align-items: center; justify-content: space-between; min-height: 56px; font-size: 16px; font-weight: 600; color: #13304A; text-decoration: none">শর্তাবলি ও গোপনীয়তা<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
      </div>
    </section>

    <a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 14px; border: 2px solid #D5D9D3; background: #FFFFFF; color: #A63D16; font-size: 16px; font-weight: 700; text-decoration: none">লগ আউট</a>
  </main>

  <nav aria-label="প্রধান মেনু" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #D5D9D3; padding: 6px 8px 10px">
    <a href="Home.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 56px; font-size: 13px; color: #4F5B66; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5V21H3z"></path><path d="M9 21v-6h6v6"></path></svg>
      হোম
    </a>
    <a href="SelectItems.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 56px; font-size: 13px; color: #4F5B66; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"></path><circle cx="7.5" cy="7.5" r="1.5"></circle></svg>
      বিক্রি
    </a>
    <a href="History.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 56px; font-size: 13px; color: #4F5B66; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
      ইতিহাস
    </a>
    <a href="Profile.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 56px; font-size: 13px; font-weight: 700; color: #13304A; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="#FFC72C" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>
      প্রোফাইল
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const lang = (this.state && this.state.lang) || 'bn';
    const bn = lang === 'bn';
    return {
      bnPressed: bn ? 'true' : 'false',
      enPressed: bn ? 'false' : 'true',
      bnBg: bn ? '#13304A' : 'transparent',
      bnFg: bn ? '#FFFFFF' : '#13304A',
      enBg: bn ? 'transparent' : '#13304A',
      enFg: bn ? '#13304A' : '#FFFFFF',
      pickBn: () => this.setState({ lang: 'bn' }),
      pickEn: () => this.setState({ lang: 'en' })
    };
  }
}
</script>
</body>
</html>
