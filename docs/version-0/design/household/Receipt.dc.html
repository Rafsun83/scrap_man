<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>Payment received</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400..800&amp;family=Hind+Siliguri:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#13304A}a:hover{color:#0B7A5C}
:focus-visible{outline:3px solid #0B7A5C;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #EEF0EC; color: #13304A; font-family: 'Hind Siliguri', 'Noto Sans Bengali', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <main style="flex: 1; overflow-y: auto; padding: 40px 20px 20px; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
      <span aria-hidden="true" style="width: 72px; height: 72px; border-radius: 50%; background: #0B7A5C; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
      <h1 style="margin: 4px 0 0; font-family: 'Anek Bangla', 'Noto Sans Bengali', sans-serif; font-size: 44px; font-weight: 800; line-height: 1.05">৳৭১০ পেয়েছেন</h1>
      <p style="margin: 0; font-size: 16px; line-height: 1.5">বিকাশে পাঠানো হয়েছে: ০১৭XX-XXX৪৫৬</p>
      <p style="margin: 0; font-size: 14px; color: #4F5B66">১১ নভেম্বর, সকাল ১০:২০</p>
    </div>

    <section aria-labelledby="rcpt-label" style="background: #FFFFFF; border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
      <h2 id="rcpt-label" style="margin: 0; font-family: 'Anek Bangla', 'Noto Sans Bengali', sans-serif; font-size: 18px; font-weight: 700">রসিদ</h2>
      <div style="display: flex; justify-content: space-between; gap: 12px; font-size: 15px"><span>লোহা, ৮.৫ কেজি</span><span style="font-weight: 600">৳৪২৫</span></div>
      <div style="display: flex; justify-content: space-between; gap: 12px; font-size: 15px"><span>পুরোনো পত্রিকা, ৬ কেজি</span><span style="font-weight: 600">৳১৮০</span></div>
      <div style="display: flex; justify-content: space-between; gap: 12px; font-size: 15px"><span>প্লাস্টিক, ৩ কেজি</span><span style="font-weight: 600">৳১০৫</span></div>
      <div style="display: flex; justify-content: space-between; gap: 12px; padding-top: 10px; border-top: 2px solid #13304A; font-size: 17px; font-weight: 700"><span>মোট, ১৭.৫ কেজি</span><span style="color: #0B7A5C">৳৭১০</span></div>
      <span style="font-size: 14px; color: #4F5B66">সংগ্রাহক: জসিম উদ্দিন</span>
    </section>

    <section aria-labelledby="rate-label" style="display: flex; flex-direction: column; align-items: center; gap: 8px">
      <h2 id="rate-label" style="margin: 0; font-family: 'Anek Bangla', 'Noto Sans Bengali', sans-serif; font-size: 19px; font-weight: 700">জসিমের সেবা কেমন ছিল?</h2>
      <div style="display: flex; gap: 4px">
        <sc-for list="{{stars}}" as="st" hint-placeholder-count="5">
          <button type="button" aria-label="{{st.label}}" aria-pressed="{{st.pressed}}" onClick="{{st.pick}}" style="width: 48px; height: 48px; border: 0; background: transparent; color: #13304A; display: flex; align-items: center; justify-content: center; cursor: pointer">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="{{st.fill}}" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3l-5.6 2.9 1.1-6.2L3 9.6l6.2-.9z"></path></svg>
          </button>
        </sc-for>
      </div>
    </section>
  </main>

  <footer style="padding: 12px 20px 18px; display: flex; flex-direction: column; gap: 8px">
    <a href="Home.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 14px; background: #FFC72C; color: #13304A; border: 2px solid #13304A; font-family: 'Anek Bangla', sans-serif; font-size: 20px; font-weight: 700; text-decoration: none">হোমে ফিরুন</a>
    <button type="button" style="min-height: 52px; border-radius: 14px; border: 2px solid #D5D9D3; background: #FFFFFF; color: #13304A; font-family: 'Hind Siliguri', sans-serif; font-size: 16px; font-weight: 700; cursor: pointer">রসিদ শেয়ার করুন</button>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const rating = (this.state && this.state.rating) || 0;
    const bn = (n) => String(n).replace(/\d/g, (d) => '০১২৩৪৫৬৭৮৯'[d]);
    const stars = [1, 2, 3, 4, 5].map((n) => ({
      label: bn(n) + ' স্টার',
      pressed: n === rating ? 'true' : 'false',
      fill: n <= rating ? '#FFC72C' : 'none',
      pick: () => this.setState({ rating: n })
    }));
    return { stars };
  }
}
</script>
</body>
</html>
