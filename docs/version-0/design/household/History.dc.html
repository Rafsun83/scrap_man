<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>Pickup history</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400..800&amp;family=Hind+Siliguri:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#13304A}a:hover{color:#0B7A5C}
:focus-visible{outline:3px solid #0B7A5C;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #EEF0EC; color: #13304A; font-family: 'Hind Siliguri', 'Noto Sans Bengali', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 20px 20px 8px; display: flex; flex-direction: column; gap: 14px">
    <h1 style="margin: 0; font-family: 'Anek Bangla', 'Noto Sans Bengali', sans-serif; font-size: 28px; font-weight: 700; line-height: 1.2">আমার বিক্রি</h1>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border-radius: 14px; background: #13304A; color: #FFFFFF">
        <span style="font-size: 13px; color: #D3DCE5">এ পর্যন্ত পেয়েছেন</span>
        <span style="font-family: 'Anek Bangla', sans-serif; font-size: 26px; font-weight: 800; color: #FFC72C; line-height: 1.15">৳১,৪৭০</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border-radius: 14px; background: #13304A; color: #FFFFFF">
        <span style="font-size: 13px; color: #D3DCE5">মোট বিক্রি</span>
        <span style="font-family: 'Anek Bangla', sans-serif; font-size: 26px; font-weight: 800; color: #FFC72C; line-height: 1.15">৩৮.৫ কেজি</span>
      </div>
    </div>
    <div role="group" aria-label="ফিল্টার" style="display: flex; gap: 8px; overflow-x: auto">
      <button type="button" aria-pressed="{{allPressed}}" onClick="{{pickAll}}" style="flex: none; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 2px solid {{allBd}}; background: {{allBg}}; color: {{allFg}}; font-family: 'Hind Siliguri', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer">সব</button>
      <button type="button" aria-pressed="{{activePressed}}" onClick="{{pickActive}}" style="flex: none; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 2px solid {{activeBd}}; background: {{activeBg}}; color: {{activeFg}}; font-family: 'Hind Siliguri', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer">চলতি</button>
      <button type="button" aria-pressed="{{donePressed}}" onClick="{{pickDone}}" style="flex: none; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 2px solid {{doneBd}}; background: {{doneBg}}; color: {{doneFg}}; font-family: 'Hind Siliguri', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer">সম্পন্ন</button>
      <button type="button" aria-pressed="{{cancelledPressed}}" onClick="{{pickCancelled}}" style="flex: none; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 2px solid {{cancelledBd}}; background: {{cancelledBg}}; color: {{cancelledFg}}; font-family: 'Hind Siliguri', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer">বাতিল</button>
    </div>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 8px 20px 20px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
      <a href="{{r.href}}" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-radius: 14px; background: #FFFFFF; color: #13304A; text-decoration: none">
        <span style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
          <span style="font-size: 16px; font-weight: 700">{{r.items}}</span>
          <span style="font-size: 14px; color: #4F5B66">{{r.meta}}</span>
        </span>
        <span style="flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 6px">
          <span style="font-family: 'Anek Bangla', sans-serif; font-size: 19px; font-weight: 700; color: #0B7A5C">{{r.amount}}</span>
          <span style="padding: 2px 10px; border-radius: 999px; background: {{r.badgeBg}}; color: {{r.badgeFg}}; font-size: 13px; font-weight: 600">{{r.statusLabel}}</span>
        </span>
      </a>
    </sc-for>
    <sc-if value="{{isEmpty}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 32px 20px; border-radius: 14px; background: #FFFFFF; text-align: center">
        <span style="font-size: 17px; font-weight: 700">এখন কোনো চলতি অনুরোধ নেই</span>
        <span style="font-size: 15px; color: #4F5B66">বাসায় পুরোনো জিনিস জমলে একটি অনুরোধ পাঠান।</span>
        <a href="SelectItems.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 20px; border-radius: 12px; background: #FFC72C; color: #13304A; border: 2px solid #13304A; font-size: 16px; font-weight: 700; text-decoration: none">ভাঙ্গারি বিক্রি করুন</a>
      </div>
    </sc-if>
  </main>

  <nav aria-label="প্রধান মেনু" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #D5D9D3; padding: 6px 8px 10px">
    <a href="Home.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 56px; font-size: 13px; color: #4F5B66; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5V21H3z"></path><path d="M9 21v-6h6v6"></path></svg>
      হোম
    </a>
    <a href="SelectItems.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 56px; font-size: 13px; color: #4F5B66; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"></path><circle cx="7.5" cy="7.5" r="1.5"></circle></svg>
      বিক্রি
    </a>
    <a href="History.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 56px; font-size: 13px; font-weight: 700; color: #13304A; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="#FFC72C" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
      ইতিহাস
    </a>
    <a href="Profile.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 56px; font-size: 13px; color: #4F5B66; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>
      প্রোফাইল
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const filter = (this.state && this.state.filter) || 'all';
    const all = [
      { items: 'লোহা, পুরোনো পত্রিকা, প্লাস্টিক', meta: 'আজ, ১১ নভেম্বর, ১৭.৫ কেজি', amount: '৳৭১০', status: 'done', href: 'Receipt.dc.html' },
      { items: 'লোহা, পুরোনো পত্রিকা', meta: '৩ নভেম্বর, ১২ কেজি', amount: '৳৫২০', status: 'done', href: 'Receipt.dc.html' },
      { items: 'কার্টন, প্লাস্টিক', meta: '১৮ অক্টোবর, ৯ কেজি', amount: '৳২৪০', status: 'done', href: 'Receipt.dc.html' },
      { items: 'ইলেকট্রনিক্স', meta: '৫ অক্টোবর, আপনি বাতিল করেছেন', amount: '', status: 'cancelled', href: '#cancelled' }
    ];
    const label = { done: 'সম্পন্ন', cancelled: 'বাতিল', active: 'চলতি' };
    const bg = { done: '#DCEFE7', cancelled: '#E2E6E0', active: '#FFF4CC' };
    const fg = { done: '#0B5C45', cancelled: '#3F4A54', active: '#13304A' };
    const rows = all
      .filter((r) => filter === 'all' || r.status === filter)
      .map((r) => Object.assign({}, r, { statusLabel: label[r.status], badgeBg: bg[r.status], badgeFg: fg[r.status] }));
    const v = { rows, isEmpty: rows.length === 0 };
    ['all', 'active', 'done', 'cancelled'].forEach((k) => {
      const on = filter === k;
      v[k + 'Pressed'] = on ? 'true' : 'false';
      v[k + 'Bg'] = on ? '#13304A' : '#FFFFFF';
      v[k + 'Fg'] = on ? '#FFFFFF' : '#13304A';
      v[k + 'Bd'] = on ? '#13304A' : '#D5D9D3';
      v['pick' + k.charAt(0).toUpperCase() + k.slice(1)] = () => this.setState({ filter: k });
    });
    return v;
  }
}
</script>
</body>
</html>
