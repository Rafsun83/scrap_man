<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>BhangariWala home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400..800&amp;family=Hind+Siliguri:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#13304A}a:hover{color:#0B7A5C}
:focus-visible{outline:3px solid #0B7A5C;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #EEF0EC; color: #13304A; font-family: 'Hind Siliguri', 'Noto Sans Bengali', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 20px 20px 12px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-family: 'Anek Bangla', 'Noto Sans Bengali', sans-serif; font-size: 26px; font-weight: 700; line-height: 1.2">শুভ সকাল, রাশেদা</h1>
      <button type="button" style="display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0; border: 0; background: transparent; color: #13304A; font-family: 'Hind Siliguri', sans-serif; font-size: 16px; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
        মিরপুর ১০, ঢাকা
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
    </div>
    <a href="Notifications.dc.html" aria-label="নোটিফিকেশন" style="flex: none; width: 48px; height: 48px; border-radius: 14px; border: 0; background: #FFFFFF; color: #13304A; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
    </a>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 4px 20px 20px; display: flex; flex-direction: column; gap: 18px">
    <section aria-labelledby="rate-title" style="background: #FFC72C; border: 2px solid #13304A; border-radius: 16px; padding: 18px 18px 12px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px">
        <h2 id="rate-title" style="margin: 0; font-family: 'Anek Bangla', 'Noto Sans Bengali', sans-serif; font-size: 30px; font-weight: 800; line-height: 1.1">আজকের দর</h2>
        <span style="font-size: 15px; font-weight: 600">১১ নভেম্বর</span>
      </div>
      <span style="font-size: 14px; margin-top: -6px">প্রতি কেজি, টাকায়</span>
      <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 4px">
        <sc-for list="{{rates}}" as="r" hint-placeholder-count="5">
          <div style="display: flex; align-items: baseline; gap: 8px; font-size: 18px; font-weight: 500">
            <span>{{r.name}}</span>
            <span aria-hidden="true" style="flex: 1; border-bottom: 2px dotted #13304A; transform: translateY(-5px)"></span>
            <span style="font-family: 'Anek Bangla', 'Noto Sans Bengali', sans-serif; font-size: 21px; font-weight: 700">৳{{r.price}}</span>
          </div>
        </sc-for>
      </div>
      <a href="Rates.dc.html" style="align-self: flex-start; display: flex; align-items: center; min-height: 44px; font-size: 16px; font-weight: 600; color: #13304A">সব দর দেখুন</a>
    </section>

    <a href="SelectItems.dc.html" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 84px; padding: 0 16px 0 20px; border-radius: 16px; background: #13304A; color: #FFFFFF; text-decoration: none">
      <span style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-family: 'Anek Bangla', 'Noto Sans Bengali', sans-serif; font-size: 23px; font-weight: 700; line-height: 1.2">ভাঙ্গারি বিক্রি করুন</span>
        <span style="font-size: 15px; color: #D3DCE5">সংগ্রাহক বাসায় এসে নিয়ে যাবেন</span>
      </span>
      <span style="flex: none; width: 48px; height: 48px; border-radius: 50%; background: #FFC72C; color: #13304A; display: flex; align-items: center; justify-content: center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
      </span>
    </a>

    <section aria-labelledby="recent-title" style="display: flex; flex-direction: column; gap: 4px">
      <h2 id="recent-title" style="margin: 0 0 6px; font-family: 'Anek Bangla', 'Noto Sans Bengali', sans-serif; font-size: 20px; font-weight: 700">সাম্প্রতিক বিক্রি</h2>
      <div style="background: #FFFFFF; border-radius: 14px; padding: 0 16px">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; border-bottom: 1px solid #D5D9D3">
          <div style="display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 16px; font-weight: 600">লোহা, পুরোনো পত্রিকা</span>
            <span style="font-size: 14px; color: #4F5B66">৩ নভেম্বর, ১২ কেজি</span>
          </div>
          <span style="font-family: 'Anek Bangla', 'Noto Sans Bengali', sans-serif; font-size: 19px; font-weight: 700; color: #0B7A5C">৳৫২০</span>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0">
          <div style="display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 16px; font-weight: 600">কার্টন, প্লাস্টিক</span>
            <span style="font-size: 14px; color: #4F5B66">১৮ অক্টোবর, ৯ কেজি</span>
          </div>
          <span style="font-family: 'Anek Bangla', 'Noto Sans Bengali', sans-serif; font-size: 19px; font-weight: 700; color: #0B7A5C">৳২৪০</span>
        </div>
      </div>
    </section>
  </main>

  <nav aria-label="প্রধান মেনু" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #D5D9D3; padding: 6px 8px 10px">
    <a href="Home.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 56px; font-size: 13px; font-weight: 700; color: #13304A; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="#FFC72C" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5V21H3z"></path><path d="M9 21v-6h6v6"></path></svg>
      হোম
    </a>
    <a href="SelectItems.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 56px; font-size: 13px; color: #4F5B66; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"></path><circle cx="7.5" cy="7.5" r="1.5"></circle></svg>
      বিক্রি
    </a>
    <a href="History.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 56px; font-size: 13px; color: #4F5B66; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
      ইতিহাস
    </a>
    <a href="Profile.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 56px; font-size: 13px; color: #4F5B66; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>
      প্রোফাইল
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      rates: [
        { name: 'লোহা', price: '৫০' },
        { name: 'পুরোনো পত্রিকা', price: '৩০' },
        { name: 'প্লাস্টিক বোতল', price: '৩৫' },
        { name: 'কার্টন', price: '১৮' },
        { name: 'অ্যালুমিনিয়াম', price: '১৬০' }
      ]
    };
  }
}
</script>
</body>
</html>
