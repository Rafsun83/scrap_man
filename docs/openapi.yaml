openapi: 3.1.0
info:
  title: BhangariWala API
  version: 1.0.0-draft
  description: |
    v1 contract for the BhangariWala household app, collector app and admin panel.
    Conventions: UUID ids, UTC timestamps (ISO 8601), money in BDT with 2 decimals,
    weight in kg with 1 decimal, ASCII digits and English enum values only.
    Write calls that change status or money require an Idempotency-Key header: repeating a call with the
    same key (per user, for 24 hours) returns the first response without doing the work again; reusing a key
    with a different body is VALIDATION_ERROR, and a repeat while the first call is still running is
    INVALID_STATE (retry shortly).

    Request ids: every response carries an X-Request-Id header. A client may send its own (up to 64 letters,
    digits, dashes or underscores) and it is echoed back; otherwise the server makes one. Logs carry the same id.

    Live updates: connect with Socket.IO to the API origin, path /socket.io, passing the access token as
    `auth.token`. The server answers `ready` once the user's rooms are joined, or `unauthorized` and then
    disconnects. Each user receives only events meant for them; admins receive every pickup event.
    Event names and payloads are the Event* schemas under components.schemas (see SocketEvents).
servers:
  - url: https://api.bhangariwala.example/api/v1
security:
  - bearer: []

tags:
  - name: Auth
  - name: Catalog
  - name: Me
  - name: Pickups
  - name: Collector
  - name: Admin

paths:
  /auth/otp/request:
    post:
      tags: [Auth]
      summary: Send an OTP to a phone number
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { $ref: '#/components/schemas/Phone' }
      responses:
        '204': { description: OTP sent }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /auth/otp/verify:
    post:
      tags: [Auth]
      summary: Verify the OTP and sign in or sign up
      description: New numbers sign up with the role sent. Existing numbers keep their role; check user.role in the response.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code, role]
              properties:
                phone: { $ref: '#/components/schemas/Phone' }
                code: { type: string, pattern: '^[0-9]{6}$' }
                role: { type: string, enum: [HOUSEHOLD, COLLECTOR] }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Error' }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange a refresh token for a new token pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: New tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Error' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: End a session by revoking its refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '204': { description: Signed out }

  /categories:
    get:
      tags: [Catalog]
      summary: Active scrap categories
      security: []
      responses:
        '200':
          description: Categories in display order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }

  /rates/today:
    get:
      tags: [Catalog]
      summary: Today's published rate per category
      security: []
      responses:
        '200':
          description: Rates for today, with the change from yesterday
          content:
            application/json:
              schema:
                type: object
                properties:
                  effectiveDate: { type: string, format: date }
                  publishedAt: { type: string, format: date-time }
                  rates:
                    type: array
                    items: { $ref: '#/components/schemas/Rate' }

  /me:
    get:
      tags: [Me]
      summary: The signed-in user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
    patch:
      tags: [Me]
      summary: Update name or language
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 80 }
                language: { $ref: '#/components/schemas/Language' }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }

  /me/addresses:
    get:
      tags: [Me]
      summary: Saved addresses
      responses:
        '200':
          description: Addresses, default first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Address' }
    post:
      tags: [Me]
      summary: Add an address
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }

  /me/addresses/{addressId}:
    parameters:
      - name: addressId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Me]
      summary: Edit an address
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }
    delete:
      tags: [Me]
      summary: Remove an address
      responses:
        '204': { description: Removed }

  /me/pickups:
    get:
      tags: [Me]
      summary: Own pickups, newest first (household or collector)
      description: |
        Households see pickups they requested; collectors see pickups assigned to them.
        ACTIVE is REQUESTED to CONFIRMED (DISPUTED included); CANCELLED includes EXPIRED;
        PAST is COMPLETED, CANCELLED and EXPIRED (the collector's "past" tab, C8).
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [ACTIVE, COMPLETED, CANCELLED, PAST] }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of pickups
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PickupPage' }

  /me/summary:
    get:
      tags: [Me]
      summary: Household totals for the history screen (H11)
      description: Household only. Counts COMPLETED pickups; totalAmount is what the household was paid.
      responses:
        '200':
          description: Totals
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeSummary' }
        '403': { $ref: '#/components/responses/Error' }

  /me/notifications:
    get:
      tags: [Me]
      summary: The user's notifications, newest first (H13, collector bell on C1)
      description: |
        Households and collectors (admins get 403). Built from what already happened, so it always matches the
        pickup history; the user's own actions are not listed. `read` is true for items at or before the last
        POST /me/notifications/read. The apps write the text from `type` and `data`.
        Households: a collector accepted, released, weighed, was paid, reported the household not home
        (PICKUP_NO_SHOW), a request expired or was cancelled by an admin, a dispute was resolved, and the day's
        rates (from the day the account was created).
        Collectors: the application was approved or rejected, a household confirmed the weights (pay now),
        rejected them (PICKUP_DISPUTED), cancelled after accept (or an admin did), reported a payment not
        received, rated the pickup, a dispute was resolved, and the day's rates once approved.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of notifications
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPage' }
        '403': { $ref: '#/components/responses/Error' }

  /me/notifications/read:
    post:
      tags: [Me]
      summary: Mark every notification up to now as read
      description: Households and collectors. Sets the user's "seen up to" time to now; unreadCount becomes 0.
      responses:
        '204': { description: Marked read }
        '403': { $ref: '#/components/responses/Error' }

  /me/devices:
    put:
      tags: [Me]
      summary: Register this phone for push notifications
      description: |
        Households and collectors. Saves (or refreshes) the device token from the push provider (FCM). A token
        belongs to one user: registering it again moves it to the signed-in user. Pushes carry the same events
        as the live socket, with the text written on the server in the user's language; tokens the provider
        rejects are removed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceInput' }
      responses:
        '204': { description: Saved }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /me/devices/{token}:
    parameters:
      - name: token
        in: path
        required: true
        description: The device token, URL-encoded
        schema: { type: string, maxLength: 4096 }
    delete:
      tags: [Me]
      summary: Stop push notifications to this phone (on sign-out)
      description: Removes the token if it belongs to the signed-in user; succeeds either way.
      responses:
        '204': { description: Removed }

  /pickups:
    post:
      tags: [Pickups]
      summary: Household creates a pickup request
      description: |
        Household only. The address must belong to the household. Categories must be active, and every
        PER_KG category needs a published rate. slotDate is today, tomorrow or the day after (Dhaka time),
        and the slot must not have ended yet. The request expires at the end of the slot.
        The minimum is 2 kg estimated unless the request includes an ON_INSPECTION category (electronics):
        weightBand UNDER_5 means "2 to 5 kg" and the apps say so on screen.
        Item photos are added after this call with POST /pickups/{pickupId}/photos (kind ITEMS).
        On success, online approved collectors within 1 km receive `request.created`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePickup' }
      responses:
        '201':
          description: Request created and sent to collectors within 1 km
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pickup' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /pickups/{pickupId}:
    parameters:
      - $ref: '#/components/parameters/PickupId'
    get:
      tags: [Pickups]
      summary: Pickup detail (owner, assigned collector or admin)
      description: Anyone else gets NOT_FOUND. Collectors browsing open requests use /collector/requests/nearby.
      responses:
        '200':
          description: Pickup
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pickup' }
        '404': { $ref: '#/components/responses/Error' }

  /pickups/{pickupId}/cancel:
    parameters:
      - $ref: '#/components/parameters/PickupId'
    post:
      tags: [Pickups]
      summary: Household cancels before the collector arrives
      description: Household owner only, while REQUESTED or ACCEPTED. Admins use /admin/pickups/{pickupId}/cancel.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 200 }
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pickup' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /pickups/{pickupId}/accept:
    parameters:
      - $ref: '#/components/parameters/PickupId'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [Pickups]
      summary: Collector claims a request; first to accept wins
      description: |
        Collector only. The collector must be APPROVED (else 403 NOT_APPROVED), online, and their last
        location must be within the request's current search radius (else 422 OUT_OF_RANGE).
        One atomic update where status is still REQUESTED: the loser gets 409 ALREADY_TAKEN.
        Today's rates are copied onto the pickup and a 4-digit pickup code is created for the household.
      responses:
        '200':
          description: Accepted; address and household phone are now included
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pickup' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /pickups/{pickupId}/release:
    parameters:
      - $ref: '#/components/parameters/PickupId'
    post:
      tags: [Pickups]
      summary: Collector gives the request back before arriving
      description: |
        Assigned collector only, while ACCEPTED. Clears the collector, pickup code and copied rates,
        resets the search radius to 1 km and restarts the 5-minute widening clock.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 200 }
      responses:
        '204': { description: Released; request is open again at 1 km }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /pickups/{pickupId}/no-show:
    parameters:
      - $ref: '#/components/parameters/PickupId'
    post:
      tags: [Pickups]
      summary: Collector reports the household not home; the pickup ends
      description: |
        Assigned collector only, while ACCEPTED (409 INVALID_STATE otherwise), once the booked slot has started
        (409 INVALID_STATE before), and with the collector's last location within 200 m of the address
        (422 OUT_OF_RANGE otherwise; send a location ping first). ACCEPTED -> CANCELLED with reason NO_SHOW.
        The household gets `pickup.cancelled` and a PICKUP_NO_SHOW notification; admins get an ops alert.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 200, description: What the collector tried, e.g. called twice }
      responses:
        '200':
          description: Cancelled as a no-show
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pickup' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /pickups/{pickupId}/arrive:
    parameters:
      - $ref: '#/components/parameters/PickupId'
    post:
      tags: [Pickups]
      summary: Collector enters the household's pickup code
      description: |
        Assigned collector only, while ACCEPTED. A wrong code returns 422 CODE_MISMATCH with
        details.attemptsLeft. The 5th wrong code locks the pickup (423 CODE_LOCKED from then on) and
        sends `pickup.code_locked` to admins, who can cancel it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: '^[0-9]{4}$' }
      responses:
        '200':
          description: Code matched; status ARRIVED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pickup' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '423': { $ref: '#/components/responses/Error' }

  /pickups/{pickupId}/photos:
    parameters:
      - $ref: '#/components/parameters/PickupId'
    post:
      tags: [Pickups]
      summary: Get a presigned upload URL for an item or scale photo
      description: |
        ITEMS: the household owner, while the pickup is active or COMPLETED (item photos, dispute evidence).
        SCALE: the assigned collector while ARRIVED or DISPUTED, or an admin while DISPUTED.
        Upload the file with an HTTP PUT to uploadUrl, sending the same Content-Type, before expiresAt.
        The photo counts only once the file is uploaded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [ITEMS, SCALE] }
                contentType: { type: string, enum: [image/jpeg, image/png, image/webp], default: image/jpeg }
      responses:
        '201':
          description: Upload slot
          content:
            application/json:
              schema:
                type: object
                required: [photoId, uploadUrl, expiresAt]
                properties:
                  photoId: { type: string, format: uuid }
                  uploadUrl: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /pickups/{pickupId}/weights:
    parameters:
      - $ref: '#/components/parameters/PickupId'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [Pickups]
      summary: Collector submits weights (first weigh or re-weigh)
      description: |
        First weigh: assigned collector while ARRIVED (version 1).
        Re-weigh: assigned collector while DISPUTED with an open REWEIGH dispute, or an admin while
        DISPUTED after resolving with TEAM_REWEIGH (version + 1). Either closes the open weight dispute.
        Each line is an active category, at most once. A category the household did not list (found at the
        door) is added to the pickup: a PER_KG one takes the rate in effect today, at that moment (400
        VALIDATION_ERROR if it has never had a rate). Listed PER_KG categories use the rate copied at accept;
        ON_INSPECTION lines need quotedAmount. Listed categories left out of the lines are not sold.
        The server computes every amount and the totals.
        scalePhotoId must be an uploaded SCALE photo of this pickup not used by an earlier round
        (else 422 SCALE_PHOTO_REQUIRED).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WeightsInput' }
      responses:
        '200':
          description: Status WEIGHED; totals computed by the server
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pickup' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /pickups/{pickupId}/confirm:
    parameters:
      - $ref: '#/components/parameters/PickupId'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [Pickups]
      summary: Household approves the weights and picks a payment method
      description: Household owner only, while WEIGHED. walletNumber is required for BKASH and NAGAD.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paymentMethod]
              properties:
                paymentMethod: { $ref: '#/components/schemas/PaymentMethod' }
                walletNumber: { $ref: '#/components/schemas/Phone' }
      responses:
        '200':
          description: Status CONFIRMED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pickup' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /pickups/{pickupId}/dispute:
    parameters:
      - $ref: '#/components/parameters/PickupId'
    post:
      tags: [Pickups]
      summary: Household rejects the weights or reports a problem
      description: |
        Household owner only. One open dispute per pickup.
        WEIGHT: while WEIGHED. Moves the pickup to DISPUTED. The first weight dispute is REWEIGH (the
        collector re-weighs); any later one is ADMIN_REVIEW.
        PAYMENT ("payment not received"): while COMPLETED. ADMIN_REVIEW; the pickup status does not change
        and the payment is marked REPORTED.
        BEHAVIOUR and OTHER: any time after accept. ADMIN_REVIEW; the pickup status does not change.
        photoIds are ITEMS photos of this pickup uploaded by the household.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { $ref: '#/components/schemas/DisputeType' }
                reason: { type: string, maxLength: 500 }
                photoIds:
                  type: array
                  maxItems: 5
                  items: { type: string, format: uuid }
      responses:
        '201':
          description: Dispute opened
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dispute' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /pickups/{pickupId}/payment:
    parameters:
      - $ref: '#/components/parameters/PickupId'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [Pickups]
      summary: Collector records the payment; status COMPLETED
      description: |
        Assigned collector only, while CONFIRMED. method must be the one the household confirmed.
        trxId is required for BKASH and NAGAD (422 TRX_ID_REQUIRED) and can be used once per method
        (409 TRX_ID_REUSED). The amount is the pickup's total, computed by the server.
        After an admin resolves a payment dispute with PAY_AGAIN, the collector calls this again on the
        COMPLETED pickup with a new trxId; the status stays COMPLETED and the payment returns to PAID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method]
              properties:
                method: { $ref: '#/components/schemas/PaymentMethod' }
                trxId: { type: string, pattern: '^[A-Za-z0-9]{6,30}$', description: Required for BKASH and NAGAD }
      responses:
        '200':
          description: Completed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pickup' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /pickups/{pickupId}/rating:
    parameters:
      - $ref: '#/components/parameters/PickupId'
    post:
      tags: [Pickups]
      summary: Household rates the collector after completion
      description: Household owner only, while COMPLETED, once per pickup. Updates the collector's average.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stars]
              properties:
                stars: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string, maxLength: 300 }
      responses:
        '204': { description: Saved }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /collector/selfie:
    post:
      tags: [Collector]
      summary: Get a presigned upload URL for the sign-up selfie (C6)
      description: |
        Collector only, before or after sign-up. Upload the file with an HTTP PUT to uploadUrl, sending the same
        Content-Type, before expiresAt, then pass photoId to POST /collector/signup. Selfies are private: only
        the collector and admins get a short-lived link (CollectorProfile.selfieUrl).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                contentType: { type: string, enum: [image/jpeg, image/png, image/webp], default: image/jpeg }
      responses:
        '201':
          description: Upload slot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadSlot' }
        '400': { $ref: '#/components/responses/Error' }

  /collector/signup:
    post:
      tags: [Collector]
      summary: Submit a collector application
      description: |
        Collector only. Saves the profile with verification PENDING and sets the account name.
        A REJECTED collector may submit again (back to PENDING, the old note is cleared); a PENDING or APPROVED
        one gets 409 INVALID_STATE. selfiePhotoId must be this collector's selfie and already uploaded
        (else 400 VALIDATION_ERROR).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CollectorSignup' }
      responses:
        '201':
          description: Application saved; verification PENDING
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectorProfile' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /collector/profile:
    get:
      tags: [Collector]
      summary: Own collector profile, rating and verification status
      description: 404 NOT_FOUND until the collector has signed up (the app then shows C6).
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectorProfile' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Collector]
      summary: Change work areas, vehicle or scale
      description: Any signed-up collector. Does not change the verification status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                workAreas: { $ref: '#/components/schemas/WorkAreas' }
                vehicleType: { $ref: '#/components/schemas/VehicleType' }
                hasScale: { type: boolean }
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectorProfile' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /collector/status:
    put:
      tags: [Collector]
      summary: Go online or offline
      description: |
        Approved collectors only (else 403 NOT_APPROVED). location is required when going online.
        A collector with no location ping for 10 minutes is treated as offline for matching.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [online]
              properties:
                online: { type: boolean }
                location: { $ref: '#/components/schemas/LatLng' }
      responses:
        '204': { description: Saved }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /collector/location:
    put:
      tags: [Collector]
      summary: Location ping while online or on the way
      description: |
        Send about every 30 seconds while online. While the collector has an ACCEPTED pickup, the
        household receives `collector.location`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LatLng' }
      responses:
        '204': { description: Saved }
        '403': { $ref: '#/components/responses/Error' }

  /collector/requests/nearby:
    get:
      tags: [Collector]
      summary: Open requests inside each request's current radius
      description: Approved collectors only. Shows each REQUESTED pickup whose current radius reaches lat/lng.
      parameters:
        - name: lat
          in: query
          required: true
          schema: { type: number }
        - name: lng
          in: query
          required: true
          schema: { type: number }
      responses:
        '200':
          description: Requests, nearest first; no exact address or phone
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/NearbyRequest' }

  /collector/ledger:
    get:
      tags: [Collector]
      summary: Payouts and kg collected for a date range (C1 today's totals, C9)
      description: |
        Collector only. from and to are Dhaka calendar dates, inclusive; from must not be after to and the
        range is at most 92 days (else 400 VALIDATION_ERROR).
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Ledger summary and lines
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ledger' }
        '400': { $ref: '#/components/responses/Error' }

  /admin/rates:
    get:
      tags: [Admin]
      summary: Rates for one date next to the previous rate (A2)
      description: |
        Admin only. For each active category: the rate published for exactly this date (null if not published yet),
        and the latest rate before it (A2's "Yesterday" column and "Copy yesterday's rates"). Defaults to today.
      parameters:
        - name: date
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Rates for the date
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminRates' }
        '400': { $ref: '#/components/responses/Error' }
    put:
      tags: [Admin]
      summary: Publish rates for a date
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [effectiveDate, rates]
              properties:
                effectiveDate: { type: string, format: date }
                rates:
                  type: array
                  items:
                    type: object
                    required: [categoryCode, ratePerKg]
                    properties:
                      categoryCode: { type: string }
                      ratePerKg: { $ref: '#/components/schemas/Money' }
      responses:
        '204': { description: Published }

  /admin/collectors:
    get:
      tags: [Admin]
      summary: Collectors by verification status
      description: Admin only. Oldest application first, so the queue is handled in order.
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/VerificationStatus' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of collector profiles
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectorProfilePage' }
        '400': { $ref: '#/components/responses/Error' }

  /admin/collectors/{userId}/decision:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Admin]
      summary: Approve or reject a collector
      description: |
        Admin only, while the application is PENDING (else 409 INVALID_STATE); 404 NOT_FOUND if the user has not
        signed up as a collector. note is required when rejecting and is shown to the collector. The collector
        gets an SMS and the `collector.verification` event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [APPROVED, REJECTED] }
                note: { type: string, maxLength: 500 }
      responses:
        '204': { description: Saved; collector notified }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /admin/overview:
    get:
      tags: [Admin]
      summary: Status counts and the needs-attention list (A1)
      description: |
        Admin only. Counts are of pickups now in each status, except completedToday (completed since midnight,
        Dhaka). weighing is ARRIVED plus WEIGHED. Attention items, most urgent first (NO_SHOW: a collector
        reported a household not home in the last 24 hours; pickupId, area and the collector's name): WAITING_TOO_LONG (a request
        still REQUESTED longer than ADMIN_ATTENTION.waitingMinutes after it was made), CODE_LOCKED (an ACCEPTED
        pickup locked after 5 wrong codes), DISPUTE_REVIEW (a dispute waiting for staff), RELEASES (a collector who
        gave back more than ADMIN_ATTENTION.maxReleases30d requests in 30 days).
      responses:
        '200':
          description: Overview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminOverview' }

  /admin/alerts:
    get:
      tags: [Admin]
      summary: Operational alerts right now (A1 banner)
      description: |
        Admin only. Checked every minute (and on this call), most severe first:
        ACCEPTED_PAST_SLOT (ACCEPTED more than OPS_ALERTS.acceptedPastSlotMinutes after the slot ended),
        CONFIRMED_UNPAID (CONFIRMED longer than OPS_ALERTS.confirmedUnpaidMinutes),
        REVIEW_OVERDUE (a dispute with staff longer than OPS_ALERTS.reviewOverdueHours),
        OTP_FAILURES (more than OPS_ALERTS.otpFailures wrong codes in the last 10 minutes, all phones),
        PAYMENT_REPORTED and NO_SHOW (each in the last 24 hours). A new alert is also sent as `ops.alert` and
        written to the log as an `alert` line.
      responses:
        '200':
          description: Alerts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OpsAlert' }

  /admin/map:
    get:
      tags: [Admin]
      summary: Open requests and online collectors for the A1 map
      description: |
        Admin only. Requests still REQUESTED (not expired) and approved collectors who are online and pinged in the
        last 10 minutes. Exact points, since admins see addresses anyway.
      responses:
        '200':
          description: Map points
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminMap' }

  /admin/pickups:
    get:
      tags: [Admin]
      summary: Search pickups (A1 table, a user's pickups on A5)
      description: |
        Admin only. Newest request first, cursor paging. Filters combine:
        status (one status) or group (ACTIVE = REQUESTED to CONFIRMED; WEIGHING = ARRIVED and WEIGHED;
        PAST = COMPLETED, CANCELLED, EXPIRED); area matches anywhere in the pickup's area, ignoring case;
        date is the booked slotDate; q matches the BW number, or the household's name or phone;
        userId is the household or the assigned collector.
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/PickupStatus' }
        - name: group
          in: query
          schema: { type: string, enum: [ACTIVE, WEIGHING, PAST] }
        - name: area
          in: query
          schema: { type: string, maxLength: 80 }
        - name: date
          in: query
          schema: { type: string, format: date }
        - name: q
          in: query
          schema: { type: string, maxLength: 80 }
        - name: userId
          in: query
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of pickups
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PickupPage' }
        '400': { $ref: '#/components/responses/Error' }

  /admin/pickups/{pickupId}/events:
    parameters:
      - $ref: '#/components/parameters/PickupId'
    get:
      tags: [Admin]
      summary: Every status change of a pickup, oldest first (A4 timeline, A1 detail)
      responses:
        '200':
          description: Status events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PickupEvent' }
        '404': { $ref: '#/components/responses/Error' }

  /admin/pickups/{pickupId}/cancel:
    parameters:
      - $ref: '#/components/parameters/PickupId'
    post:
      tags: [Admin]
      summary: Cancel any active pickup
      description: Any status from REQUESTED to CONFIRMED. Closes an open dispute on the pickup with outcome CANCEL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pickup' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /admin/disputes:
    get:
      tags: [Admin]
      summary: Disputes, open first
      description: Admin only. Open ones first, then newest. Each carries the pickup's area, status and both names.
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/DisputeStatus' }
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/DisputeType' }
      responses:
        '200':
          description: Disputes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminDispute' }

  /admin/disputes/{disputeId}/resolve:
    parameters:
      - name: disputeId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Admin]
      summary: Close a dispute with an outcome
      description: |
        The dispute must be in ADMIN_REVIEW (409 INVALID_STATE otherwise). Outcomes by type:
        WEIGHT: ACCEPT_WEIGHTS (pickup DISPUTED -> WEIGHED with the latest round; the household confirms
        as usual), TEAM_REWEIGH (pickup stays DISPUTED until an admin posts weights), CANCEL
        (pickup -> CANCELLED; items stay with the household).
        PAYMENT: PAYMENT_VERIFIED (payment VERIFIED), PAY_AGAIN (the collector records a new TrxID),
        SUSPEND_COLLECTOR (collector suspended and set offline; payment stays REPORTED).
        BEHAVIOUR and OTHER: NO_ACTION, SUSPEND_COLLECTOR, or CANCEL while the pickup is still active.
        Any other outcome for the type is VALIDATION_ERROR. Both sides receive `dispute.resolved` with the note.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome, note]
              properties:
                outcome:
                  type: string
                  $ref: '#/components/schemas/DisputeOutcome'
                note: { type: string, minLength: 1, maxLength: 500, description: Shown to both sides }
      responses:
        '200':
          description: Resolved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dispute' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /admin/users:
    get:
      tags: [Admin]
      summary: Households or collectors, searchable (A5)
      description: |
        Admin only. Newest account first, cursor paging. q matches the name or phone (digits are enough).
        Each row has the role's figures; collectors with more than ADMIN_ATTENTION.maxReleases30d releases in
        30 days have releaseFlag true.
      parameters:
        - name: role
          in: query
          required: true
          schema: { type: string, enum: [HOUSEHOLD, COLLECTOR] }
        - name: q
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of users
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserPage' }
        '400': { $ref: '#/components/responses/Error' }

  /admin/users/{userId}/status:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [Admin]
      summary: Activate, flag or suspend a user
      description: |
        Admin only, for households and collectors (403 FORBIDDEN for an admin account). FLAGGED is a marker for
        operations; the user can still work. SUSPENDED blocks every request from the next call on, and takes a
        collector offline; pickups already in progress are not changed (cancel them with
        POST /admin/pickups/{pickupId}/cancel if needed). The note is kept with the status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [ACTIVE, FLAGGED, SUSPENDED] }
                note: { type: string, maxLength: 500 }
      responses:
        '204': { description: Saved }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PickupId:
      name: pickupId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, maxLength: 64 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [VALIDATION_ERROR, UNAUTHORIZED, OTP_INVALID, OTP_RATE_LIMIT, NOT_APPROVED, ALREADY_TAKEN,
                 INVALID_STATE, TRX_ID_REUSED, BELOW_MINIMUM, OUT_OF_RANGE, CODE_MISMATCH,
                 CODE_LOCKED, SCALE_PHOTO_REQUIRED, TRX_ID_REQUIRED, NOT_FOUND, FORBIDDEN]
        message: { type: string }
        details: { type: object, additionalProperties: true }

    Phone:
      type: string
      pattern: '^\+8801[3-9][0-9]{8}$'
      examples: ['+8801712345456']
    Money:
      type: number
      multipleOf: 0.01
      minimum: 0
    Kg:
      type: number
      multipleOf: 0.1
      exclusiveMinimum: 0
    LatLng:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }

    Language: { type: string, enum: [BN, EN] }
    Role: { type: string, enum: [HOUSEHOLD, COLLECTOR, ADMIN] }
    VerificationStatus: { type: string, enum: [PENDING, APPROVED, REJECTED] }
    VehicleType: { type: string, enum: [VAN, PUSHCART, ON_FOOT] }
    TimeSlot: { type: string, enum: [MORNING, MIDDAY, AFTERNOON] }
    WeightBand: { type: string, enum: [UNDER_5, FROM_5_TO_15, OVER_15, UNSURE] }
    PickupStatus:
      type: string
      enum: [REQUESTED, ACCEPTED, ARRIVED, WEIGHED, DISPUTED, CONFIRMED, COMPLETED, CANCELLED, EXPIRED]
    PaymentMethod: { type: string, enum: [CASH, BKASH, NAGAD] }
    DisputeType: { type: string, enum: [WEIGHT, PAYMENT, BEHAVIOUR, OTHER] }
    DisputeStatus: { type: string, enum: [REWEIGH, ADMIN_REVIEW, RESOLVED] }
    DisputeOutcome:
      type: string
      description: REWEIGHED is set by the system when a re-weigh closes a REWEIGH dispute; admins cannot send it.
      enum: [REWEIGHED, ACCEPT_WEIGHTS, TEAM_REWEIGH, CANCEL, PAYMENT_VERIFIED, PAY_AGAIN, SUSPEND_COLLECTOR, NO_ACTION]
    PaymentStatus: { type: string, enum: [PAID, REPORTED, VERIFIED] }
    PhotoKind: { type: string, enum: [ITEMS, SCALE] }

    Session:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, description: Seconds until the access token expires }
        user: { $ref: '#/components/schemas/User' }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        phone: { $ref: '#/components/schemas/Phone' }
        role: { $ref: '#/components/schemas/Role' }
        name: { type: [string, 'null'] }
        language: { $ref: '#/components/schemas/Language' }
        status: { type: string, enum: [ACTIVE, FLAGGED, SUSPENDED] }
        createdAt: { type: string, format: date-time }

    Address:
      allOf:
        - $ref: '#/components/schemas/AddressInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
    AddressInput:
      type: object
      required: [label, line, area, location]
      properties:
        label: { type: string, maxLength: 40 }
        line: { type: string, maxLength: 200 }
        area: { type: string, maxLength: 80 }
        city: { type: string, default: Dhaka }
        location: { $ref: '#/components/schemas/LatLng' }
        note: { type: string, maxLength: 200 }
        isDefault: { type: boolean }

    Category:
      type: object
      properties:
        code: { type: string, examples: [IRON] }
        nameBn: { type: string }
        nameEn: { type: string }
        pricingType: { type: string, enum: [PER_KG, ON_INSPECTION] }
        icon: { type: string }

    Rate:
      type: object
      properties:
        categoryCode: { type: string }
        ratePerKg: { anyOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        changeFromYesterday: { type: [number, 'null'] }

    CreatePickup:
      type: object
      required: [addressId, categoryCodes, weightBand, slotDate, slot]
      properties:
        addressId: { type: string, format: uuid }
        categoryCodes:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }
        weightBand: { $ref: '#/components/schemas/WeightBand' }
        slotDate: { type: string, format: date }
        slot: { $ref: '#/components/schemas/TimeSlot' }
        note: { type: string, maxLength: 200 }

    PickupLine:
      type: object
      required: [categoryCode, kg, rate, amount]
      properties:
        categoryCode: { type: string }
        kg: { $ref: '#/components/schemas/Kg' }
        rate:
          anyOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }]
          description: null for ON_INSPECTION categories, whose amount is the collector's quote
        amount: { $ref: '#/components/schemas/Money' }

    WeighRound:
      type: object
      required: [version, lines, totalKg, totalAmount, scalePhotoId, weighedBy, createdAt]
      properties:
        version: { type: integer, minimum: 1 }
        lines:
          type: array
          items: { $ref: '#/components/schemas/PickupLine' }
        totalKg: { $ref: '#/components/schemas/Kg' }
        totalAmount: { $ref: '#/components/schemas/Money' }
        scalePhotoId: { type: string, format: uuid }
        weighedBy: { type: string, enum: [COLLECTOR, ADMIN] }
        createdAt: { type: string, format: date-time }

    Photo:
      type: object
      required: [id, kind, weighVersion, url, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/PhotoKind' }
        weighVersion: { type: [integer, 'null'] }
        url: { type: string, format: uri, description: Presigned download link, valid for 15 minutes }
        createdAt: { type: string, format: date-time }

    Payment:
      type: object
      required: [method, amount, walletNumber, trxId, status, paidAt]
      properties:
        method: { $ref: '#/components/schemas/PaymentMethod' }
        amount: { $ref: '#/components/schemas/Money' }
        walletNumber: { type: [string, 'null'] }
        trxId: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        paidAt: { type: string, format: date-time }

    Pickup:
      type: object
      description: |
        One shape for every viewer; fields a viewer may not see are null.
        Before accept nobody but the household and admins sees the address.
      required: [id, displayNo, status, slotDate, slot, weightBand, categoryCodes, area, estimate, address,
                 household, collector, pickupCode, codeLocked, lines, weighVersion, weighRounds, photos, totalKg,
                 totalAmount, paymentMethod, walletNumber, payment, openDispute, searchRadiusM, requestedAt,
                 acceptedAt, arrivedAt, weighedAt, confirmedAt, completedAt, cancelledAt, expiresAt,
                 collectorLocation, rating, lockedRates, updatedAt]
      properties:
        id: { type: string, format: uuid }
        displayNo: { type: string, examples: [BW-1052] }
        status: { $ref: '#/components/schemas/PickupStatus' }
        slotDate: { type: string, format: date }
        slot: { $ref: '#/components/schemas/TimeSlot' }
        weightBand: { $ref: '#/components/schemas/WeightBand' }
        categoryCodes: { type: array, items: { type: string } }
        area: { type: string, examples: ['Mirpur 10'], description: Approximate area; visible to everyone who can see the pickup }
        estimate:
          type: [object, 'null']
          description: Rough payout range from the weight band and today's rates; null when it cannot be estimated
          properties:
            min: { $ref: '#/components/schemas/Money' }
            max: { $ref: '#/components/schemas/Money' }
        address:
          description: Exact address; only for the household, the assigned collector after accept, and admins
          type: [object, 'null']
          properties:
            text: { type: string }
            lat: { type: number }
            lng: { type: number }
            note: { type: [string, 'null'] }
        household:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: [string, 'null'] }
            phone: { type: [string, 'null'], description: Only to the assigned collector after accept, and admins }
        collector:
          type: [object, 'null']
          properties:
            id: { type: string, format: uuid }
            name: { type: [string, 'null'] }
            rating: { type: [number, 'null'] }
            phone: { type: [string, 'null'] }
        pickupCode:
          type: [string, 'null']
          description: 4 digits; returned to the household only, while ACCEPTED
        codeLocked: { type: boolean, description: True after 5 wrong pickup codes }
        lines:
          type: array
          description: The latest weigh round's lines; empty before weighing
          items: { $ref: '#/components/schemas/PickupLine' }
        weighVersion: { type: [integer, 'null'] }
        weighRounds:
          type: array
          description: Every weigh round, oldest first (C10 shows the previous round; A4 shows all)
          items: { $ref: '#/components/schemas/WeighRound' }
        photos:
          type: array
          items: { $ref: '#/components/schemas/Photo' }
        totalKg: { anyOf: [{ $ref: '#/components/schemas/Kg' }, { type: 'null' }] }
        totalAmount: { anyOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        paymentMethod: { anyOf: [{ $ref: '#/components/schemas/PaymentMethod' }, { type: 'null' }] }
        walletNumber: { type: [string, 'null'], description: The household's bKash or Nagad number, set at confirm }
        payment: { anyOf: [{ $ref: '#/components/schemas/Payment' }, { type: 'null' }] }
        openDispute: { anyOf: [{ $ref: '#/components/schemas/Dispute' }, { type: 'null' }] }
        searchRadiusM: { type: integer, examples: [1000] }
        requestedAt: { type: string, format: date-time }
        acceptedAt: { type: [string, 'null'], format: date-time }
        arrivedAt: { type: [string, 'null'], format: date-time }
        weighedAt: { type: [string, 'null'], format: date-time }
        confirmedAt: { type: [string, 'null'], format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        cancelledAt: { type: [string, 'null'], format: date-time }
        expiresAt: { type: string, format: date-time, description: End of the booked slot }
        updatedAt: { type: string, format: date-time, description: Time of the latest status change (A1's Updated column) }
        collectorLocation:
          type: [object, 'null']
          description: |
            The assigned collector's last known position, so the household's map (H6) has a point before the
            next `collector.location` event. Only for the household (and admins) while ACCEPTED; null otherwise
            or if the collector has never sent a location.
          required: [lat, lng, at]
          properties:
            lat: { type: number }
            lng: { type: number }
            at: { type: string, format: date-time }
        rating:
          type: [object, 'null']
          description: The household's rating of this pickup; for the household, the assigned collector and admins. Null until rated.
          required: [stars, comment, createdAt]
          properties:
            stars: { type: integer, minimum: 1, maximum: 5 }
            comment: { type: [string, 'null'] }
            createdAt: { type: string, format: date-time }
        lockedRates:
          type: [array, 'null']
          description: |
            The rate copied onto each item at accept, so the collector's weigh screen (C4) can preview totals.
            For the household, the assigned collector and admins from ACCEPTED on; null before accept.
            A category added at weighing gets its rate when weighed. rate is null for ON_INSPECTION categories.
          items:
            type: object
            required: [categoryCode, rate]
            properties:
              categoryCode: { type: string }
              rate: { anyOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }

    MeSummary:
      type: object
      required: [completedCount, totalKg, totalAmount]
      properties:
        completedCount: { type: integer, minimum: 0 }
        totalKg: { type: number, minimum: 0, description: Sum of final weights, 1 decimal }
        totalAmount: { $ref: '#/components/schemas/Money' }
    NotificationType:
      type: string
      description: |
        PICKUP_ACCEPTED, PICKUP_RELEASED (the collector gave the request back; it is searching again),
        PICKUP_WEIGHED (weights ready to check; data.weighVersion > 1 for a re-weigh), PICKUP_PAID,
        PICKUP_EXPIRED, PICKUP_CANCELLED (households: by an admin; collectors: by the household or an admin
        after accept), PICKUP_NO_SHOW (households: the collector found nobody home), DISPUTE_RESOLVED,
        RATES_PUBLISHED. Collectors only: APPLICATION_APPROVED, APPLICATION_REJECTED (data.note),
        PICKUP_CONFIRMED (the household approved the weights; pay data.amount by data.method),
        PICKUP_DISPUTED (the household rejected the weights; data.disputeStatus REWEIGH or ADMIN_REVIEW),
        PAYMENT_REPORTED (the household says the money did not arrive), RATED (data.stars).
      enum: [PICKUP_ACCEPTED, PICKUP_RELEASED, PICKUP_WEIGHED, PICKUP_PAID, PICKUP_EXPIRED, PICKUP_CANCELLED,
             PICKUP_NO_SHOW, DISPUTE_RESOLVED, RATES_PUBLISHED, APPLICATION_APPROVED, APPLICATION_REJECTED,
             PICKUP_CONFIRMED, PICKUP_DISPUTED, PAYMENT_REPORTED, RATED]
    Notification:
      type: object
      required: [id, type, at, read, pickupId, displayNo, data]
      properties:
        id: { type: string, description: 'Stable id, e.g. "se:123", "dr:<uuid>", "rp:2026-11-15"' }
        type: { $ref: '#/components/schemas/NotificationType' }
        at: { type: string, format: date-time }
        read: { type: boolean }
        pickupId: { type: [string, 'null'], format: uuid, description: Null for RATES_PUBLISHED }
        displayNo: { type: [string, 'null'] }
        data:
          type: object
          description: Only the fields that apply to the type are present.
          properties:
            categoryCodes: { type: array, items: { type: string } }
            collectorName: { type: [string, 'null'] }
            householdName: { type: [string, 'null'], description: Collector feed }
            amount: { $ref: '#/components/schemas/Money' }
            totalKg: { $ref: '#/components/schemas/Kg' }
            method: { $ref: '#/components/schemas/PaymentMethod' }
            weighVersion: { type: integer }
            disputeType: { $ref: '#/components/schemas/DisputeType' }
            disputeStatus: { $ref: '#/components/schemas/DisputeStatus' }
            outcome: { $ref: '#/components/schemas/DisputeOutcome' }
            effectiveDate: { type: string, format: date }
            note: { type: [string, 'null'], description: The admin's note (APPLICATION_REJECTED) }
            stars: { type: integer, minimum: 1, maximum: 5 }
    NotificationPage:
      type: object
      required: [items, nextCursor, unreadCount]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Notification' }
        nextCursor: { type: [string, 'null'] }
        unreadCount: { type: integer, minimum: 0, description: Unread items across all pages }
    PickupPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Pickup' }
        nextCursor: { type: [string, 'null'] }

    WeightsInput:
      type: object
      required: [lines, scalePhotoId]
      properties:
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [categoryCode, kg]
            properties:
              categoryCode: { type: string }
              kg: { $ref: '#/components/schemas/Kg' }
              quotedAmount:
                anyOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }]
                description: Required for ON_INSPECTION categories such as electronics; not allowed otherwise
        scalePhotoId: { type: string, format: uuid }

    Dispute:
      type: object
      required: [id, pickupId, displayNo, type, status, raisedBy, reason, photoIds, outcome, resolutionNote,
                 createdAt, resolvedAt]
      properties:
        id: { type: string, format: uuid }
        pickupId: { type: string, format: uuid }
        displayNo: { type: string, examples: [BW-1038] }
        type: { $ref: '#/components/schemas/DisputeType' }
        status: { $ref: '#/components/schemas/DisputeStatus' }
        raisedBy: { type: string, format: uuid }
        reason: { type: [string, 'null'] }
        photoIds: { type: array, items: { type: string, format: uuid } }
        outcome: { anyOf: [{ $ref: '#/components/schemas/DisputeOutcome' }, { type: 'null' }] }
        resolutionNote: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: [string, 'null'], format: date-time }

    CollectorSignup:
      type: object
      required: [name, nidNumber, selfiePhotoId, workAreas, vehicleType, hasScale, acceptedAgreement]
      properties:
        name: { type: string, maxLength: 80 }
        nidNumber: { type: string, pattern: '^([0-9]{10}|[0-9]{13}|[0-9]{17})$' }
        selfiePhotoId: { type: string, format: uuid, description: From POST /collector/selfie, uploaded }
        workAreas: { $ref: '#/components/schemas/WorkAreas' }
        vehicleType: { $ref: '#/components/schemas/VehicleType' }
        hasScale: { type: boolean }
        acceptedAgreement: { type: boolean, const: true }

    WorkArea:
      type: string
      description: Dhaka areas a collector works in. Bangla and English names are in @bw/shared (workAreas).
      enum: [ADABOR, BADDA, BANANI, BHASANTEK, CANTONMENT, CHAWKBAZAR, DAKSHINKHAN, DEMRA, DHANMONDI, GENDARIA,
             GULSHAN, HAZARIBAGH, JATRABARI, KADAMTALI, KAFRUL, KALABAGAN, KAMRANGIRCHAR, KHILGAON, KHILKHET,
             KOTWALI, LALBAGH, MIRPUR, MOHAMMADPUR, MOTIJHEEL, MUGDA, NEW_MARKET, PALLABI, PALTAN, RAMNA, RAMPURA,
             SABUJBAGH, SHAH_ALI, SHAHBAGH, SHER_E_BANGLA_NAGAR, SHYAMOLI, SHYAMPUR, SUTRAPUR, TEJGAON, TURAG,
             UTTARA, UTTARKHAN, VATARA, WARI]

    WorkAreas:
      type: array
      minItems: 1
      maxItems: 10
      uniqueItems: true
      items: { $ref: '#/components/schemas/WorkArea' }

    CollectorProfile:
      type: object
      required: [userId, name, phone, nidNumberMasked, nidVerified, selfieUrl, workAreas, vehicleType, hasScale,
                 verificationStatus, verificationNote, submittedAt, decidedAt, isOnline, ratingAvg, pickups30d,
                 releases30d]
      properties:
        userId: { type: string, format: uuid }
        name: { type: [string, 'null'] }
        phone: { $ref: '#/components/schemas/Phone' }
        nidNumberMasked: { type: string, examples: ['19XX XXX 4821'], description: First 2 and last 4 digits }
        nidVerified: { type: boolean }
        selfieUrl: { type: [string, 'null'], format: uri, description: Short-lived link to the private selfie }
        workAreas: { type: array, items: { $ref: '#/components/schemas/WorkArea' } }
        vehicleType: { $ref: '#/components/schemas/VehicleType' }
        hasScale: { type: boolean }
        verificationStatus: { $ref: '#/components/schemas/VerificationStatus' }
        verificationNote:
          type: [string, 'null']
          description: The admin's note with the last decision (shown on C7 when REJECTED)
        submittedAt: { type: string, format: date-time, description: When the application was last submitted }
        decidedAt: { type: [string, 'null'], format: date-time }
        isOnline: { type: boolean }
        ratingAvg: { type: [number, 'null'] }
        pickups30d: { type: integer, description: Pickups completed in the last 30 days }
        releases30d: { type: integer, description: Requests given back in the last 30 days }

    CollectorProfilePage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CollectorProfile' }
        nextCursor: { type: [string, 'null'] }

    UploadSlot:
      type: object
      required: [photoId, uploadUrl, expiresAt]
      properties:
        photoId: { type: string, format: uuid }
        uploadUrl: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }

    NearbyRequest:
      type: object
      required: [id, area, distanceM, categoryCodes, weightBand, slotDate, slot, hasPhoto, estimate, requestedAt,
                 expiresAt]
      properties:
        id: { type: string, format: uuid }
        area: { type: string, examples: ['Mirpur 10, Block C'] }
        distanceM: { type: integer }
        categoryCodes: { type: array, items: { type: string } }
        weightBand: { $ref: '#/components/schemas/WeightBand' }
        slotDate: { type: string, format: date }
        slot: { $ref: '#/components/schemas/TimeSlot' }
        hasPhoto: { type: boolean }
        estimate:
          type: [object, 'null']
          properties:
            min: { $ref: '#/components/schemas/Money' }
            max: { $ref: '#/components/schemas/Money' }
        requestedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, description: End of the booked slot }

    Ledger:
      type: object
      description: |
        COMPLETED pickups of this collector whose payment is PAID or VERIFIED and was made between the start of
        `from` and the end of `to`, in Dhaka time. byCategory is sorted by kg, largest first; payments newest first.
      required: [from, to, totalPaid, totalKg, pickupCount, byMethod, byCategory, payments]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        totalPaid: { $ref: '#/components/schemas/Money' }
        totalKg: { type: number }
        pickupCount: { type: integer }
        byMethod:
          type: object
          required: [CASH, BKASH, NAGAD]
          properties:
            CASH: { $ref: '#/components/schemas/Money' }
            BKASH: { $ref: '#/components/schemas/Money' }
            NAGAD: { $ref: '#/components/schemas/Money' }
        byCategory:
          type: array
          items:
            type: object
            required: [categoryCode, kg]
            properties:
              categoryCode: { type: string }
              kg: { type: number }
        payments:
          type: array
          items:
            type: object
            required: [pickupId, householdName, method, trxId, amount, paidAt]
            properties:
              pickupId: { type: string, format: uuid }
              householdName: { type: [string, 'null'] }
              method: { $ref: '#/components/schemas/PaymentMethod' }
              trxId: { type: [string, 'null'] }
              amount: { $ref: '#/components/schemas/Money' }
              paidAt: { type: string, format: date-time }

    SocketEvents:
      type: string
      description: |
        Socket.IO event names. Who receives each (admins receive all of them):
        request.created: online approved collectors inside the request's radius (again for new ones when it widens
        or after a release). request.taken: collectors who were sent the request, when it is accepted, cancelled
        or expired. pickup.*: the household and the assigned collector. collector.location: the household while
        ACCEPTED. pickup.code_locked: admins only. dispute.opened, dispute.resolved: both sides.
        collector.verification: the collector an admin approved or rejected. collector.applied: admins only, when a
        collector submits (or resubmits) an application. ops.alert: admins only, when a new ops alert appears.
      enum: [request.created, request.taken, request.expired, pickup.accepted, pickup.released, collector.location,
             pickup.arrived, pickup.code_locked, pickup.weighed, pickup.confirmed, pickup.disputed, pickup.paid,
             pickup.cancelled, dispute.opened, dispute.resolved, collector.verification, collector.applied, ops.alert]

    EventCollectorApplied:
      description: collector.applied (admins only)
      type: object
      required: [userId, name, at]
      properties:
        userId: { type: string, format: uuid }
        name: { type: [string, 'null'] }
        at: { type: string, format: date-time }

    EventCollectorVerification:
      description: collector.verification (the collector; also admins)
      type: object
      required: [userId, verificationStatus, verificationNote, at]
      properties:
        userId: { type: string, format: uuid }
        verificationStatus: { $ref: '#/components/schemas/VerificationStatus' }
        verificationNote: { type: [string, 'null'] }
        at: { type: string, format: date-time }

    EventRequestCreated:
      description: request.created
      allOf:
        - $ref: '#/components/schemas/NearbyRequest'

    EventRequestTaken:
      description: request.taken; the request is gone from the nearby list
      type: object
      required: [pickupId, reason]
      properties:
        pickupId: { type: string, format: uuid }
        reason: { type: string, enum: [ACCEPTED, CANCELLED, EXPIRED] }

    EventPickupChanged:
      description: |
        request.expired, pickup.accepted, pickup.released, pickup.arrived, pickup.weighed, pickup.confirmed,
        pickup.disputed, pickup.paid, pickup.cancelled. Clients refetch GET /pickups/{pickupId} for detail.
      type: object
      required: [pickupId, displayNo, status, at]
      properties:
        pickupId: { type: string, format: uuid }
        displayNo: { type: string }
        status: { $ref: '#/components/schemas/PickupStatus' }
        at: { type: string, format: date-time }

    EventCollectorLocation:
      description: collector.location
      type: object
      required: [pickupId, lat, lng, at]
      properties:
        pickupId: { type: string, format: uuid }
        lat: { type: number }
        lng: { type: number }
        at: { type: string, format: date-time }

    EventCodeLocked:
      description: pickup.code_locked (admins)
      type: object
      required: [pickupId, displayNo, collectorId, at]
      properties:
        pickupId: { type: string, format: uuid }
        displayNo: { type: string }
        collectorId: { type: string, format: uuid }
        at: { type: string, format: date-time }

    EventDispute:
      description: dispute.opened, dispute.resolved
      allOf:
        - $ref: '#/components/schemas/Dispute'

    AttentionItem:
      type: object
      required: [kind, pickupId, displayNo, area, userId, name, since, count]
      properties:
        kind: { type: string, enum: [WAITING_TOO_LONG, CODE_LOCKED, DISPUTE_REVIEW, RELEASES, NO_SHOW] }
        pickupId: { type: [string, 'null'], format: uuid }
        displayNo: { type: [string, 'null'] }
        area: { type: [string, 'null'] }
        userId: { type: [string, 'null'], format: uuid, description: The collector, for CODE_LOCKED and RELEASES }
        name: { type: [string, 'null'], description: The collector's name, for CODE_LOCKED and RELEASES }
        since: { type: string, format: date-time, description: 'When the request was made (WAITING_TOO_LONG), accepted (CODE_LOCKED), the dispute opened (DISPUTE_REVIEW), or the latest release (RELEASES)' }
        count: { type: [integer, 'null'], description: Releases in 30 days, for RELEASES }

    AdminOverview:
      type: object
      required: [counts, attention]
      properties:
        counts:
          type: object
          required: [requested, accepted, weighing, disputed, confirmed, completedToday, pendingApplications, openDisputes]
          properties:
            requested: { type: integer }
            accepted: { type: integer }
            weighing: { type: integer, description: ARRIVED plus WEIGHED }
            disputed: { type: integer }
            confirmed: { type: integer }
            completedToday: { type: integer }
            pendingApplications: { type: integer }
            openDisputes: { type: integer }
        attention:
          type: array
          items: { $ref: '#/components/schemas/AttentionItem' }

    AdminMap:
      type: object
      required: [requests, collectors]
      properties:
        requests:
          type: array
          items:
            type: object
            required: [pickupId, displayNo, area, lat, lng, requestedAt, overdue]
            properties:
              pickupId: { type: string, format: uuid }
              displayNo: { type: string }
              area: { type: string }
              lat: { type: number }
              lng: { type: number }
              requestedAt: { type: string, format: date-time }
              overdue: { type: boolean, description: Waiting longer than ADMIN_ATTENTION.waitingMinutes }
        collectors:
          type: array
          items:
            type: object
            required: [userId, name, lat, lng, lastSeenAt, busy]
            properties:
              userId: { type: string, format: uuid }
              name: { type: [string, 'null'] }
              lat: { type: number }
              lng: { type: number }
              lastSeenAt: { type: string, format: date-time }
              busy: { type: boolean, description: Has an active pickup }

    PickupEvent:
      type: object
      required: [id, at, from, to, actorRole, actorName, meta]
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        from: { anyOf: [{ $ref: '#/components/schemas/PickupStatus' }, { type: 'null' }] }
        to: { $ref: '#/components/schemas/PickupStatus' }
        actorRole: { anyOf: [{ $ref: '#/components/schemas/Role' }, { type: 'null' }], description: Null for the system (widening, expiry) }
        actorName: { type: [string, 'null'] }
        meta:
          type: [object, 'null']
          additionalProperties: true
          description: What the change carried, e.g. totals of a weigh round, a release or cancel reason, the payment method

    AdminRates:
      type: object
      required: [date, publishedAt, publishedByName, rates]
      properties:
        date: { type: string, format: date }
        publishedAt: { type: [string, 'null'], format: date-time, description: Latest publish for this date }
        publishedByName: { type: [string, 'null'] }
        rates:
          type: array
          items:
            type: object
            required: [categoryCode, pricingType, rate, previousRate, previousDate]
            properties:
              categoryCode: { type: string }
              pricingType: { type: string, enum: [PER_KG, ON_INSPECTION] }
              rate: { anyOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }], description: Published for exactly this date }
              previousRate: { anyOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
              previousDate: { type: [string, 'null'], format: date }

    AdminDispute:
      allOf:
        - $ref: '#/components/schemas/Dispute'
        - type: object
          required: [pickupStatus, area, householdName, collectorName]
          properties:
            pickupStatus: { $ref: '#/components/schemas/PickupStatus' }
            area: { type: string }
            householdName: { type: [string, 'null'] }
            collectorName: { type: [string, 'null'] }

    AdminUserRow:
      type: object
      required: [id, phone, role, name, language, status, statusNote, createdAt, releaseFlag, household, collector]
      properties:
        id: { type: string, format: uuid }
        phone: { $ref: '#/components/schemas/Phone' }
        role: { $ref: '#/components/schemas/Role' }
        name: { type: [string, 'null'] }
        language: { $ref: '#/components/schemas/Language' }
        status: { type: string, enum: [ACTIVE, FLAGGED, SUSPENDED] }
        statusNote: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        releaseFlag: { type: boolean }
        household:
          description: For households; null for collectors
          type: [object, 'null']
          required: [area, completedCount, totalReceived, noShows30d]
          properties:
            area: { type: [string, 'null'], description: Area of the default address }
            completedCount: { type: integer }
            noShows30d: { type: integer, description: Pickups collectors reported as not home in the last 30 days }
            totalReceived: { $ref: '#/components/schemas/Money' }
        collector:
          description: For collectors; null for households and before sign-up
          type: [object, 'null']
          required: [workAreas, ratingAvg, pickups30d, releases30d, verificationStatus, isOnline]
          properties:
            workAreas: { type: array, items: { $ref: '#/components/schemas/WorkArea' } }
            ratingAvg: { type: [number, 'null'] }
            pickups30d: { type: integer }
            releases30d: { type: integer }
            verificationStatus: { $ref: '#/components/schemas/VerificationStatus' }
            isOnline: { type: boolean }

    AdminUserPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminUserRow' }
        nextCursor: { type: [string, 'null'] }

    DeviceInput:
      type: object
      required: [token, platform]
      properties:
        token: { type: string, minLength: 1, maxLength: 4096, description: The push provider's device token }
        platform: { type: string, enum: [ANDROID, IOS] }

    OpsAlert:
      type: object
      required: [id, kind, severity, pickupId, displayNo, userId, name, since, count]
      properties:
        id: { type: string, description: 'Stable while the alert lasts, e.g. "CONFIRMED_UNPAID:<pickupId>"' }
        kind: { type: string, enum: [ACCEPTED_PAST_SLOT, CONFIRMED_UNPAID, REVIEW_OVERDUE, OTP_FAILURES, PAYMENT_REPORTED, NO_SHOW] }
        severity: { type: string, enum: [CRITICAL, WARNING] }
        pickupId: { type: [string, 'null'], format: uuid }
        displayNo: { type: [string, 'null'] }
        userId: { type: [string, 'null'], format: uuid, description: The collector, where one is involved }
        name: { type: [string, 'null'], description: The collector's name }
