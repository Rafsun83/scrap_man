openapi: 3.1.0
info:
  title: BhangariWala API
  version: 1.0.0-draft
  description: |
    v1 contract for the BhangariWala household app, collector app and admin panel.
    Conventions: UUID ids, UTC timestamps (ISO 8601), money in BDT with 2 decimals,
    weight in kg with 1 decimal, ASCII digits and English enum values only.
    Write calls that change status or money require an Idempotency-Key header: repeating a call with the
    same key (per user, for 24 hours) returns the first response without doing the work again; reusing a key
    with a different body is VALIDATION_ERROR, and a repeat while the first call is still running is
    INVALID_STATE (retry shortly).

    Live updates: connect with Socket.IO to the API origin, path /socket.io, passing the access token as
    `auth.token`. The server answers `ready` once the user's rooms are joined, or `unauthorized` and then
    disconnects. Each user receives only events meant for them; admins receive every pickup event.
    Event names and payloads are the Event* schemas under components.schemas (see SocketEvents).
servers:
  - url: https://api.bhangariwala.example/api/v1
security:
  - bearer: []

tags:
  - name: Auth
  - name: Catalog
  - name: Me
  - name: Pickups
  - name: Collector
  - name: Admin

paths:
  /auth/otp/request:
    post:
      tags: [Auth]
      summary: Send an OTP to a phone number
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { $ref: '#/components/schemas/Phone' }
      responses:
        '204': { description: OTP sent }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /auth/otp/verify:
    post:
      tags: [Auth]
      summary: Verify the OTP and sign in or sign up
      description: New numbers sign up with the role sent. Existing numbers keep their role; check user.role in the response.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code, role]
              properties:
                phone: { $ref: '#/components/schemas/Phone' }
                code: { type: string, pattern: '^[0-9]{6}$' }
                role: { type: string, enum: [HOUSEHOLD, COLLECTOR] }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Error' }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange a refresh token for a new token pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: New tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Error' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: End a session by revoking its refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '204': { description: Signed out }

  /categories:
    get:
      tags: [Catalog]
      summary: Active scrap categories
      security: []
      responses:
        '200':
          description: Categories in display order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }

  /rates/today:
    get:
      tags: [Catalog]
      summary: Today's published rate per category
      security: []
      responses:
        '200':
          description: Rates for today, with the change from yesterday
          content:
            application/json:
              schema:
                type: object
                properties:
                  effectiveDate: { type: string, format: date }
                  publishedAt: { type: string, format: date-time }
                  rates:
                    type: array
                    items: { $ref: '#/components/schemas/Rate' }

  /me:
    get:
      tags: [Me]
      summary: The signed-in user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
    patch:
      tags: [Me]
      summary: Update name or language
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 80 }
                language: { $ref: '#/components/schemas/Language' }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }

  /me/addresses:
    get:
      tags: [Me]
      summary: Saved addresses
      responses:
        '200':
          description: Addresses, default first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Address' }
    post:
      tags: [Me]
      summary: Add an address
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }

  /me/addresses/{addressId}:
    parameters:
      - name: addressId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Me]
      summary: Edit an address
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }
    delete:
      tags: [Me]
      summary: Remove an address
      responses:
        '204': { description: Removed }

  /me/pickups:
    get:
      tags: [Me]
      summary: Own pickups, newest first (household or collector)
      description: |
        Households see pickups they requested; collectors see pickups assigned to them.
        ACTIVE is REQUESTED to CONFIRMED; CANCELLED includes EXPIRED.
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [ACTIVE, COMPLETED, CANCELLED] }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of pickups
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PickupPage' }

  /pickups:
    post:
      tags: [Pickups]
      summary: Household creates a pickup request
      description: |
        Household only. The address must belong to the household. Categories must be active, and every
        PER_KG category needs a published rate. slotDate is today, tomorrow or the day after (Dhaka time),
        and the slot must not have ended yet. The request expires at the end of the slot.
        The minimum is 2 kg estimated unless the request includes an ON_INSPECTION category (electronics):
        weightBand UNDER_5 means "2 to 5 kg" and the apps say so on screen.
        Item photos are added after this call with POST /pickups/{pickupId}/photos (kind ITEMS).
        On success, online approved collectors within 1 km receive `request.created`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePickup' }
      responses:
        '201':
          description: Request created and sent to collectors within 1 km
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pickup' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /pickups/{pickupId}:
    parameters:
      - $ref: '#/components/parameters/PickupId'
    get:
      tags: [Pickups]
      summary: Pickup detail (owner, assigned collector or admin)
      description: Anyone else gets NOT_FOUND. Collectors browsing open requests use /collector/requests/nearby.
      responses:
        '200':
          description: Pickup
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pickup' }
        '404': { $ref: '#/components/responses/Error' }

  /pickups/{pickupId}/cancel:
    parameters:
      - $ref: '#/components/parameters/PickupId'
    post:
      tags: [Pickups]
      summary: Household cancels before the collector arrives
      description: Household owner only, while REQUESTED or ACCEPTED. Admins use /admin/pickups/{pickupId}/cancel.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 200 }
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pickup' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /pickups/{pickupId}/accept:
    parameters:
      - $ref: '#/components/parameters/PickupId'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [Pickups]
      summary: Collector claims a request; first to accept wins
      description: |
        Collector only. The collector must be APPROVED (else 403 NOT_APPROVED), online, and their last
        location must be within the request's current search radius (else 422 OUT_OF_RANGE).
        One atomic update where status is still REQUESTED: the loser gets 409 ALREADY_TAKEN.
        Today's rates are copied onto the pickup and a 4-digit pickup code is created for the household.
      responses:
        '200':
          description: Accepted; address and household phone are now included
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pickup' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /pickups/{pickupId}/release:
    parameters:
      - $ref: '#/components/parameters/PickupId'
    post:
      tags: [Pickups]
      summary: Collector gives the request back before arriving
      description: |
        Assigned collector only, while ACCEPTED. Clears the collector, pickup code and copied rates,
        resets the search radius to 1 km and restarts the 5-minute widening clock.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 200 }
      responses:
        '204': { description: Released; request is open again at 1 km }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /pickups/{pickupId}/arrive:
    parameters:
      - $ref: '#/components/parameters/PickupId'
    post:
      tags: [Pickups]
      summary: Collector enters the household's pickup code
      description: |
        Assigned collector only, while ACCEPTED. A wrong code returns 422 CODE_MISMATCH with
        details.attemptsLeft. The 5th wrong code locks the pickup (423 CODE_LOCKED from then on) and
        sends `pickup.code_locked` to admins, who can cancel it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: '^[0-9]{4}$' }
      responses:
        '200':
          description: Code matched; status ARRIVED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pickup' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '423': { $ref: '#/components/responses/Error' }

  /pickups/{pickupId}/photos:
    parameters:
      - $ref: '#/components/parameters/PickupId'
    post:
      tags: [Pickups]
      summary: Get a presigned upload URL for an item or scale photo
      description: |
        ITEMS: the household owner, while the pickup is active or COMPLETED (item photos, dispute evidence).
        SCALE: the assigned collector while ARRIVED or DISPUTED, or an admin while DISPUTED.
        Upload the file with an HTTP PUT to uploadUrl, sending the same Content-Type, before expiresAt.
        The photo counts only once the file is uploaded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [ITEMS, SCALE] }
                contentType: { type: string, enum: [image/jpeg, image/png, image/webp], default: image/jpeg }
      responses:
        '201':
          description: Upload slot
          content:
            application/json:
              schema:
                type: object
                required: [photoId, uploadUrl, expiresAt]
                properties:
                  photoId: { type: string, format: uuid }
                  uploadUrl: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /pickups/{pickupId}/weights:
    parameters:
      - $ref: '#/components/parameters/PickupId'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [Pickups]
      summary: Collector submits weights (first weigh or re-weigh)
      description: |
        First weigh: assigned collector while ARRIVED (version 1).
        Re-weigh: assigned collector while DISPUTED with an open REWEIGH dispute, or an admin while
        DISPUTED after resolving with TEAM_REWEIGH (version + 1). Either closes the open weight dispute.
        Each line is one of the request's categories, at most once. PER_KG lines use the rate copied at
        accept; ON_INSPECTION lines need quotedAmount. The server computes every amount and the totals.
        scalePhotoId must be an uploaded SCALE photo of this pickup not used by an earlier round
        (else 422 SCALE_PHOTO_REQUIRED).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WeightsInput' }
      responses:
        '200':
          description: Status WEIGHED; totals computed by the server
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pickup' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /pickups/{pickupId}/confirm:
    parameters:
      - $ref: '#/components/parameters/PickupId'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [Pickups]
      summary: Household approves the weights and picks a payment method
      description: Household owner only, while WEIGHED. walletNumber is required for BKASH and NAGAD.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paymentMethod]
              properties:
                paymentMethod: { $ref: '#/components/schemas/PaymentMethod' }
                walletNumber: { $ref: '#/components/schemas/Phone' }
      responses:
        '200':
          description: Status CONFIRMED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pickup' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /pickups/{pickupId}/dispute:
    parameters:
      - $ref: '#/components/parameters/PickupId'
    post:
      tags: [Pickups]
      summary: Household rejects the weights or reports a problem
      description: |
        Household owner only. One open dispute per pickup.
        WEIGHT: while WEIGHED. Moves the pickup to DISPUTED. The first weight dispute is REWEIGH (the
        collector re-weighs); any later one is ADMIN_REVIEW.
        PAYMENT ("payment not received"): while COMPLETED. ADMIN_REVIEW; the pickup status does not change
        and the payment is marked REPORTED.
        BEHAVIOUR and OTHER: any time after accept. ADMIN_REVIEW; the pickup status does not change.
        photoIds are ITEMS photos of this pickup uploaded by the household.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { $ref: '#/components/schemas/DisputeType' }
                reason: { type: string, maxLength: 500 }
                photoIds:
                  type: array
                  maxItems: 5
                  items: { type: string, format: uuid }
      responses:
        '201':
          description: Dispute opened
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dispute' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /pickups/{pickupId}/payment:
    parameters:
      - $ref: '#/components/parameters/PickupId'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [Pickups]
      summary: Collector records the payment; status COMPLETED
      description: |
        Assigned collector only, while CONFIRMED. method must be the one the household confirmed.
        trxId is required for BKASH and NAGAD (422 TRX_ID_REQUIRED) and can be used once per method
        (409 TRX_ID_REUSED). The amount is the pickup's total, computed by the server.
        After an admin resolves a payment dispute with PAY_AGAIN, the collector calls this again on the
        COMPLETED pickup with a new trxId; the status stays COMPLETED and the payment returns to PAID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method]
              properties:
                method: { $ref: '#/components/schemas/PaymentMethod' }
                trxId: { type: string, pattern: '^[A-Za-z0-9]{6,30}$', description: Required for BKASH and NAGAD }
      responses:
        '200':
          description: Completed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pickup' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /pickups/{pickupId}/rating:
    parameters:
      - $ref: '#/components/parameters/PickupId'
    post:
      tags: [Pickups]
      summary: Household rates the collector after completion
      description: Household owner only, while COMPLETED, once per pickup. Updates the collector's average.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stars]
              properties:
                stars: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string, maxLength: 300 }
      responses:
        '204': { description: Saved }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /collector/signup:
    post:
      tags: [Collector]
      summary: Submit a collector application
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CollectorSignup' }
      responses:
        '201':
          description: Application saved; verification PENDING
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectorProfile' }

  /collector/profile:
    get:
      tags: [Collector]
      summary: Own collector profile, rating and verification status
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectorProfile' }
    patch:
      tags: [Collector]
      summary: Change work areas, vehicle or scale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                workAreas: { type: array, items: { type: string } }
                vehicleType: { $ref: '#/components/schemas/VehicleType' }
                hasScale: { type: boolean }
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectorProfile' }

  /collector/status:
    put:
      tags: [Collector]
      summary: Go online or offline
      description: |
        Approved collectors only (else 403 NOT_APPROVED). location is required when going online.
        A collector with no location ping for 10 minutes is treated as offline for matching.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [online]
              properties:
                online: { type: boolean }
                location: { $ref: '#/components/schemas/LatLng' }
      responses:
        '204': { description: Saved }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /collector/location:
    put:
      tags: [Collector]
      summary: Location ping while online or on the way
      description: |
        Send about every 30 seconds while online. While the collector has an ACCEPTED pickup, the
        household receives `collector.location`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LatLng' }
      responses:
        '204': { description: Saved }
        '403': { $ref: '#/components/responses/Error' }

  /collector/requests/nearby:
    get:
      tags: [Collector]
      summary: Open requests inside each request's current radius
      description: Approved collectors only. Shows each REQUESTED pickup whose current radius reaches lat/lng.
      parameters:
        - name: lat
          in: query
          required: true
          schema: { type: number }
        - name: lng
          in: query
          required: true
          schema: { type: number }
      responses:
        '200':
          description: Requests, nearest first; no exact address or phone
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/NearbyRequest' }

  /collector/ledger:
    get:
      tags: [Collector]
      summary: Payouts and kg collected for a date range
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Ledger summary and lines
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ledger' }

  /admin/rates:
    put:
      tags: [Admin]
      summary: Publish rates for a date
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [effectiveDate, rates]
              properties:
                effectiveDate: { type: string, format: date }
                rates:
                  type: array
                  items:
                    type: object
                    required: [categoryCode, ratePerKg]
                    properties:
                      categoryCode: { type: string }
                      ratePerKg: { $ref: '#/components/schemas/Money' }
      responses:
        '204': { description: Published }

  /admin/collectors:
    get:
      tags: [Admin]
      summary: Collectors by verification status
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/VerificationStatus' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of collector profiles
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CollectorProfile' }
                  nextCursor: { type: [string, 'null'] }

  /admin/collectors/{userId}/decision:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Admin]
      summary: Approve or reject a collector
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [APPROVED, REJECTED] }
                note: { type: string, maxLength: 500 }
      responses:
        '204': { description: Saved; collector notified }

  /admin/pickups:
    get:
      tags: [Admin]
      summary: Filter pickups by status, area and date
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/PickupStatus' }
        - name: area
          in: query
          schema: { type: string }
        - name: date
          in: query
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of pickups
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PickupPage' }

  /admin/pickups/{pickupId}/cancel:
    parameters:
      - $ref: '#/components/parameters/PickupId'
    post:
      tags: [Admin]
      summary: Cancel any active pickup
      description: Any status from REQUESTED to CONFIRMED. Closes an open dispute on the pickup with outcome CANCEL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pickup' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /admin/disputes:
    get:
      tags: [Admin]
      summary: Disputes, open first
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/DisputeStatus' }
      responses:
        '200':
          description: Disputes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Dispute' }

  /admin/disputes/{disputeId}/resolve:
    parameters:
      - name: disputeId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Admin]
      summary: Close a dispute with an outcome
      description: |
        The dispute must be in ADMIN_REVIEW (409 INVALID_STATE otherwise). Outcomes by type:
        WEIGHT: ACCEPT_WEIGHTS (pickup DISPUTED -> WEIGHED with the latest round; the household confirms
        as usual), TEAM_REWEIGH (pickup stays DISPUTED until an admin posts weights), CANCEL
        (pickup -> CANCELLED; items stay with the household).
        PAYMENT: PAYMENT_VERIFIED (payment VERIFIED), PAY_AGAIN (the collector records a new TrxID),
        SUSPEND_COLLECTOR (collector suspended and set offline; payment stays REPORTED).
        BEHAVIOUR and OTHER: NO_ACTION, SUSPEND_COLLECTOR, or CANCEL while the pickup is still active.
        Any other outcome for the type is VALIDATION_ERROR. Both sides receive `dispute.resolved` with the note.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome, note]
              properties:
                outcome:
                  type: string
                  $ref: '#/components/schemas/DisputeOutcome'
                note: { type: string, minLength: 1, maxLength: 500, description: Shown to both sides }
      responses:
        '200':
          description: Resolved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dispute' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /admin/users:
    get:
      tags: [Admin]
      summary: Households or collectors, searchable
      parameters:
        - name: role
          in: query
          required: true
          schema: { type: string, enum: [HOUSEHOLD, COLLECTOR] }
        - name: q
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
                  nextCursor: { type: [string, 'null'] }

  /admin/users/{userId}/status:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [Admin]
      summary: Activate, flag or suspend a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [ACTIVE, FLAGGED, SUSPENDED] }
                note: { type: string, maxLength: 500 }
      responses:
        '204': { description: Saved }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PickupId:
      name: pickupId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, maxLength: 64 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [VALIDATION_ERROR, UNAUTHORIZED, OTP_INVALID, OTP_RATE_LIMIT, NOT_APPROVED, ALREADY_TAKEN,
                 INVALID_STATE, TRX_ID_REUSED, BELOW_MINIMUM, OUT_OF_RANGE, CODE_MISMATCH,
                 CODE_LOCKED, SCALE_PHOTO_REQUIRED, TRX_ID_REQUIRED, NOT_FOUND, FORBIDDEN]
        message: { type: string }
        details: { type: object, additionalProperties: true }

    Phone:
      type: string
      pattern: '^\+8801[3-9][0-9]{8}$'
      examples: ['+8801712345456']
    Money:
      type: number
      multipleOf: 0.01
      minimum: 0
    Kg:
      type: number
      multipleOf: 0.1
      exclusiveMinimum: 0
    LatLng:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }

    Language: { type: string, enum: [BN, EN] }
    Role: { type: string, enum: [HOUSEHOLD, COLLECTOR, ADMIN] }
    VerificationStatus: { type: string, enum: [PENDING, APPROVED, REJECTED] }
    VehicleType: { type: string, enum: [VAN, PUSHCART, ON_FOOT] }
    TimeSlot: { type: string, enum: [MORNING, MIDDAY, AFTERNOON] }
    WeightBand: { type: string, enum: [UNDER_5, FROM_5_TO_15, OVER_15, UNSURE] }
    PickupStatus:
      type: string
      enum: [REQUESTED, ACCEPTED, ARRIVED, WEIGHED, DISPUTED, CONFIRMED, COMPLETED, CANCELLED, EXPIRED]
    PaymentMethod: { type: string, enum: [CASH, BKASH, NAGAD] }
    DisputeType: { type: string, enum: [WEIGHT, PAYMENT, BEHAVIOUR, OTHER] }
    DisputeStatus: { type: string, enum: [REWEIGH, ADMIN_REVIEW, RESOLVED] }
    DisputeOutcome:
      type: string
      description: REWEIGHED is set by the system when a re-weigh closes a REWEIGH dispute; admins cannot send it.
      enum: [REWEIGHED, ACCEPT_WEIGHTS, TEAM_REWEIGH, CANCEL, PAYMENT_VERIFIED, PAY_AGAIN, SUSPEND_COLLECTOR, NO_ACTION]
    PaymentStatus: { type: string, enum: [PAID, REPORTED, VERIFIED] }
    PhotoKind: { type: string, enum: [ITEMS, SCALE] }

    Session:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, description: Seconds until the access token expires }
        user: { $ref: '#/components/schemas/User' }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        phone: { $ref: '#/components/schemas/Phone' }
        role: { $ref: '#/components/schemas/Role' }
        name: { type: [string, 'null'] }
        language: { $ref: '#/components/schemas/Language' }
        status: { type: string, enum: [ACTIVE, FLAGGED, SUSPENDED] }
        createdAt: { type: string, format: date-time }

    Address:
      allOf:
        - $ref: '#/components/schemas/AddressInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
    AddressInput:
      type: object
      required: [label, line, area, location]
      properties:
        label: { type: string, maxLength: 40 }
        line: { type: string, maxLength: 200 }
        area: { type: string, maxLength: 80 }
        city: { type: string, default: Dhaka }
        location: { $ref: '#/components/schemas/LatLng' }
        note: { type: string, maxLength: 200 }
        isDefault: { type: boolean }

    Category:
      type: object
      properties:
        code: { type: string, examples: [IRON] }
        nameBn: { type: string }
        nameEn: { type: string }
        pricingType: { type: string, enum: [PER_KG, ON_INSPECTION] }
        icon: { type: string }

    Rate:
      type: object
      properties:
        categoryCode: { type: string }
        ratePerKg: { anyOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        changeFromYesterday: { type: [number, 'null'] }

    CreatePickup:
      type: object
      required: [addressId, categoryCodes, weightBand, slotDate, slot]
      properties:
        addressId: { type: string, format: uuid }
        categoryCodes:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }
        weightBand: { $ref: '#/components/schemas/WeightBand' }
        slotDate: { type: string, format: date }
        slot: { $ref: '#/components/schemas/TimeSlot' }
        note: { type: string, maxLength: 200 }

    PickupLine:
      type: object
      required: [categoryCode, kg, rate, amount]
      properties:
        categoryCode: { type: string }
        kg: { $ref: '#/components/schemas/Kg' }
        rate:
          anyOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }]
          description: null for ON_INSPECTION categories, whose amount is the collector's quote
        amount: { $ref: '#/components/schemas/Money' }

    WeighRound:
      type: object
      required: [version, lines, totalKg, totalAmount, scalePhotoId, weighedBy, createdAt]
      properties:
        version: { type: integer, minimum: 1 }
        lines:
          type: array
          items: { $ref: '#/components/schemas/PickupLine' }
        totalKg: { $ref: '#/components/schemas/Kg' }
        totalAmount: { $ref: '#/components/schemas/Money' }
        scalePhotoId: { type: string, format: uuid }
        weighedBy: { type: string, enum: [COLLECTOR, ADMIN] }
        createdAt: { type: string, format: date-time }

    Photo:
      type: object
      required: [id, kind, weighVersion, url, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/PhotoKind' }
        weighVersion: { type: [integer, 'null'] }
        url: { type: string, format: uri, description: Presigned download link, valid for 15 minutes }
        createdAt: { type: string, format: date-time }

    Payment:
      type: object
      required: [method, amount, walletNumber, trxId, status, paidAt]
      properties:
        method: { $ref: '#/components/schemas/PaymentMethod' }
        amount: { $ref: '#/components/schemas/Money' }
        walletNumber: { type: [string, 'null'] }
        trxId: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        paidAt: { type: string, format: date-time }

    Pickup:
      type: object
      description: |
        One shape for every viewer; fields a viewer may not see are null.
        Before accept nobody but the household and admins sees the address.
      required: [id, displayNo, status, slotDate, slot, weightBand, categoryCodes, area, estimate, address,
                 household, collector, pickupCode, codeLocked, lines, weighVersion, weighRounds, photos, totalKg,
                 totalAmount, paymentMethod, walletNumber, payment, openDispute, searchRadiusM, requestedAt,
                 acceptedAt, arrivedAt, weighedAt, confirmedAt, completedAt, cancelledAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        displayNo: { type: string, examples: [BW-1052] }
        status: { $ref: '#/components/schemas/PickupStatus' }
        slotDate: { type: string, format: date }
        slot: { $ref: '#/components/schemas/TimeSlot' }
        weightBand: { $ref: '#/components/schemas/WeightBand' }
        categoryCodes: { type: array, items: { type: string } }
        area: { type: string, examples: ['Mirpur 10'], description: Approximate area; visible to everyone who can see the pickup }
        estimate:
          type: [object, 'null']
          description: Rough payout range from the weight band and today's rates; null when it cannot be estimated
          properties:
            min: { $ref: '#/components/schemas/Money' }
            max: { $ref: '#/components/schemas/Money' }
        address:
          description: Exact address; only for the household, the assigned collector after accept, and admins
          type: [object, 'null']
          properties:
            text: { type: string }
            lat: { type: number }
            lng: { type: number }
            note: { type: [string, 'null'] }
        household:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: [string, 'null'] }
            phone: { type: [string, 'null'], description: Only to the assigned collector after accept, and admins }
        collector:
          type: [object, 'null']
          properties:
            id: { type: string, format: uuid }
            name: { type: [string, 'null'] }
            rating: { type: [number, 'null'] }
            phone: { type: [string, 'null'] }
        pickupCode:
          type: [string, 'null']
          description: 4 digits; returned to the household only, while ACCEPTED
        codeLocked: { type: boolean, description: True after 5 wrong pickup codes }
        lines:
          type: array
          description: The latest weigh round's lines; empty before weighing
          items: { $ref: '#/components/schemas/PickupLine' }
        weighVersion: { type: [integer, 'null'] }
        weighRounds:
          type: array
          description: Every weigh round, oldest first (C10 shows the previous round; A4 shows all)
          items: { $ref: '#/components/schemas/WeighRound' }
        photos:
          type: array
          items: { $ref: '#/components/schemas/Photo' }
        totalKg: { anyOf: [{ $ref: '#/components/schemas/Kg' }, { type: 'null' }] }
        totalAmount: { anyOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        paymentMethod: { anyOf: [{ $ref: '#/components/schemas/PaymentMethod' }, { type: 'null' }] }
        walletNumber: { type: [string, 'null'], description: The household's bKash or Nagad number, set at confirm }
        payment: { anyOf: [{ $ref: '#/components/schemas/Payment' }, { type: 'null' }] }
        openDispute: { anyOf: [{ $ref: '#/components/schemas/Dispute' }, { type: 'null' }] }
        searchRadiusM: { type: integer, examples: [1000] }
        requestedAt: { type: string, format: date-time }
        acceptedAt: { type: [string, 'null'], format: date-time }
        arrivedAt: { type: [string, 'null'], format: date-time }
        weighedAt: { type: [string, 'null'], format: date-time }
        confirmedAt: { type: [string, 'null'], format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        cancelledAt: { type: [string, 'null'], format: date-time }
        expiresAt: { type: string, format: date-time, description: End of the booked slot }

    PickupPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Pickup' }
        nextCursor: { type: [string, 'null'] }

    WeightsInput:
      type: object
      required: [lines, scalePhotoId]
      properties:
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [categoryCode, kg]
            properties:
              categoryCode: { type: string }
              kg: { $ref: '#/components/schemas/Kg' }
              quotedAmount:
                anyOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }]
                description: Required for ON_INSPECTION categories such as electronics; not allowed otherwise
        scalePhotoId: { type: string, format: uuid }

    Dispute:
      type: object
      required: [id, pickupId, displayNo, type, status, raisedBy, reason, photoIds, outcome, resolutionNote,
                 createdAt, resolvedAt]
      properties:
        id: { type: string, format: uuid }
        pickupId: { type: string, format: uuid }
        displayNo: { type: string, examples: [BW-1038] }
        type: { $ref: '#/components/schemas/DisputeType' }
        status: { $ref: '#/components/schemas/DisputeStatus' }
        raisedBy: { type: string, format: uuid }
        reason: { type: [string, 'null'] }
        photoIds: { type: array, items: { type: string, format: uuid } }
        outcome: { anyOf: [{ $ref: '#/components/schemas/DisputeOutcome' }, { type: 'null' }] }
        resolutionNote: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: [string, 'null'], format: date-time }

    CollectorSignup:
      type: object
      required: [name, nidNumber, selfiePhotoId, workAreas, vehicleType, hasScale, acceptedAgreement]
      properties:
        name: { type: string, maxLength: 80 }
        nidNumber: { type: string, pattern: '^([0-9]{10}|[0-9]{13}|[0-9]{17})$' }
        selfiePhotoId: { type: string, format: uuid }
        workAreas:
          type: array
          minItems: 1
          items: { type: string }
        vehicleType: { $ref: '#/components/schemas/VehicleType' }
        hasScale: { type: boolean }
        acceptedAgreement: { type: boolean, const: true }

    CollectorProfile:
      type: object
      properties:
        userId: { type: string, format: uuid }
        name: { type: string }
        phone: { $ref: '#/components/schemas/Phone' }
        nidNumberMasked: { type: string, examples: ['19XX XXX 4821'] }
        nidVerified: { type: boolean }
        selfieUrl: { type: [string, 'null'], format: uri }
        workAreas: { type: array, items: { type: string } }
        vehicleType: { $ref: '#/components/schemas/VehicleType' }
        hasScale: { type: boolean }
        verificationStatus: { $ref: '#/components/schemas/VerificationStatus' }
        isOnline: { type: boolean }
        ratingAvg: { type: [number, 'null'] }
        pickups30d: { type: integer }
        releases30d: { type: integer }

    NearbyRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        area: { type: string, examples: ['Mirpur 10, Block C'] }
        distanceM: { type: integer }
        categoryCodes: { type: array, items: { type: string } }
        weightBand: { $ref: '#/components/schemas/WeightBand' }
        slotDate: { type: string, format: date }
        slot: { $ref: '#/components/schemas/TimeSlot' }
        hasPhoto: { type: boolean }
        estimate:
          type: object
          properties:
            min: { $ref: '#/components/schemas/Money' }
            max: { $ref: '#/components/schemas/Money' }

    Ledger:
      type: object
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        totalPaid: { $ref: '#/components/schemas/Money' }
        totalKg: { type: number }
        pickupCount: { type: integer }
        byMethod:
          type: object
          properties:
            CASH: { $ref: '#/components/schemas/Money' }
            BKASH: { $ref: '#/components/schemas/Money' }
            NAGAD: { $ref: '#/components/schemas/Money' }
        byCategory:
          type: array
          items:
            type: object
            properties:
              categoryCode: { type: string }
              kg: { type: number }
        payments:
          type: array
          items:
            type: object
            properties:
              pickupId: { type: string, format: uuid }
              householdName: { type: [string, 'null'] }
              method: { $ref: '#/components/schemas/PaymentMethod' }
              trxId: { type: [string, 'null'] }
              amount: { $ref: '#/components/schemas/Money' }
              paidAt: { type: string, format: date-time }

    SocketEvents:
      type: string
      description: |
        Socket.IO event names. Who receives each (admins receive all of them):
        request.created: online approved collectors inside the request's radius (again for new ones when it widens
        or after a release). request.taken: collectors who were sent the request, when it is accepted, cancelled
        or expired. pickup.*: the household and the assigned collector. collector.location: the household while
        ACCEPTED. pickup.code_locked: admins only. dispute.opened, dispute.resolved: both sides.
      enum: [request.created, request.taken, request.expired, pickup.accepted, pickup.released, collector.location,
             pickup.arrived, pickup.code_locked, pickup.weighed, pickup.confirmed, pickup.disputed, pickup.paid,
             pickup.cancelled, dispute.opened, dispute.resolved]

    EventRequestCreated:
      description: request.created
      allOf:
        - $ref: '#/components/schemas/NearbyRequest'

    EventRequestTaken:
      description: request.taken; the request is gone from the nearby list
      type: object
      required: [pickupId, reason]
      properties:
        pickupId: { type: string, format: uuid }
        reason: { type: string, enum: [ACCEPTED, CANCELLED, EXPIRED] }

    EventPickupChanged:
      description: |
        request.expired, pickup.accepted, pickup.released, pickup.arrived, pickup.weighed, pickup.confirmed,
        pickup.disputed, pickup.paid, pickup.cancelled. Clients refetch GET /pickups/{pickupId} for detail.
      type: object
      required: [pickupId, displayNo, status, at]
      properties:
        pickupId: { type: string, format: uuid }
        displayNo: { type: string }
        status: { $ref: '#/components/schemas/PickupStatus' }
        at: { type: string, format: date-time }

    EventCollectorLocation:
      description: collector.location
      type: object
      required: [pickupId, lat, lng, at]
      properties:
        pickupId: { type: string, format: uuid }
        lat: { type: number }
        lng: { type: number }
        at: { type: string, format: date-time }

    EventCodeLocked:
      description: pickup.code_locked (admins)
      type: object
      required: [pickupId, displayNo, collectorId, at]
      properties:
        pickupId: { type: string, format: uuid }
        displayNo: { type: string }
        collectorId: { type: string, format: uuid }
        at: { type: string, format: date-time }

    EventDispute:
      description: dispute.opened, dispute.resolved
      allOf:
        - $ref: '#/components/schemas/Dispute'
