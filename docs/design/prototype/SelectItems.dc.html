<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>Select items to sell</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400..800&amp;family=Hind+Siliguri:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#13304A}a:hover{color:#0B7A5C}
:focus-visible{outline:3px solid #0B7A5C;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #EEF0EC; color: #13304A; font-family: 'Hind Siliguri', 'Noto Sans Bengali', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 12px 20px 8px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="Home.dc.html" aria-label="পেছনে যান" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; color: #13304A">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      </a>
      <span style="font-size: 14px; font-weight: 600; color: #4F5B66">ধাপ ১/২</span>
    </div>
    <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
      <span style="height: 6px; border-radius: 3px; background: #13304A"></span>
      <span style="height: 6px; border-radius: 3px; background: #D5D9D3"></span>
    </div>
    <h1 style="margin: 6px 0 0; font-family: 'Anek Bangla', 'Noto Sans Bengali', sans-serif; font-size: 28px; font-weight: 700; line-height: 1.2">কী বিক্রি করবেন?</h1>
    <p style="margin: 0; font-size: 16px; color: #4F5B66">এক বা একাধিক জিনিস বেছে নিন।</p>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 8px 20px 20px; display: flex; flex-direction: column; gap: 22px">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <button type="button" aria-pressed="{{ironPressed}}" onClick="{{ironToggle}}" style="position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; min-height: 112px; padding: 14px; border-radius: 14px; border: 2px solid {{ironBd}}; background: {{ironBg}}; color: #13304A; text-align: left; font-family: 'Hind Siliguri', sans-serif; cursor: pointer">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h14M5 20h14M12 4v16"></path></svg>
        <span style="font-size: 17px; font-weight: 700">লোহা</span>
        <span style="font-size: 14px; color: #4F5B66">৳৫০/কেজি</span>
        <sc-if value="{{ironOn}}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="position: absolute; top: 10px; right: 10px; width: 26px; height: 26px; border-radius: 50%; background: #13304A; color: #FFC72C; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span></sc-if>
      </button>
      <button type="button" aria-pressed="{{paperPressed}}" onClick="{{paperToggle}}" style="position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; min-height: 112px; padding: 14px; border-radius: 14px; border: 2px solid {{paperBd}}; background: {{paperBg}}; color: #13304A; text-align: left; font-family: 'Hind Siliguri', sans-serif; cursor: pointer">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="14" height="16" rx="1"></rect><path d="M18 8h2v10a2 2 0 0 1-2 2M7 8h8M7 12h8M7 16h5"></path></svg>
        <span style="font-size: 17px; font-weight: 700">পুরোনো পত্রিকা</span>
        <span style="font-size: 14px; color: #4F5B66">৳৩০/কেজি</span>
        <sc-if value="{{paperOn}}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="position: absolute; top: 10px; right: 10px; width: 26px; height: 26px; border-radius: 50%; background: #13304A; color: #FFC72C; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span></sc-if>
      </button>
      <button type="button" aria-pressed="{{plasticPressed}}" onClick="{{plasticToggle}}" style="position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; min-height: 112px; padding: 14px; border-radius: 14px; border: 2px solid {{plasticBd}}; background: {{plasticBg}}; color: #13304A; text-align: left; font-family: 'Hind Siliguri', sans-serif; cursor: pointer">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2h4v3l2 3v12a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2V8l2-3z"></path><path d="M8 12h8"></path></svg>
        <span style="font-size: 17px; font-weight: 700">প্লাস্টিক</span>
        <span style="font-size: 14px; color: #4F5B66">৳৩৫/কেজি</span>
        <sc-if value="{{plasticOn}}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="position: absolute; top: 10px; right: 10px; width: 26px; height: 26px; border-radius: 50%; background: #13304A; color: #FFC72C; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span></sc-if>
      </button>
      <button type="button" aria-pressed="{{cartonPressed}}" onClick="{{cartonToggle}}" style="position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; min-height: 112px; padding: 14px; border-radius: 14px; border: 2px solid {{cartonBd}}; background: {{cartonBg}}; color: #13304A; text-align: left; font-family: 'Hind Siliguri', sans-serif; cursor: pointer">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"></path><path d="M3 7l9 4 9-4M12 11v10"></path></svg>
        <span style="font-size: 17px; font-weight: 700">কার্টন</span>
        <span style="font-size: 14px; color: #4F5B66">৳১৮/কেজি</span>
        <sc-if value="{{cartonOn}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="position: absolute; top: 10px; right: 10px; width: 26px; height: 26px; border-radius: 50%; background: #13304A; color: #FFC72C; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span></sc-if>
      </button>
      <button type="button" aria-pressed="{{aluPressed}}" onClick="{{aluToggle}}" style="position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; min-height: 112px; padding: 14px; border-radius: 14px; border: 2px solid {{aluBd}}; background: {{aluBg}}; color: #13304A; text-align: left; font-family: 'Hind Siliguri', sans-serif; cursor: pointer">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="3" width="10" height="18" rx="2"></rect><path d="M7 7h10M7 17h10"></path></svg>
        <span style="font-size: 17px; font-weight: 700">অ্যালুমিনিয়াম</span>
        <span style="font-size: 14px; color: #4F5B66">৳১৬০/কেজি</span>
        <sc-if value="{{aluOn}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="position: absolute; top: 10px; right: 10px; width: 26px; height: 26px; border-radius: 50%; background: #13304A; color: #FFC72C; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span></sc-if>
      </button>
      <button type="button" aria-pressed="{{ewastePressed}}" onClick="{{ewasteToggle}}" style="position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; min-height: 112px; padding: 14px; border-radius: 14px; border: 2px solid {{ewasteBd}}; background: {{ewasteBg}}; color: #13304A; text-align: left; font-family: 'Hind Siliguri', sans-serif; cursor: pointer">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"></rect><path d="M11 18h2"></path></svg>
        <span style="font-size: 17px; font-weight: 700">ইলেকট্রনিক্স</span>
        <span style="font-size: 14px; color: #4F5B66">দেখে দর</span>
        <sc-if value="{{ewasteOn}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="position: absolute; top: 10px; right: 10px; width: 26px; height: 26px; border-radius: 50%; background: #13304A; color: #FFC72C; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span></sc-if>
      </button>
    </div>

    <div role="group" aria-labelledby="weight-label" style="display: flex; flex-direction: column; gap: 10px">
      <span id="weight-label" style="font-family: 'Anek Bangla', 'Noto Sans Bengali', sans-serif; font-size: 19px; font-weight: 700">সব মিলিয়ে আনুমানিক ওজন</span>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <button type="button" aria-pressed="{{lowPressed}}" onClick="{{pickLow}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 2px solid {{lowBd}}; background: {{lowBg}}; color: {{lowFg}}; font-family: 'Hind Siliguri', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer">৫ কেজির কম</button>
        <button type="button" aria-pressed="{{midPressed}}" onClick="{{pickMid}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 2px solid {{midBd}}; background: {{midBg}}; color: {{midFg}}; font-family: 'Hind Siliguri', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer">৫–১৫ কেজি</button>
        <button type="button" aria-pressed="{{highPressed}}" onClick="{{pickHigh}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 2px solid {{highBd}}; background: {{highBg}}; color: {{highFg}}; font-family: 'Hind Siliguri', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer">১৫ কেজির বেশি</button>
        <button type="button" aria-pressed="{{unsurePressed}}" onClick="{{pickUnsure}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 2px solid {{unsureBd}}; background: {{unsureBg}}; color: {{unsureFg}}; font-family: 'Hind Siliguri', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer">জানি না</button>
      </div>
    </div>

    <button type="button" style="display: flex; align-items: center; gap: 14px; min-height: 72px; padding: 12px 16px; border-radius: 14px; border: 2px dashed #8A949E; background: transparent; color: #13304A; text-align: left; font-family: 'Hind Siliguri', sans-serif; cursor: pointer">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
      <span style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 16px; font-weight: 700">ছবি তুলুন (ঐচ্ছিক)</span>
        <span style="font-size: 14px; color: #4F5B66">ছবি দিলে সংগ্রাহক আগে থেকেই বুঝবেন</span>
      </span>
    </button>
  </main>

  <footer style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px 18px; background: #FFFFFF; border-top: 1px solid #D5D9D3">
    <span style="font-size: 16px; font-weight: 600">{{countLabel}}</span>
    <sc-if value="{{hasAny}}" hint-placeholder-val="{{ true }}">
      <a href="Schedule.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 56px; min-width: 150px; padding: 0 22px; border-radius: 14px; background: #FFC72C; color: #13304A; border: 2px solid #13304A; font-family: 'Anek Bangla', sans-serif; font-size: 20px; font-weight: 700; text-decoration: none">পরবর্তী</a>
    </sc-if>
    <sc-if value="{{noneSelected}}" hint-placeholder-val="{{ false }}">
      <button type="button" disabled style="min-height: 56px; min-width: 150px; padding: 0 22px; border-radius: 14px; background: #D5D9D3; color: #4F5B66; border: 0; font-family: 'Anek Bangla', sans-serif; font-size: 20px; font-weight: 700">পরবর্তী</button>
    </sc-if>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const sel = s.sel || { iron: true, paper: true, plastic: true, carton: false, alu: false, ewaste: false };
    const weight = s.weight || 'mid';
    const bn = (n) => String(n).replace(/\d/g, (d) => '০১২৩৪৫৬৭৮৯'[d]);
    const v = {};
    ['iron', 'paper', 'plastic', 'carton', 'alu', 'ewaste'].forEach((k) => {
      const on = !!sel[k];
      v[k + 'On'] = on;
      v[k + 'Pressed'] = on ? 'true' : 'false';
      v[k + 'Bg'] = on ? '#FFF4CC' : '#FFFFFF';
      v[k + 'Bd'] = on ? '#13304A' : '#D5D9D3';
      v[k + 'Toggle'] = () => this.setState({ sel: Object.assign({}, sel, { [k]: !on }), weight });
    });
    ['low', 'mid', 'high', 'unsure'].forEach((k) => {
      const on = weight === k;
      v[k + 'Pressed'] = on ? 'true' : 'false';
      v[k + 'Bg'] = on ? '#13304A' : '#FFFFFF';
      v[k + 'Fg'] = on ? '#FFFFFF' : '#13304A';
      v[k + 'Bd'] = on ? '#13304A' : '#D5D9D3';
      v['pick' + k.charAt(0).toUpperCase() + k.slice(1)] = () => this.setState({ sel, weight: k });
    });
    const count = Object.keys(sel).filter((k) => sel[k]).length;
    v.countLabel = count > 0 ? bn(count) + 'টি জিনিস বাছাই হয়েছে' : 'কিছু বাছাই হয়নি';
    v.hasAny = count > 0;
    v.noneSelected = count === 0;
    return v;
  }
}
</script>
</body>
</html>
