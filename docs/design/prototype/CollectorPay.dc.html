<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>Pay and complete pickup</title>

<style>

a{color:#13304A}a:hover{color:#0B7A5C}
:focus-visible{outline:3px solid #0B7A5C;outline-offset:2px}
input::placeholder{color:#6B7580}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #EEF0EC; color: #13304A; font-family: 'Hind Siliguri', 'Noto Sans Bengali', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="background: #13304A; color: #FFFFFF; padding: 10px 20px 16px; display: flex; flex-direction: column; gap: 4px">
    <a href="WeighEntry.dc.html" aria-label="পেছনে যান" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; color: #FFFFFF">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Anek Bangla', 'Noto Sans Bengali', sans-serif; font-size: 26px; font-weight: 700; line-height: 1.2">টাকা পরিশোধ</h1>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 16px">
    <div role="status" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; background: #DCEFE7">
      <span aria-hidden="true" style="flex: none; width: 32px; height: 32px; border-radius: 50%; background: #0B7A5C; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
      <span style="font-size: 15px; font-weight: 600; line-height: 1.4">রাশেদা বেগম ওজন নিশ্চিত করেছেন</span>
    </div>

    <section aria-label="পরিশোধের পরিমাণ" style="background: #FFFFFF; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center">
      <span style="font-size: 15px; color: #4F5B66">পরিশোধ করতে হবে</span>
      <span style="font-family: 'Anek Bangla', 'Noto Sans Bengali', sans-serif; font-size: 48px; font-weight: 800; line-height: 1.05">৳৭১০</span>
      <span style="font-size: 14px; color: #4F5B66">১৭.৫ কেজি: লোহা, পুরোনো পত্রিকা, প্লাস্টিক</span>
    </section>

    <section aria-labelledby="method-label" style="background: #FFFFFF; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
        <h2 id="method-label" style="margin: 0; font-size: 15px; font-weight: 600; color: #4F5B66">গ্রাহক বেছে নিয়েছেন</h2>
        <span style="font-family: 'Anek Bangla', sans-serif; font-size: 20px; font-weight: 700">বিকাশ</span>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px; border-radius: 12px; background: #EEF0EC">
        <span style="font-family: 'Anek Bangla', sans-serif; font-size: 20px; font-weight: 700; letter-spacing: 0.5px">০১৭XX-XXX৪৫৬</span>
        <button type="button" aria-label="নম্বর কপি করুন" style="flex: none; width: 44px; height: 44px; border-radius: 10px; border: 0; background: #FFFFFF; color: #13304A; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"></rect><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"></path></svg></button>
      </div>
      <ol style="margin: 0; padding: 0 0 0 22px; display: flex; flex-direction: column; gap: 6px; font-size: 15px; line-height: 1.45">
        <li>বিকাশ অ্যাপ থেকে এই নম্বরে ৳৭১০ পাঠান।</li>
        <li>বিকাশ থেকে পাওয়া ট্রানজেকশন আইডি নিচে লিখুন।</li>
      </ol>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="trx" style="font-size: 14px; font-weight: 600">ট্রানজেকশন আইডি (TrxID)</label>
        <input id="trx" type="text" placeholder="যেমন: 9KX7ABC123" style="min-height: 52px; border: 2px solid #13304A; border-radius: 12px; padding: 0 14px; font-family: 'Hind Siliguri', sans-serif; font-size: 17px; color: #13304A; background: #FFFFFF">
      </div>
    </section>
  </main>

  <footer style="padding: 12px 20px 18px; background: #FFFFFF; border-top: 1px solid #D5D9D3">
    <a href="CollectorHome.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 14px; background: #FFC72C; color: #13304A; border: 2px solid #13304A; font-family: 'Anek Bangla', sans-serif; font-size: 20px; font-weight: 700; text-decoration: none">পরিশোধ করেছি, পিকআপ শেষ</a>
  </footer>
</div>
</x-dc>

</body>
</html>
