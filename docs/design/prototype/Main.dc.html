<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>BhangariWala sign in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400..800&amp;family=Hind+Siliguri:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#13304A}a:hover{color:#0B7A5C}
:focus-visible{outline:3px solid #0B7A5C;outline-offset:2px}
input::placeholder{color:#6B7580}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #EEF0EC; color: #13304A; font-family: 'Hind Siliguri', 'Noto Sans Bengali', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="display: flex; justify-content: flex-end; padding: 16px 20px 0">
    <button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 2px solid #13304A; background: transparent; color: #13304A; font-family: 'Hind Siliguri', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer">English</button>
  </div>
  <div style="padding: 16px 24px 0; display: flex; flex-direction: column; gap: 16px">
    <div style="width: 64px; height: 64px; border-radius: 16px; background: #FFC72C; border: 2px solid #13304A; display: flex; align-items: center; justify-content: center; color: #13304A">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18M6 21h12M4 7h16"></path><path d="M7 7l-3 7a3 3 0 0 0 6 0L7 7z"></path><path d="M17 7l-3 7a3 3 0 0 0 6 0l-3-7z"></path></svg>
    </div>
    <h1 style="margin: 0; font-family: 'Anek Bangla', 'Noto Sans Bengali', sans-serif; font-size: 46px; font-weight: 800; line-height: 1.05">ভাঙ্গারিওয়ালা</h1>
    <p style="margin: 0; font-size: 19px; line-height: 1.5">পুরোনো লোহা, কাগজ, প্লাস্টিক বিক্রি করুন বাসায় বসেই।</p>
    <ul style="list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 12px">
      <li style="display: flex; gap: 12px; align-items: center; font-size: 16px; line-height: 1.4">
        <span style="flex: none; width: 38px; height: 38px; border-radius: 10px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #0B7A5C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"></path><circle cx="7.5" cy="7.5" r="1.5"></circle></svg></span>
        আজকের ন্যায্য দর আগেই জানুন
      </li>
      <li style="display: flex; gap: 12px; align-items: center; font-size: 16px; line-height: 1.4">
        <span style="flex: none; width: 38px; height: 38px; border-radius: 10px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #0B7A5C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18M6 21h12M4 7h16"></path><path d="M7 7l-3 7a3 3 0 0 0 6 0L7 7z"></path><path d="M17 7l-3 7a3 3 0 0 0 6 0l-3-7z"></path></svg></span>
        আপনার সামনে ওজন, অ্যাপে হিসাব
      </li>
      <li style="display: flex; gap: 12px; align-items: center; font-size: 16px; line-height: 1.4">
        <span style="flex: none; width: 38px; height: 38px; border-radius: 10px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #0B7A5C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"></rect><path d="M3 10h18M16 15h2"></path></svg></span>
        ক্যাশ, বিকাশ বা নগদে সাথে সাথে টাকা
      </li>
    </ul>
  </div>
  <div style="margin-top: auto; background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 24px 24px 28px; display: flex; flex-direction: column; gap: 18px">
    <div role="group" aria-labelledby="role-label" style="display: flex; flex-direction: column; gap: 8px">
      <span id="role-label" style="font-size: 15px; font-weight: 600">আপনি কীভাবে ব্যবহার করবেন?</span>
      <div style="display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: #EEF0EC">
        <button type="button" aria-pressed="{{hhPressed}}" onClick="{{pickHousehold}}" style="flex: 1; min-height: 48px; border-radius: 10px; border: 0; background: {{hhBg}}; color: {{hhFg}}; font-family: 'Hind Siliguri', sans-serif; font-size: 16px; font-weight: 600; cursor: pointer">জিনিস বিক্রি করব</button>
        <button type="button" aria-pressed="{{colPressed}}" onClick="{{pickCollector}}" style="flex: 1; min-height: 48px; border-radius: 10px; border: 0; background: {{colBg}}; color: {{colFg}}; font-family: 'Hind Siliguri', sans-serif; font-size: 16px; font-weight: 600; cursor: pointer">আমি সংগ্রাহক</button>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="phone" style="font-size: 15px; font-weight: 600">মোবাইল নম্বর</label>
      <div style="display: flex; align-items: stretch; min-height: 56px; border: 2px solid #13304A; border-radius: 14px; overflow: hidden">
        <span style="padding: 0 14px; font-size: 17px; font-weight: 600; border-right: 2px solid #D5D9D3; display: flex; align-items: center">+৮৮০</span>
        <input id="phone" type="tel" inputmode="numeric" placeholder="১XXX-XXXXXX" style="flex: 1; min-width: 0; border: 0; padding: 0 14px; font-size: 18px; font-family: 'Hind Siliguri', sans-serif; color: #13304A; background: transparent">
      </div>
      <span style="font-size: 14px; color: #4F5B66">এই নম্বরে একটি যাচাই কোড পাঠানো হবে।</span>
    </div>
    <a href="{{nextHref}}" style="display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 14px; background: #FFC72C; color: #13304A; border: 2px solid #13304A; font-family: 'Anek Bangla', sans-serif; font-size: 20px; font-weight: 700; text-decoration: none">কোড পাঠান</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const role = (this.state && this.state.role) || 'household';
    const isHH = role === 'household';
    return {
      hhBg: isHH ? '#13304A' : 'transparent',
      hhFg: isHH ? '#FFFFFF' : '#13304A',
      colBg: isHH ? 'transparent' : '#13304A',
      colFg: isHH ? '#13304A' : '#FFFFFF',
      hhPressed: isHH ? 'true' : 'false',
      colPressed: isHH ? 'false' : 'true',
      pickHousehold: () => this.setState({ role: 'household' }),
      pickCollector: () => this.setState({ role: 'collector' }),
      nextHref: isHH ? 'OTP.dc.html' : 'CollectorSignup.dc.html'
    };
  }
}
</script>
</body>
</html>
