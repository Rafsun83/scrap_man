<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>Collector on the way</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@500;600;700&amp;family=Hind+Siliguri:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#13304A}a:hover{color:#0B2236}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F6F2; font-family: 'Hind Siliguri', sans-serif; color: #13304A; display: flex; flex-direction: column; overflow: hidden">

  <div style="height: 270px; position: relative; background: #E9ECE5; flex-shrink: 0">
    <svg width="390" height="270" viewBox="0 0 390 270" role="img" aria-label="মানচিত্র: সংগ্রাহক আপনার বাসার দিকে আসছেন" style="display: block">
      <rect width="390" height="270" fill="#E9ECE5"></rect>
      <path d="M0 70 H390 M0 170 H390 M80 0 V270 M230 0 V270 M330 0 V270" stroke="#FFFFFF" stroke-width="14"></path>
      <path d="M0 120 H390 M150 0 V270" stroke="#FFFFFF" stroke-width="6"></path>
      <rect x="92" y="82" width="50" height="30" fill="#DDE2D8"></rect>
      <rect x="242" y="182" width="78" height="40" fill="#DDE2D8"></rect>
      <rect x="160" y="130" width="62" height="30" fill="#D5E6DA"></rect>
      <path d="M80 230 V170 H230 V95" fill="none" stroke="#13304A" stroke-width="4" stroke-dasharray="2 8" stroke-linecap="round"></path>
      <circle cx="80" cy="230" r="14" fill="#13304A"></circle>
      <circle cx="80" cy="230" r="5" fill="#FFC72C"></circle>
      <rect x="216" y="70" width="28" height="28" rx="4" fill="#FFFFFF" stroke="#13304A" stroke-width="2"></rect>
      <path d="M223 86 l7 -6 l7 6 v6 h-14 z" fill="none" stroke="#13304A" stroke-width="1.8" stroke-linejoin="round"></path>
    </svg>
    <a href="Home.dc.html" aria-label="ফিরে যান" style="position: absolute; top: 52px; left: 20px; width: 48px; height: 48px; border-radius: 6px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(19,48,74,0.08), 0 6px 20px rgba(19,48,74,0.08); display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#13304A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
  </div>

  <div style="flex: 1; min-height: 0; background: #F5F6F2; border-radius: 6px 6px 0 0; margin-top: -12px; position: relative; padding: 20px 20px 24px; display: flex; flex-direction: column; gap: 16px">

    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <h1 style="margin: 0; font-family: 'Anek Bangla', sans-serif; font-weight: 600; font-size: 24px; line-height: 1.2">জসিম আসছেন</h1>
      <span style="font-size: 14px; font-weight: 600; padding: 4px 10px; border-radius: 4px; background: #E3F2EC; color: #0B7A5C">প্রায় ১০ মিনিট</span>
    </div>

    <div style="background: #FFFFFF; border-radius: 6px; box-shadow: 0 1px 2px rgba(19,48,74,0.05), 0 6px 20px rgba(19,48,74,0.05); padding: 12px 14px; display: flex; align-items: center; gap: 12px">
      <div style="width: 44px; height: 44px; border-radius: 6px; background: #13304A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Anek Bangla', sans-serif; font-weight: 600; font-size: 18px; flex-shrink: 0">জ</div>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
        <div style="font-size: 16px; font-weight: 600">জসিম উদ্দিন</div>
        <div style="font-size: 13px; color: #0B7A5C; display: flex; align-items: center; gap: 4px">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"></path><path d="M8.5 12l2.5 2.5 4.5-5"></path></svg>
          যাচাইকৃত সংগ্রাহক
        </div>
      </div>
      <a href="#call" style="height: 48px; padding: 0 14px; border-radius: 6px; border: 1.5px solid #E3E6E0; box-sizing: border-box; text-decoration: none; display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 15px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"></path></svg>
        কল
      </a>
    </div>

    <div style="background: #FFFFFF; border: 1.5px solid #13304A; border-radius: 6px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <span style="font-size: 14px; font-weight: 600">পিকআপ কোড</span>
        <div style="display: flex; gap: 6px">
          <span style="width: 40px; height: 48px; border-radius: 4px; background: #F5F6F2; display: flex; align-items: center; justify-content: center; font-family: 'Anek Bangla', sans-serif; font-weight: 700; font-size: 26px">৪</span>
          <span style="width: 40px; height: 48px; border-radius: 4px; background: #F5F6F2; display: flex; align-items: center; justify-content: center; font-family: 'Anek Bangla', sans-serif; font-weight: 700; font-size: 26px">৮</span>
          <span style="width: 40px; height: 48px; border-radius: 4px; background: #F5F6F2; display: flex; align-items: center; justify-content: center; font-family: 'Anek Bangla', sans-serif; font-weight: 700; font-size: 26px">২</span>
          <span style="width: 40px; height: 48px; border-radius: 4px; background: #F5F6F2; display: flex; align-items: center; justify-content: center; font-family: 'Anek Bangla', sans-serif; font-weight: 700; font-size: 26px">১</span>
        </div>
      </div>
      <p style="margin: 0; font-size: 13px; line-height: 1.5; color: #5B6B7A">সংগ্রাহক এলে এই কোডটি তাঁকে বলবেন। কোড না মিললে জিনিস দেবেন না।</p>
    </div>

    <div style="display: flex; flex-direction: column; gap: 0">
      <div style="font-size: 14px; font-weight: 500; color: #5B6B7A; margin-bottom: 8px">অগ্রগতি</div>
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; gap: 12px; height: 34px">
          <div style="{{s.dot}}">{{s.mark}}</div>
          <span style="{{s.text}}">{{s.label}}</span>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const base = 'width: 24px; height: 24px; box-sizing: border-box; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; flex-shrink: 0; ';
const labels = ['অনুরোধ গ্রহণ করেছেন', 'পথে আছেন', 'ওজন ও হিসাব', 'টাকা পরিশোধ'];
const nums = ['১', '২', '৩', '৪'];
const current = 1;
return {
steps: labels.map((label, i) => ({
label: label,
mark: i < current ? '✓' : nums[i],
dot: base + (i < current ? 'background: #0B7A5C; color: #FFFFFF;' : i === current ? 'border: 2px solid #13304A; color: #13304A;' : 'border: 1.5px solid #C9CFC6; color: #5B6B7A;'),
text: 'font-size: 15px; ' + (i === current ? 'font-weight: 600; color: #13304A;' : i < current ? 'color: #13304A;' : 'color: #5B6B7A;')
}))
};
}
}
</script>
</body>
</html>
