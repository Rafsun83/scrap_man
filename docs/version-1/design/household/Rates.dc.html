<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>All rates</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@500;600;700&amp;family=Hind+Siliguri:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#13304A}a:hover{color:#0B2236}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F6F2; font-family: 'Hind Siliguri', sans-serif; color: #13304A; display: flex; flex-direction: column; overflow: hidden">

  <div style="padding: 52px 20px 0; display: flex; align-items: center; gap: 12px">
    <a href="Home.dc.html" aria-label="ফিরে যান" style="width: 48px; height: 48px; border-radius: 6px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(19,48,74,0.05), 0 6px 20px rgba(19,48,74,0.05); display: flex; align-items: center; justify-content: center; flex-shrink: 0">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#13304A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <h1 style="margin: 0; font-family: 'Anek Bangla', sans-serif; font-weight: 600; font-size: 22px; line-height: 1.2">আজকের দর</h1>
      <div style="font-size: 13px; color: #5B6B7A">মঙ্গলবার, ২৪ নভেম্বর · সকাল ৮টায় হালনাগাদ</div>
    </div>
  </div>

  <div style="flex: 1; min-height: 0; overflow: hidden; padding: 22px 20px 16px; display: flex; flex-direction: column; gap: 16px">
    <div style="background: #FFFFFF; border-radius: 6px; box-shadow: 0 1px 2px rgba(19,48,74,0.05), 0 6px 20px rgba(19,48,74,0.05); display: flex; flex-direction: column">
      <div style="display: flex; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #EDEFEA; font-size: 13px; color: #5B6B7A">
        <span>জিনিস</span>
        <span>প্রতি কেজি, টাকায়</span>
      </div>
      <sc-for list="{{rates}}" as="r" hint-placeholder-count="6">
        <div style="{{r.rowStyle}}">
          <div style="width: 40px; height: 40px; border-radius: 4px; background: {{r.tint}}; display: flex; align-items: center; justify-content: center; font-family: 'Anek Bangla', sans-serif; font-weight: 600; font-size: 15px; flex-shrink: 0">{{r.initial}}</div>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <div style="font-size: 16px; font-weight: 600">{{r.name}}</div>
            <span style="align-self: flex-start; font-size: 12px; font-weight: 600; padding: 2px 6px; border-radius: 4px; background: {{r.chipBg}}; color: {{r.chipFg}}">{{r.change}}</span>
          </div>
          <div style="font-family: 'Anek Bangla', sans-serif; font-weight: 700; font-size: {{r.priceSize}}; color: {{r.priceColor}}">{{r.price}}</div>
        </div>
      </sc-for>
    </div>

    <div style="display: flex; gap: 12px; align-items: flex-start; background: #FFFFFF; border: 1px solid #E3E6E0; border-radius: 6px; padding: 14px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B6B7A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
      <p style="margin: 0; font-size: 14px; line-height: 1.6; color: #5B6B7A">দর প্রতিদিন সকালে বাজার অনুযায়ী ঠিক হয়। সংগ্রাহক যখন আপনার অনুরোধ গ্রহণ করেন, সেই সময়ের দরেই হিসাব হবে।</p>
    </div>
  </div>

  <div style="padding: 12px 20px 28px">
    <a href="SelectItems.dc.html" style="height: 56px; border-radius: 6px; background: #FFC72C; color: #13304A; font-weight: 600; font-size: 16px; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      ভাঙ্গারি বিক্রি করুন
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const up = { chipBg: '#E3F2EC', chipFg: '#0B7A5C' };
const down = { chipBg: '#FBEAE3', chipFg: '#A63D16' };
const same = { chipBg: '#EEF0EC', chipFg: '#5B6B7A' };
const list = [
Object.assign({ name: 'লোহা', initial: 'লো', tint: '#E8ECF1', price: '৳৫০', change: '▲ ৳২ গতকালের চেয়ে' }, up),
Object.assign({ name: 'পুরোনো পত্রিকা', initial: 'প', tint: '#FFF4D6', price: '৳৩০', change: 'অপরিবর্তিত' }, same),
Object.assign({ name: 'প্লাস্টিক', initial: 'প্লা', tint: '#E3F2EC', price: '৳৩৫', change: '▼ ৳১ গতকালের চেয়ে' }, down),
Object.assign({ name: 'কার্টন', initial: 'কা', tint: '#F3ECE2', price: '৳১৮', change: '▲ ৳১ গতকালের চেয়ে' }, up),
Object.assign({ name: 'অ্যালুমিনিয়াম', initial: 'অ্যা', tint: '#F1EAF6', price: '৳১৬০', change: '▲ ৳৫ গতকালের চেয়ে' }, up),
Object.assign({ name: 'ইলেকট্রনিক্স', initial: 'ই', tint: '#E6EEF5', price: 'দেখে দর', change: 'সংগ্রাহক দেখে বলবেন' }, same)
];
return {
rates: list.map((r, i) => Object.assign({}, r, {
rowStyle: 'display: flex; align-items: center; gap: 14px; padding: 12px 16px;' + (i < list.length - 1 ? ' border-bottom: 1px solid #EDEFEA;' : ''),
priceSize: r.price === 'দেখে দর' ? '15px' : '20px',
priceColor: r.price === 'দেখে দর' ? '#5B6B7A' : '#13304A'
}))
};
}
}
</script>
</body>
</html>
