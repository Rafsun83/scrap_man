<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>Profile and addresses</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@500;600;700&amp;family=Hind+Siliguri:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#13304A}a:hover{color:#0B2236}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F6F2; font-family: 'Hind Siliguri', sans-serif; color: #13304A; display: flex; flex-direction: column; overflow: hidden">

  <div style="flex: 1; min-height: 0; overflow: hidden; padding: 52px 20px 12px; display: flex; flex-direction: column; gap: 18px">

    <div style="display: flex; align-items: center; gap: 14px">
      <div style="width: 56px; height: 56px; border-radius: 6px; background: #13304A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Anek Bangla', sans-serif; font-weight: 600; font-size: 22px; flex-shrink: 0">রা</div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
        <h1 style="margin: 0; font-family: 'Anek Bangla', sans-serif; font-weight: 600; font-size: 22px; line-height: 1.2">রাশেদা বেগম</h1>
        <span style="font-size: 14px; color: #5B6B7A">+৮৮০ ১৭XX-XXX৪৫৬</span>
      </div>
      <a href="#edit" aria-label="প্রোফাইল সম্পাদনা" style="width: 48px; height: 48px; border-radius: 6px; border: 1.5px solid #E3E6E0; box-sizing: border-box; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#13304A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path><path d="M13.5 6.5l4 4"></path></svg>
      </a>
    </div>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-size: 14px; font-weight: 500; color: #5B6B7A">সংরক্ষিত ঠিকানা</h2>
      <div style="background: #FFFFFF; border-radius: 6px; box-shadow: 0 1px 2px rgba(19,48,74,0.05), 0 6px 20px rgba(19,48,74,0.05); display: flex; flex-direction: column">
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #EDEFEA">
          <div style="width: 36px; height: 36px; border-radius: 4px; background: #FFF4D6; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#13304A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>
          </div>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
            <div style="display: flex; align-items: center; gap: 6px">
              <span style="font-size: 15px; font-weight: 600">বাসা</span>
              <span style="font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 4px; background: #E8ECF1; color: #13304A">মূল ঠিকানা</span>
            </div>
            <span style="font-size: 13px; color: #5B6B7A; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">বাড়ি ১২, রোড ৪, ব্লক সি, মিরপুর ১০, ঢাকা</span>
          </div>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #EDEFEA">
          <div style="width: 36px; height: 36px; border-radius: 4px; background: #EEF0EC; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#13304A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"></path><circle cx="12" cy="9" r="2.5"></circle></svg>
          </div>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
            <span style="font-size: 15px; font-weight: 600">মায়ের বাসা</span>
            <span style="font-size: 13px; color: #5B6B7A; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">ফ্ল্যাট ৩বি, রোড ২, শ্যামলী, ঢাকা</span>
          </div>
        </div>
        <a href="#add" style="height: 52px; padding: 0 14px; display: flex; align-items: center; gap: 12px; text-decoration: none; font-size: 15px; font-weight: 600">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
          নতুন ঠিকানা যোগ করুন
        </a>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-size: 14px; font-weight: 500; color: #5B6B7A">সেটিংস</h2>
      <div style="background: #FFFFFF; border-radius: 6px; box-shadow: 0 1px 2px rgba(19,48,74,0.05), 0 6px 20px rgba(19,48,74,0.05); display: flex; flex-direction: column">
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid #EDEFEA">
          <span style="font-size: 15px">ভাষা</span>
          <div role="group" aria-label="ভাষা" style="display: flex; gap: 6px">
            <button onClick="{{pickBn}}" aria-pressed="{{bnOn}}" style="{{bnStyle}}">বাংলা</button>
            <button onClick="{{pickEn}}" aria-pressed="{{enOn}}" style="{{enStyle}}">English</button>
          </div>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid #EDEFEA">
          <span style="font-size: 15px">নোটিফিকেশন</span>
          <button onClick="{{toggleNotify}}" role="switch" aria-checked="{{notify}}" aria-label="নোটিফিকেশন" style="{{switchStyle}}">
            <span style="{{knobStyle}}"></span>
          </button>
        </div>
        <a href="#help" style="height: 52px; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; text-decoration: none; font-size: 15px; border-bottom: 1px solid #EDEFEA">
          সাহায্য ও যোগাযোগ
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6B7A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
        </a>
        <a href="#terms" style="height: 52px; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; text-decoration: none; font-size: 15px">
          শর্তাবলি ও গোপনীয়তা
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6B7A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
        </a>
      </div>
    </section>

    <a href="SignIn.dc.html" style="height: 52px; border-radius: 6px; border: 1.5px solid #E3E6E0; box-sizing: border-box; background: #FFFFFF; color: #A63D16; font-weight: 600; font-size: 15px; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4"></path><path d="M10 16l-4-4 4-4M6 12h10"></path></svg>
      লগ আউট
    </a>
  </div>

  <nav aria-label="প্রধান মেনু" style="background: #FFFFFF; border-top: 1px solid #EDEFEA; padding: 10px 16px 24px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px">
    <a href="Home.dc.html" style="height: 56px; border-radius: 6px; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #5B6B7A">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>
      <span style="font-size: 12px; font-weight: 500">হোম</span>
    </a>
    <a href="SelectItems.dc.html" style="height: 56px; border-radius: 6px; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #5B6B7A">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"></rect><path d="M12 8v8M8 12h8"></path></svg>
      <span style="font-size: 12px; font-weight: 500">বিক্রি</span>
    </a>
    <a href="History.dc.html" style="height: 56px; border-radius: 6px; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #5B6B7A">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
      <span style="font-size: 12px; font-weight: 500">ইতিহাস</span>
    </a>
    <a href="Profile.dc.html" aria-current="page" style="height: 56px; border-radius: 6px; background: #EEF2F6; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #13304A">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>
      <span style="font-size: 12px; font-weight: 600">প্রোফাইল</span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { lang: 'bn', notify: true };
}
renderVals() {
const seg = 'height: 36px; padding: 0 12px; border-radius: 4px; background: #FFFFFF; color: #13304A; cursor: pointer; font: 500 14px \'Hind Siliguri\', sans-serif; ';
const on = seg + 'border: 1.5px solid #8A97A3; font-weight: 600;';
const off = seg + 'border: 1.5px solid #E3E6E0;';
const bn = this.state.lang === 'bn';
const n = this.state.notify;
return {
bnOn: bn,
enOn: !bn,
bnStyle: bn ? on : off,
enStyle: bn ? off : on,
pickBn: () => this.setState({ lang: 'bn' }),
pickEn: () => this.setState({ lang: 'en' }),
notify: n,
toggleNotify: () => this.setState({ notify: !n }),
switchStyle: 'width: 48px; height: 28px; box-sizing: border-box; border-radius: 6px; border: none; padding: 3px; cursor: pointer; display: flex; justify-content: ' + (n ? 'flex-end' : 'flex-start') + '; background: ' + (n ? '#0B7A5C' : '#C9CFC6') + ';',
knobStyle: 'width: 22px; height: 22px; border-radius: 4px; background: #FFFFFF; display: block;'
};
}
}
</script>
</body>
</html>
