<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>Verify phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@500;600;700&amp;family=Hind+Siliguri:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#13304A}a:hover{color:#0B2236}
.bw-code:focus{border-color:#8A97A3 !important}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F6F2; font-family: 'Hind Siliguri', sans-serif; color: #13304A; display: flex; flex-direction: column; padding: 52px 24px 32px; gap: 28px; overflow: hidden">

  <a href="SignIn.dc.html" aria-label="ফিরে যান" style="width: 48px; height: 48px; border-radius: 6px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(19,48,74,0.05), 0 6px 20px rgba(19,48,74,0.05); display: flex; align-items: center; justify-content: center">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#13304A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
  </a>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <h1 style="margin: 0; font-family: 'Anek Bangla', sans-serif; font-weight: 600; font-size: 30px; line-height: 1.2">কোড লিখুন</h1>
    <p style="margin: 0; font-size: 16px; line-height: 1.6; color: #5B6B7A">+৮৮০ ১৭XX-XXX৪৫৬ নম্বরে ৬ সংখ্যার একটি কোড পাঠানো হয়েছে। <a href="SignIn.dc.html" style="font-weight: 600; white-space: nowrap">নম্বর বদলান</a></p>
  </div>

  <fieldset style="border: none; margin: 0; padding: 0">
    <legend style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">৬ সংখ্যার কোড</legend>
    <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{boxes}}" as="b" hint-placeholder-count="6">
        <input class="bw-code" inputmode="numeric" maxlength="1" aria-label="{{b.label}}" value="{{b.value}}" onInput="{{b.onInput}}" style="height: 60px; width: 100%; box-sizing: border-box; border-radius: 6px; border: 1.5px solid #E3E6E0; background: #FFFFFF; text-align: center; font: 700 24px 'Anek Bangla', sans-serif; color: #13304A; outline: none">
      </sc-for>
    </div>
  </fieldset>

  <div style="display: flex; justify-content: space-between; align-items: center; font-size: 14px">
    <span style="color: #5B6B7A">কোড পাননি?</span>
    <span style="color: #5B6B7A; font-weight: 500">০:৪৫ পরে আবার পাঠান</span>
  </div>

  <div style="display: flex; gap: 12px; align-items: flex-start; background: #FFF8E6; border: 1px solid #F1E1B4; border-radius: 6px; padding: 14px">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8A5A00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"></path><path d="M12 8v5M12 16h.01"></path></svg>
    <p style="margin: 0; font-size: 14px; line-height: 1.6; color: #5C4300">এই কোড কাউকে বলবেন না। ভাঙ্গারিওয়ালা কখনো ফোন করে কোড চায় না।</p>
  </div>

  <div style="flex: 1"></div>

  <a href="Home.dc.html" style="height: 56px; border-radius: 6px; background: #13304A; color: #FFFFFF; font-weight: 600; font-size: 16px; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
    যাচাই করুন
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { digits: ['১', '২', '৩', '৪', '', ''] };
}
renderVals() {
const digits = this.state.digits;
return {
boxes: digits.map((v, i) => ({
value: v,
label: 'সংখ্যা ' + (i + 1),
onInput: (e) => {
const next = digits.slice();
next[i] = e.target.value.slice(-1);
this.setState({ digits: next });
}
}))
};
}
}
</script>
</body>
</html>
