<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>Pickup history</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@500;600;700&amp;family=Hind+Siliguri:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#13304A}a:hover{color:#0B2236}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F6F2; font-family: 'Hind Siliguri', sans-serif; color: #13304A; display: flex; flex-direction: column; overflow: hidden">

  <div style="flex: 1; min-height: 0; overflow: hidden; padding: 56px 20px 16px; display: flex; flex-direction: column; gap: 18px">
    <h1 style="margin: 0; font-family: 'Anek Bangla', sans-serif; font-weight: 600; font-size: 24px; line-height: 1.2">আমার বিক্রি</h1>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="background: #FFFFFF; border-radius: 6px; box-shadow: 0 1px 2px rgba(19,48,74,0.05), 0 6px 20px rgba(19,48,74,0.05); padding: 14px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 13px; color: #5B6B7A">এ পর্যন্ত পেয়েছেন</span>
        <span style="font-family: 'Anek Bangla', sans-serif; font-weight: 700; font-size: 22px; color: #0B7A5C">৳১,৪৭০</span>
      </div>
      <div style="background: #FFFFFF; border-radius: 6px; box-shadow: 0 1px 2px rgba(19,48,74,0.05), 0 6px 20px rgba(19,48,74,0.05); padding: 14px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 13px; color: #5B6B7A">মোট বিক্রি</span>
        <span style="font-family: 'Anek Bangla', sans-serif; font-weight: 700; font-size: 22px">৩৮.৫ কেজি</span>
      </div>
    </div>

    <div role="group" aria-label="ছাঁকনি" style="display: flex; gap: 8px">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
        <button onClick="{{f.pick}}" aria-pressed="{{f.on}}" style="{{f.style}}">{{f.label}}</button>
      </sc-for>
    </div>

    <sc-if value="{{hasItems}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <sc-for list="{{rows}}" as="p" hint-placeholder-count="3">
          <div style="background: #FFFFFF; border-radius: 6px; box-shadow: 0 1px 2px rgba(19,48,74,0.05), 0 6px 20px rgba(19,48,74,0.05); padding: 14px 16px; display: flex; align-items: center; gap: 12px">
            <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
              <span style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.items}}</span>
              <span style="font-size: 13px; color: #5B6B7A">{{p.meta}}</span>
            </div>
            <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px">
              <span style="font-family: 'Anek Bangla', sans-serif; font-weight: 700; font-size: 17px; color: {{p.amountColor}}">{{p.amount}}</span>
              <span style="font-size: 12px; font-weight: 600; padding: 2px 6px; border-radius: 4px; background: {{p.chipBg}}; color: {{p.chipFg}}">{{p.status}}</span>
            </div>
          </div>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{isEmpty}}" hint-placeholder-val="{{ false }}">
      <div style="background: #FFFFFF; border: 1px solid #E3E6E0; border-radius: 6px; padding: 28px 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
        <div style="width: 56px; height: 56px; border-radius: 6px; background: #F5F6F2; display: flex; align-items: center; justify-content: center">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#5B6B7A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8l-1.5 3h-5z"></path><path d="M9.5 7C6 9.5 4.5 13 5 16.5 5.4 19.5 8 21 12 21s6.6-1.5 7-4.5C19.5 13 18 9.5 14.5 7"></path></svg>
        </div>
        <span style="font-size: 16px; font-weight: 600">{{emptyTitle}}</span>
        <span style="font-size: 14px; color: #5B6B7A; line-height: 1.5">বাসায় পুরোনো জিনিস জমলে একটি অনুরোধ পাঠান।</span>
        <a href="SelectItems.dc.html" style="margin-top: 6px; height: 48px; padding: 0 18px; border-radius: 6px; background: #FFC72C; color: #13304A; font-weight: 600; font-size: 15px; text-decoration: none; display: flex; align-items: center; gap: 8px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
          ভাঙ্গারি বিক্রি করুন
        </a>
      </div>
    </sc-if>
  </div>

  <nav aria-label="প্রধান মেনু" style="background: #FFFFFF; border-top: 1px solid #EDEFEA; padding: 10px 16px 24px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px">
    <a href="Home.dc.html" style="height: 56px; border-radius: 6px; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #5B6B7A">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>
      <span style="font-size: 12px; font-weight: 500">হোম</span>
    </a>
    <a href="SelectItems.dc.html" style="height: 56px; border-radius: 6px; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #5B6B7A">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"></rect><path d="M12 8v8M8 12h8"></path></svg>
      <span style="font-size: 12px; font-weight: 500">বিক্রি</span>
    </a>
    <a href="History.dc.html" aria-current="page" style="height: 56px; border-radius: 6px; background: #EEF2F6; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #13304A">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
      <span style="font-size: 12px; font-weight: 600">ইতিহাস</span>
    </a>
    <a href="Profile.dc.html" style="height: 56px; border-radius: 6px; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #5B6B7A">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>
      <span style="font-size: 12px; font-weight: 500">প্রোফাইল</span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { filter: 0 };
}
renderVals() {
const done = { status: 'সম্পন্ন', chipBg: '#E3F2EC', chipFg: '#0B7A5C', amountColor: '#0B7A5C', kind: 2 };
const ended = { status: 'সময় শেষ', chipBg: '#EEF0EC', chipFg: '#5B6B7A', amountColor: '#5B6B7A', kind: 3 };
const all = [
Object.assign({ items: 'লোহা, পুরোনো পত্রিকা, প্লাস্টিক', meta: '২৪ নভেম্বর · ১৭.৫ কেজি · বিকাশ', amount: '৳৭১০' }, done),
Object.assign({ items: 'লোহা ও পুরোনো পত্রিকা', meta: '৩ নভেম্বর · ১২ কেজি · ক্যাশ', amount: '৳৫২০' }, done),
Object.assign({ items: 'কার্টন, প্লাস্টিক', meta: '১৯ অক্টোবর · ৯ কেজি · নগদ', amount: '৳২৪০' }, done),
Object.assign({ items: 'লোহা', meta: '২৮ সেপ্টেম্বর · কেউ গ্রহণ করেননি', amount: '—' }, ended)
];
const f = this.state.filter;
const rows = all.filter((r) => f === 0 || r.kind === f);
const labels = ['সব', 'চলতি', 'সম্পন্ন', 'বাতিল'];
const base = 'height: 40px; padding: 0 14px; border-radius: 6px; background: #FFFFFF; color: #13304A; cursor: pointer; font: 500 14px \'Hind Siliguri\', sans-serif; ';
return {
filters: labels.map((label, i) => ({
label: label,
on: f === i,
style: base + (f === i ? 'border: 1.5px solid #8A97A3; font-weight: 600;' : 'border: 1.5px solid #E3E6E0;'),
pick: () => this.setState({ filter: i })
})),
rows: rows,
hasItems: rows.length > 0,
isEmpty: rows.length === 0,
emptyTitle: f === 1 ? 'এখন কোনো চলতি অনুরোধ নেই' : 'এখানে কিছু নেই'
};
}
}
</script>
</body>
</html>
