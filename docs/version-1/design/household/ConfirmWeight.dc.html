<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>Confirm weight</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@500;600;700&amp;family=Hind+Siliguri:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#13304A}a:hover{color:#0B2236}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F6F2; font-family: 'Hind Siliguri', sans-serif; color: #13304A; display: flex; flex-direction: column; overflow: hidden">

  <div style="padding: 56px 20px 0; display: flex; flex-direction: column; gap: 4px">
    <h1 style="margin: 0; font-family: 'Anek Bangla', sans-serif; font-weight: 600; font-size: 24px; line-height: 1.2">ওজন মিলিয়ে নিন</h1>
    <p style="margin: 0; font-size: 14px; color: #5B6B7A">জসিম উদ্দিন আপনার সামনে ওজন করেছেন।</p>
  </div>

  <div style="flex: 1; min-height: 0; overflow: hidden; padding: 18px 20px 12px; display: flex; flex-direction: column; gap: 16px">

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="background: #FFFFFF; border-radius: 6px; box-shadow: 0 1px 2px rgba(19,48,74,0.05), 0 6px 20px rgba(19,48,74,0.05); padding: 14px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 13px; color: #5B6B7A">মোট ওজন</span>
        <span style="font-family: 'Anek Bangla', sans-serif; font-weight: 700; font-size: 24px">১৭.৫ কেজি</span>
      </div>
      <div style="background: #FFFFFF; border-radius: 6px; box-shadow: 0 1px 2px rgba(19,48,74,0.05), 0 6px 20px rgba(19,48,74,0.05); padding: 14px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 13px; color: #5B6B7A">আপনি পাবেন</span>
        <span style="font-family: 'Anek Bangla', sans-serif; font-weight: 700; font-size: 24px; color: #0B7A5C">৳৭১০</span>
      </div>
    </div>

    <div style="background: #FFFFFF; border-radius: 6px; box-shadow: 0 1px 2px rgba(19,48,74,0.05), 0 6px 20px rgba(19,48,74,0.05); display: flex; flex-direction: column">
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid #EDEFEA">
        <span style="font-size: 14px; font-weight: 600">হিসাবের বিবরণ</span>
        <a href="#scale" style="font-size: 14px; font-weight: 500; text-decoration: none; display: flex; align-items: center; gap: 4px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 16l-5-5-8 8"></path></svg>
          পাল্লার ছবি দেখুন
        </a>
      </div>
      <sc-for list="{{lines}}" as="l" hint-placeholder-count="3">
        <div style="{{l.row}}">
          <div style="display: flex; flex-direction: column; gap: 1px">
            <span style="font-size: 15px; font-weight: 600">{{l.name}}</span>
            <span style="font-size: 13px; color: #5B6B7A">{{l.calc}}</span>
          </div>
          <span style="font-family: 'Anek Bangla', sans-serif; font-weight: 600; font-size: 17px">{{l.amount}}</span>
        </div>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="font-size: 14px; font-weight: 500; color: #5B6B7A">কীভাবে টাকা নেবেন?</div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{methods}}" as="m" hint-placeholder-count="3">
          <button onClick="{{m.pick}}" aria-pressed="{{m.on}}" style="{{m.style}}">
            <span style="font-size: 15px; font-weight: 600; color: #13304A">{{m.name}}</span>
            <span style="font-size: 12px; color: #5B6B7A; line-height: 1.3">{{m.sub}}</span>
          </button>
        </sc-for>
      </div>
    </div>
  </div>

  <div style="background: #FFFFFF; border-top: 1px solid #EDEFEA; padding: 14px 20px 24px; display: flex; flex-direction: column; gap: 6px">
    <a href="Receipt.dc.html" style="height: 56px; border-radius: 6px; background: #13304A; color: #FFFFFF; font-weight: 600; font-size: 16px; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
      ওজন ঠিক আছে
    </a>
    <a href="ReportProblem.dc.html" style="height: 48px; color: #A63D16; font-weight: 600; font-size: 15px; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16h.01"></path></svg>
      ওজনে সমস্যা? জানান
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { method: 1 };
}
renderVals() {
const lines = [
{ name: 'লোহা', calc: '৮.৫ কেজি × ৳৫০', amount: '৳৪২৫' },
{ name: 'পুরোনো পত্রিকা', calc: '৬ কেজি × ৳৩০', amount: '৳১৮০' },
{ name: 'প্লাস্টিক', calc: '৩ কেজি × ৳৩৫', amount: '৳১০৫' }
];
const base = 'height: 76px; box-sizing: border-box; border-radius: 6px; background: #FFFFFF; padding: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-align: center; cursor: pointer; font-family: inherit; ';
const data = [
{ name: 'হাতে ক্যাশ', sub: 'এখনই দেবেন' },
{ name: 'বিকাশ', sub: '০১৭XX-XXX৪৫৬' },
{ name: 'নগদ', sub: '০১৭XX-XXX৪৫৬' }
];
return {
lines: lines.map((l, i) => Object.assign({}, l, {
row: 'display: flex; justify-content: space-between; align-items: center; padding: 10px 16px;' + (i < lines.length - 1 ? ' border-bottom: 1px solid #EDEFEA;' : '')
})),
methods: data.map((m, i) => ({
name: m.name,
sub: m.sub,
on: this.state.method === i,
style: base + (this.state.method === i ? 'border: 1.5px solid #8A97A3;' : 'border: 1.5px solid #E3E6E0;'),
pick: () => this.setState({ method: i })
}))
};
}
}
</script>
</body>
</html>
