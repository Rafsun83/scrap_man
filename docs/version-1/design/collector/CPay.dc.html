<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>Pay and complete</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@500;600;700&amp;family=Hind+Siliguri:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#13304A}a:hover{color:#0B2236}
input::placeholder{color:#8A97A3}
.bw-in:focus{border-color:#8A97A3 !important}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F6F2; font-family: 'Hind Siliguri', sans-serif; color: #13304A; display: flex; flex-direction: column; overflow: hidden">

  <div style="padding: 56px 20px 0; display: flex; flex-direction: column; gap: 6px">
    <h1 style="margin: 0; font-family: 'Anek Bangla', sans-serif; font-weight: 600; font-size: 22px; line-height: 1.2">টাকা পরিশোধ</h1>
    <div style="display: flex; align-items: center; gap: 6px; font-size: 14px; color: #0B7A5C">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
      রাশেদা বেগম ওজন নিশ্চিত করেছেন
    </div>
  </div>

  <div style="flex: 1; min-height: 0; overflow: hidden; padding: 20px 20px 12px; display: flex; flex-direction: column; gap: 16px">

    <div style="background: #FFFFFF; border-radius: 6px; box-shadow: 0 1px 2px rgba(19,48,74,0.05), 0 6px 20px rgba(19,48,74,0.05); padding: 18px 16px; display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 13px; color: #5B6B7A">পরিশোধ করতে হবে</span>
      <span style="font-family: 'Anek Bangla', sans-serif; font-weight: 700; font-size: 36px; line-height: 1.1; color: #0B7A5C">৳৭১০</span>
      <span style="font-size: 13px; color: #5B6B7A">১৭.৫ কেজি: লোহা, পুরোনো পত্রিকা, প্লাস্টিক</span>
    </div>

    <div style="background: #FFFFFF; border-radius: 6px; border: 1.5px solid #E3E6E0; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <span style="font-size: 13px; color: #5B6B7A">গ্রাহক বেছে নিয়েছেন</span>
        <span style="font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 4px; background: #FBE7EF; color: #9B1F4F">বিকাশ</span>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center">
        <span style="font-family: 'Anek Bangla', sans-serif; font-weight: 600; font-size: 20px; letter-spacing: 0.02em">০১৭XX-XXX৪৫৬</span>
        <button style="height: 40px; padding: 0 12px; border-radius: 6px; border: 1.5px solid #E3E6E0; background: #FFFFFF; font: 600 14px 'Hind Siliguri', sans-serif; color: #13304A; display: flex; align-items: center; gap: 6px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"></rect><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"></path></svg>
          কপি
        </button>
      </div>
      <p style="margin: 0; font-size: 14px; line-height: 1.6; color: #5B6B7A">বিকাশ অ্যাপ থেকে এই নম্বরে ৳৭১০ পাঠান। তারপর বিকাশ থেকে পাওয়া ট্রানজেকশন আইডি নিচে লিখুন।</p>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="trx" style="font-size: 14px; font-weight: 500; color: #5B6B7A">ট্রানজেকশন আইডি (TrxID)</label>
      <input id="trx" class="bw-in" placeholder="যেমন 9KX7ABC123" value="{{trx}}" onInput="{{onTrx}}" style="height: 56px; box-sizing: border-box; border-radius: 6px; border: 1.5px solid #E3E6E0; background: #FFFFFF; padding: 0 16px; font: 600 17px 'Hind Siliguri', sans-serif; letter-spacing: 0.06em; text-transform: uppercase; color: #13304A; outline: none">
    </div>
  </div>

  <div style="background: #FFFFFF; border-top: 1px solid #EDEFEA; padding: 14px 20px 28px">
    <a href="CHome.dc.html" style="height: 56px; border-radius: 6px; background: #13304A; color: #FFFFFF; font-weight: 600; font-size: 16px; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
      পরিশোধ করেছি, পিকআপ শেষ
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { trx: '' };
}
renderVals() {
return {
trx: this.state.trx,
onTrx: (e) => this.setState({ trx: e.target.value })
};
}
}
</script>
</body>
</html>
