<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>Ledger</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@500;600;700&amp;family=Hind+Siliguri:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#13304A}a:hover{color:#0B2236}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F6F2; font-family: 'Hind Siliguri', sans-serif; color: #13304A; display: flex; flex-direction: column; overflow: hidden">

  <div style="flex: 1; min-height: 0; overflow: hidden; padding: 56px 20px 12px; display: flex; flex-direction: column; gap: 14px">
    <h1 style="margin: 0; font-family: 'Anek Bangla', sans-serif; font-weight: 600; font-size: 24px; line-height: 1.2">হিসাব</h1>

    <div role="group" aria-label="সময়কাল" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
        <button onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="{{t.style}}">{{t.label}}</button>
      </sc-for>
    </div>

    <div style="background: #FFFFFF; border-radius: 6px; box-shadow: 0 1px 2px rgba(19,48,74,0.05), 0 6px 20px rgba(19,48,74,0.05); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
      <div style="padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; border-right: 1px solid #EDEFEA">
        <span style="font-size: 12px; color: #5B6B7A">মোট পরিশোধ</span>
        <span style="font-family: 'Anek Bangla', sans-serif; font-weight: 700; font-size: 19px; color: #0B7A5C">{{paid}}</span>
      </div>
      <div style="padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; border-right: 1px solid #EDEFEA">
        <span style="font-size: 12px; color: #5B6B7A">সংগ্রহ</span>
        <span style="font-family: 'Anek Bangla', sans-serif; font-weight: 700; font-size: 19px">{{kg}}</span>
      </div>
      <div style="padding: 12px 14px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 12px; color: #5B6B7A">পিকআপ</span>
        <span style="font-family: 'Anek Bangla', sans-serif; font-weight: 700; font-size: 19px">{{count}}</span>
      </div>
    </div>

    <div style="background: #FFFFFF; border-radius: 6px; box-shadow: 0 1px 2px rgba(19,48,74,0.05), 0 6px 20px rgba(19,48,74,0.05); padding: 12px 16px; display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 14px; font-weight: 600">আজকের সংগ্রহ</span>
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="4">
        <div style="display: grid; grid-template-columns: 104px 1fr 56px; align-items: center; gap: 10px; font-size: 14px">
          <span>{{c.name}}</span>
          <div style="height: 8px; border-radius: 4px; background: #EEF0EC; overflow: hidden">
            <div style="height: 100%; border-radius: 4px; background: #13304A; width: {{c.pct}}"></div>
          </div>
          <span style="text-align: right; font-weight: 600">{{c.kg}}</span>
        </div>
      </sc-for>
      <div style="display: flex; gap: 8px; margin-top: 4px">
        <span style="font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 4px; background: #F5F6F2">ক্যাশে ৳৩৮০</span>
        <span style="font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 4px; background: #F5F6F2">বিকাশে ৳১,৪৮০</span>
      </div>
    </div>

    <div style="background: #FFFFFF; border-radius: 6px; box-shadow: 0 1px 2px rgba(19,48,74,0.05), 0 6px 20px rgba(19,48,74,0.05); display: flex; flex-direction: column">
      <div style="padding: 10px 16px; border-bottom: 1px solid #EDEFEA; font-size: 14px; font-weight: 600">আজকের পরিশোধ</div>
      <sc-for list="{{payments}}" as="p" hint-placeholder-count="3">
        <div style="{{p.row}}">
          <div style="display: flex; flex-direction: column; gap: 1px; min-width: 0">
            <span style="font-size: 15px; font-weight: 600">{{p.name}}</span>
            <span style="font-size: 12px; color: #5B6B7A; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.meta}}</span>
          </div>
          <span style="font-family: 'Anek Bangla', sans-serif; font-weight: 700; font-size: 16px">{{p.amount}}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <nav aria-label="প্রধান মেনু" style="background: #FFFFFF; border-top: 1px solid #EDEFEA; padding: 10px 16px 24px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px">
    <a href="CHome.dc.html" style="height: 56px; border-radius: 6px; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #5B6B7A">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"></path></svg>
      <span style="font-size: 12px; font-weight: 500">অনুরোধ</span>
    </a>
    <a href="CPickups.dc.html" style="height: 56px; border-radius: 6px; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #5B6B7A">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="17" r="3"></circle><circle cx="18" cy="17" r="3"></circle><path d="M6 17h4l3-7h4l1 7"></path><path d="M13 10l-2-4H8"></path></svg>
      <span style="font-size: 12px; font-weight: 500">আমার পিকআপ</span>
    </a>
    <a href="CLedger.dc.html" aria-current="page" style="height: 56px; border-radius: 6px; background: #EEF2F6; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #13304A">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="M8 8h8M8 12h8M8 16h5"></path></svg>
      <span style="font-size: 12px; font-weight: 600">হিসাব</span>
    </a>
    <a href="CProfile.dc.html" style="height: 56px; border-radius: 6px; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #5B6B7A">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>
      <span style="font-size: 12px; font-weight: 500">প্রোফাইল</span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { period: 0 };
}
renderVals() {
const p = this.state.period;
const totals = [
{ paid: '৳১,৮৬০', kg: '৪২ কেজি', count: '৩টি' },
{ paid: '৳৯,৪২০', kg: '২১৮ কেজি', count: '১৬টি' },
{ paid: '৳৩৮,৯৫০', kg: '৯১২ কেজি', count: '৬৪টি' }
];
const base = 'height: 44px; border-radius: 6px; background: #FFFFFF; color: #13304A; cursor: pointer; font: 500 15px \'Hind Siliguri\', sans-serif; ';
const pays = [
{ name: 'রাশেদা বেগম', meta: 'সকাল ১০:২০ · বিকাশ · TrxID 9KX7ABC123', amount: '৳৭১০' },
{ name: 'আব্দুল করিম', meta: 'সকাল ৮:৪০ · বিকাশ · TrxID 9KW2DEF456', amount: '৳৭৭০' },
{ name: 'শাহানা আক্তার', meta: 'সকাল ৭:৫৫ · হাতে ক্যাশ', amount: '৳৩৮০' }
];
return {
tabs: ['আজ', 'এই সপ্তাহ', 'এই মাস'].map((label, i) => ({
label: label,
on: p === i,
style: base + (p === i ? 'border: 1.5px solid #8A97A3; font-weight: 600;' : 'border: 1.5px solid #E3E6E0;'),
pick: () => this.setState({ period: i })
})),
paid: totals[p].paid,
kg: totals[p].kg,
count: totals[p].count,
cats: [
{ name: 'লোহা', kg: '২০ কেজি', pct: '100%' },
{ name: 'পুরোনো পত্রিকা', kg: '১৪ কেজি', pct: '70%' },
{ name: 'প্লাস্টিক', kg: '৪.৫ কেজি', pct: '23%' },
{ name: 'কার্টন', kg: '৩.৫ কেজি', pct: '18%' }
],
payments: pays.map((x, i) => Object.assign({}, x, {
row: 'display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 16px;' + (i < pays.length - 1 ? ' border-bottom: 1px solid #EDEFEA;' : '')
}))
};
}
}
</script>
</body>
</html>
