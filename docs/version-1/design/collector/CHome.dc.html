<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>Nearby requests</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@500;600;700&amp;family=Hind+Siliguri:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#13304A}a:hover{color:#0B2236}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F6F2; font-family: 'Hind Siliguri', sans-serif; color: #13304A; display: flex; flex-direction: column; overflow: hidden">

  <div style="flex: 1; min-height: 0; overflow: hidden; padding: 56px 20px 12px; display: flex; flex-direction: column; gap: 18px">

    <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <div style="font-size: 14px; color: #5B6B7A">শুভ সকাল,</div>
        <div style="font-family: 'Anek Bangla', sans-serif; font-weight: 600; font-size: 24px; line-height: 1.2">জসিম</div>
      </div>
      <button onClick="{{toggle}}" role="switch" aria-checked="{{online}}" aria-label="অনলাইন" style="{{pillStyle}}">
        <span style="{{dotStyle}}"></span>
        <span style="font-size: 15px; font-weight: 600">{{pillLabel}}</span>
      </button>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <div style="background: #FFFFFF; border-radius: 6px; box-shadow: 0 1px 2px rgba(19,48,74,0.05), 0 6px 20px rgba(19,48,74,0.05); padding: 12px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-family: 'Anek Bangla', sans-serif; font-weight: 700; font-size: 20px">৩টি</span>
        <span style="font-size: 12px; color: #5B6B7A">আজকের পিকআপ</span>
      </div>
      <div style="background: #FFFFFF; border-radius: 6px; box-shadow: 0 1px 2px rgba(19,48,74,0.05), 0 6px 20px rgba(19,48,74,0.05); padding: 12px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-family: 'Anek Bangla', sans-serif; font-weight: 700; font-size: 20px">৪২ কেজি</span>
        <span style="font-size: 12px; color: #5B6B7A">সংগ্রহ</span>
      </div>
      <div style="background: #FFFFFF; border-radius: 6px; box-shadow: 0 1px 2px rgba(19,48,74,0.05), 0 6px 20px rgba(19,48,74,0.05); padding: 12px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-family: 'Anek Bangla', sans-serif; font-weight: 700; font-size: 20px; color: #0B7A5C">৳১,৮৬০</span>
        <span style="font-size: 12px; color: #5B6B7A">পরিশোধ</span>
      </div>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <h2 style="margin: 0; font-family: 'Anek Bangla', sans-serif; font-weight: 600; font-size: 18px">কাছের অনুরোধ</h2>
      <span style="font-size: 13px; color: #5B6B7A">৩ কিমির মধ্যে</span>
    </div>

    <sc-if value="{{online}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <sc-for list="{{requests}}" as="r" hint-placeholder-count="3">
          <a href="CRequest.dc.html" style="background: #FFFFFF; border-radius: 6px; border: 1.5px solid #E3E6E0; padding: 14px; display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: #13304A">
            <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
              <div style="display: flex; align-items: center; gap: 8px; min-width: 0">
                <span style="font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.area}}</span>
                <span style="font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 4px; background: {{r.tagBg}}; color: {{r.tagFg}}; white-space: nowrap">{{r.tag}}</span>
              </div>
              <span style="font-size: 14px; font-weight: 600; white-space: nowrap">{{r.distance}}</span>
            </div>
            <div style="display: flex; flex-wrap: wrap; gap: 6px">
              <sc-for list="{{r.items}}" as="it" hint-placeholder-count="2">
                <span style="font-size: 13px; padding: 3px 8px; border-radius: 4px; background: #F5F6F2">{{it}}</span>
              </sc-for>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #5B6B7A">
              <span>{{r.slot}} · {{r.weight}}</span>
              <span style="color: #13304A; font-weight: 600; display: flex; align-items: center; gap: 2px">দেখুন
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
              </span>
            </div>
          </a>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{offline}}" hint-placeholder-val="{{ false }}">
      <div style="background: #FFFFFF; border: 1px solid #E3E6E0; border-radius: 6px; padding: 28px 20px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
        <div style="width: 56px; height: 56px; border-radius: 6px; background: #F5F6F2; display: flex; align-items: center; justify-content: center">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#5B6B7A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v9"></path><path d="M6.3 7.3a8 8 0 1 0 11.4 0"></path></svg>
        </div>
        <span style="font-size: 16px; font-weight: 600">আপনি এখন অফলাইনে</span>
        <span style="font-size: 14px; color: #5B6B7A; line-height: 1.5">নতুন অনুরোধ পেতে উপরের সুইচটি চালু করুন।</span>
      </div>
    </sc-if>
  </div>

  <nav aria-label="প্রধান মেনু" style="background: #FFFFFF; border-top: 1px solid #EDEFEA; padding: 10px 16px 24px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px">
    <a href="CHome.dc.html" aria-current="page" style="height: 56px; border-radius: 6px; background: #EEF2F6; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #13304A">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"></path></svg>
      <span style="font-size: 12px; font-weight: 600">অনুরোধ</span>
    </a>
    <a href="CPickups.dc.html" style="height: 56px; border-radius: 6px; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #5B6B7A">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="17" r="3"></circle><circle cx="18" cy="17" r="3"></circle><path d="M6 17h4l3-7h4l1 7"></path><path d="M13 10l-2-4H8"></path></svg>
      <span style="font-size: 12px; font-weight: 500">আমার পিকআপ</span>
    </a>
    <a href="CLedger.dc.html" style="height: 56px; border-radius: 6px; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #5B6B7A">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="M8 8h8M8 12h8M8 16h5"></path></svg>
      <span style="font-size: 12px; font-weight: 500">হিসাব</span>
    </a>
    <a href="CProfile.dc.html" style="height: 56px; border-radius: 6px; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #5B6B7A">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>
      <span style="font-size: 12px; font-weight: 500">প্রোফাইল</span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { online: true };
}
renderVals() {
const on = this.state.online;
const fresh = { tag: 'নতুন', tagBg: '#FFF4D6', tagFg: '#8A5A00' };
const photo = { tag: 'ছবি আছে', tagBg: '#E8ECF1', tagFg: '#13304A' };
return {
online: on,
offline: !on,
toggle: () => this.setState({ online: !on }),
pillLabel: on ? 'অনলাইন' : 'অফলাইন',
pillStyle: 'height: 48px; padding: 0 14px; border-radius: 6px; background: #FFFFFF; color: #13304A; cursor: pointer; font-family: inherit; display: flex; align-items: center; gap: 8px; border: 1.5px solid ' + (on ? '#8A97A3' : '#E3E6E0') + ';',
dotStyle: 'width: 10px; height: 10px; border-radius: 50%; background: ' + (on ? '#0B7A5C' : '#C9CFC6') + ';',
requests: [
Object.assign({ area: 'মিরপুর ১০, ব্লক সি', distance: '১.২ কিমি', items: ['লোহা', 'পুরোনো পত্রিকা', 'প্লাস্টিক'], slot: 'আজ, সকাল ৯টা–১২টা', weight: '৫–১৫ কেজি' }, fresh),
Object.assign({ area: 'মিরপুর ১১, এভিনিউ ৫', distance: '১.৮ কিমি', items: ['কার্টন', 'প্লাস্টিক'], slot: 'আজ, দুপুর ১২টা–৩টা', weight: '৫ কেজির কম' }, fresh),
Object.assign({ area: 'পল্লবী, সেকশন ১২', distance: '২.৬ কিমি', items: ['অ্যালুমিনিয়াম', 'ইলেকট্রনিক্স'], slot: 'আগামীকাল, সকাল', weight: '১৫ কেজির বেশি' }, photo)
]
};
}
}
</script>
</body>
</html>
